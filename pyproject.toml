[project]
name = "itachi-video-maker"
version = "0.1.0"
description = "Generate videos using ElevenLabs and fal.ai"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "magic-hour>=0.101.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.optional-dependencies]
local-audio = [
    "kokoro-onnx>=0.6.1",
    "pywhispercpp>=1.5.1",
    "soundfile>=0.14.0",
]
