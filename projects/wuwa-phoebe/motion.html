<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Who is Phoebe? motion scenes</title>
<script>
// Official Kuro Games art (see presskit/SOURCE.txt), cropped only and credited.
window.ART = Object.fromEntries(['vert', 'card_full', 'card_face', 'report', 'staff', 'locket', 'close'].map(n => [n, `presskit/${n}.jpg`]));
</script>
<script src="../../motion/lib.js"></script>
<script src="../../motion/wuwa.js"></script>
</head>
<body>
<script>
// Captions are burned in around y = 1300-1420, so keep that band calm.
// Phoebe's palette: candle gold and the Order's deep blue.
const LIGHT = ['#FFFFFF', '#FFF4D6', '#F2CB6B'];
const LGLOW = 'rgba(255,210,120,0.9)';
const pplate = (ctx, str, x, y, t, t0, size = 44) =>
  plate(ctx, str, x, y, t, t0, size, { border: 'rgba(255,220,150,0.9)', bg: 'rgba(12,24,60,0.74)', color: '#FFF8E8' });
const pserif = (ctx, str, x, y, size, opts = {}) => serif(ctx, str, x, y, size, { fill: LIGHT, glowColor: LGLOW, ...opts });
const fadeIn = (t, t0, d = 0.5) => ease.outCubic(prog(t, t0, d));

function order(ctx, { wash = 0.08 } = {}) {
  ctx.fillStyle = `rgba(10,25,70,${wash})`; ctx.fillRect(0, 0, W, H);
  vignette(ctx, 0.7);
  credit(ctx, 'Art © Kuro Games · official Wuthering Waves art');
}
function band(ctx, y0 = 920, y1 = 1290, a = 0.65) {
  ctx.fillStyle = vgrad(ctx, y0, y1, [[0, 'rgba(10,20,50,0)'], [0.3, `rgba(10,20,50,${a})`], [0.8, `rgba(10,20,50,${a})`], [1, 'rgba(10,20,50,0)']]);
  ctx.fillRect(0, y0, W, y1 - y0);
}
// Floating motes of warm light.
function motes(ctx, t, { n = 28, seed = 4, a = 1 } = {}) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const x = r() * W + Math.sin(t * 0.5 + i) * 30, y = ((r() * H - t * (15 + r() * 35)) % H + H) % H, s = 2 + r() * 4;
    glow(ctx, x, y, s * 6, '255,220,150', 0.25 * a);
    ctx.fillStyle = `rgba(255,245,215,${a * (0.4 + 0.5 * Math.sin(t * 2 + i) ** 2)})`;
    ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
  }
}
// A tiny Echo: round, ghostly, two dot eyes, bobbing.
function echo(ctx, x, y, s, t, ph = 0, hue = 200) {
  withT(ctx, x, y + Math.abs(Math.sin(t * 6 + ph)) * -18 * s, s, Math.sin(t * 3 + ph) * 0.12, () => {
    glow(ctx, 0, 0, 70, '170,215,255', 0.4);
    const g = ctx.createRadialGradient(-10, -14, 4, 0, 0, 46);
    g.addColorStop(0, `hsl(${hue},80%,96%)`); g.addColorStop(1, `hsl(${hue},70%,72%)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(-40, 10); ctx.quadraticCurveTo(-42, -42, 0, -44); ctx.quadraticCurveTo(42, -42, 40, 10);
    ctx.quadraticCurveTo(30, 34, 20, 26); ctx.quadraticCurveTo(10, 38, 0, 28); ctx.quadraticCurveTo(-10, 38, -20, 26); ctx.quadraticCurveTo(-30, 34, -40, 10); ctx.fill();
    ctx.fillStyle = '#1C2850';
    ctx.beginPath(); ctx.arc(-13, -8, 5, 0, Math.PI * 2); ctx.arc(13, -8, 5, 0, Math.PI * 2); ctx.fill();
  });
}
function pizza(ctx, x, y, s, rot = 0) {
  withT(ctx, x, y, s, rot, () => {
    ctx.fillStyle = '#E8B04A'; ctx.beginPath(); ctx.moveTo(0, 90); ctx.lineTo(-70, -60); ctx.quadraticCurveTo(0, -95, 70, -60); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#F7D774'; ctx.beginPath(); ctx.moveTo(0, 74); ctx.lineTo(-58, -48); ctx.quadraticCurveTo(0, -76, 58, -48); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#C8402E'; [[-18, -30], [20, -20], [0, 15], [-8, 45]].forEach(([px, py]) => { ctx.beginPath(); ctx.arc(px, py, 11, 0, Math.PI * 2); ctx.fill(); });
  });
}

function framed(ctx, name, x, y, w, h, { alpha = 1, r = 26, border = 'rgba(255,220,150,0.95)' } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 50;
  ctx.fillStyle = '#000'; ctx.fill(rectPath(x, y, w, h, r));
  ctx.shadowBlur = 0;
  ctx.save(); ctx.clip(rectPath(x, y, w, h, r));
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(ARTS[name].img, x, y, w, h);
  ctx.restore();
  ctx.lineWidth = 5; ctx.strokeStyle = border; ctx.stroke(rectPath(x, y, w, h, r));
  ctx.restore();
}
function backdrop(ctx, name, t, dur, fx = 0.5, fy = 0.5, dark = 0.4) {
  cover(ctx, name, t, dur, [fx, fy, 1.25], [fx, fy, 1.35], { filter: 'blur(18px) saturate(1.2)' });
  ctx.fillStyle = `rgba(10,20,50,${dark})`; ctx.fillRect(0, 0, W, H);
}
function roundInset(ctx, name, sx, sy, sr, x, y, R, col = '255,220,150') {
  glow(ctx, x, y, R * 1.5, col, 0.45);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.clip();
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(ARTS[name].img, sx - sr, sy - sr, 2 * sr, 2 * sr, x - R, y - R, 2 * R, 2 * R);
  ctx.restore();
  ctx.lineWidth = 7; ctx.strokeStyle = `rgba(${col},0.95)`; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke();
}
function badge(ctx, t, t0, x, y, label, col, r = 80) {
  const k = pop(t, t0, 0.5);
  if (k <= 0) return;
  withT(ctx, x, y, k, 0, () => {
    glow(ctx, 0, 0, r * 1.8, col, 0.5 + 0.15 * Math.sin(t * 4));
    ctx.fillStyle = 'rgba(12,24,60,0.82)';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = `rgb(${col})`; ctx.stroke();
    serif(ctx, label, 0, 4, r * 0.36, { fill: ['#FFFFFF', `rgb(${col})`], glowColor: `rgba(${col},0.9)` });
  });
  ring(ctx, t, t0, x, y, { maxR: r * 3, life: 0.6, color: col, width: 10 });
}
function fiveStars(ctx, t, t0, y) {
  for (let i = 0; i < 5; i++) {
    const k = pop(t, t0 - 0.2 + i * 0.07, 0.4);
    if (k > 0) withT(ctx, W / 2 + (i - 2) * 92, y, k, 0, () => {
      glow(ctx, 0, 0, 60, '255,210,120', 0.6);
      ctx.fillStyle = '#FFD27A'; ctx.fill(starPath(38, 16));
      ctx.lineWidth = 3; ctx.strokeStyle = '#7A4A10'; ctx.stroke(starPath(38, 16));
    });
  }
}
// A golden swing arc with sparkles.
function swingArc(ctx, t, t0, cx, cy, R, a0 = -2.4, sweep = 2.0) {
  const k = prog(t, t0, 0.45);
  if (k <= 0 || k >= 1.3) return;
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = `rgba(255,230,160,${0.95 * (1 - Math.max(0, k - 0.6) / 0.4)})`; ctx.lineWidth = 16;
  ctx.shadowColor = 'rgba(255,210,120,1)'; ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.arc(cx, cy, R, a0, a0 + sweep * ease.outCubic(Math.min(1, k))); ctx.stroke(); ctx.restore();
  if (k > 0.5) burst(ctx, t, t0 + 0.25, cx + Math.cos(a0 + sweep) * R, cy + Math.sin(a0 + sweep) * R, { n: 18, color: '255,230,160', speed: 420, life: 0.6, size: 7 });
}

window.scenes = [
  // 0 — One gentle swing of her staff. This is Phoebe, Acolyte of the Order of the Deep.
  (ctx, t, dur) => {
    const tAng = when('anger', 0, 0.8), tSwing = when('swing', 0, 2.8), tPh = when('phoebe', 0, 4.8), tAco = when('acolyte', 0, 5.7);
    cover(ctx, 'vert', t, dur, [0.45, 0.28, 2.2], [0.5, 0.45, 1.08]);
    motes(ctx, t, { n: 22 });
    order(ctx, { wash: 0.04 });
    band(ctx, 900, 1290, 0.6 * fadeIn(t, 0, 0.6));
    const early = 1 - prog(t, tPh - 0.5, 0.4);
    if (early > 0) {
      ctx.save(); ctx.globalAlpha = early;
      if (t > tAng - 0.3) pserif(ctx, 'knock the anger out', W / 2, 1010, 76, { italic: true, alpha: fadeIn(t, tAng - 0.3) });
      if (t > tSwing - 0.3) pplate(ctx, 'ONE GENTLE SWING', W / 2, 1130, t, tSwing - 0.3, 42);
      ctx.restore();
      swingArc(ctx, t, tSwing - 0.2, W / 2, 640, 330);
    }
    const kc = prog(t, tPh - 0.2, 0.6);
    if (kc > 0) {
      ctx.fillStyle = `rgba(255,240,210,${0.3 * (1 - kc)})`; ctx.fillRect(0, 0, W, H);
      withT(ctx, W / 2, 1050, lerp(1.25, 1, ease.outCubic(kc)), 0, () => pserif(ctx, 'PHOEBE', 0, 0, 156, { alpha: ease.outCubic(kc) }));
    }
    if (t > tAco - 0.3) pplate(ctx, 'ACOLYTE OF THE ORDER OF THE DEEP', W / 2, 1195, t, tAco - 0.3, 34);
  },

  // 1 — A child alone on a dark shore walks toward a light: the Order takes her in.
  (ctx, t, dur) => {
    const tShore = when('shore', 0, 3.0), tLight = when('light', 0, 5.6), tAco = when('acolytes', 0, 6.6), tIn = when('in', 1, 9.0);
    const kw = prog(t, tAco - 0.3, 1.0);
    // Night shore: dark sky, faint waves.
    ctx.fillStyle = vgrad(ctx, 0, H, [[0, '#02040C'], [0.6, '#081428'], [1, '#0E1F3A']]); ctx.fillRect(-40, -40, W + 80, H + 80);
    for (let i = 0; i < 6; i++) {
      const y = 1120 + i * 34;
      ctx.strokeStyle = `rgba(140,180,230,${0.18 + 0.05 * i})`; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let x = -20; x <= W + 20; x += 20) ctx.lineTo(x, y + Math.sin(x / 70 + t * 1.5 + i) * 8);
      ctx.stroke();
    }
    // A small figure walking along the shore.
    const wx = lerp(140, 520, prog(t, 0.5, tLight));
    ctx.fillStyle = 'rgba(200,215,240,0.75)';
    ctx.beginPath(); ctx.arc(wx, 1050 + Math.abs(Math.sin(t * 5)) * -4, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fill(rectPath(wx - 10, 1062, 20, 42, 8));
    // The light ahead.
    const kl = fadeIn(t, tLight - 0.4, 0.8);
    if (kl > 0) { glow(ctx, 760, 860, 120 + 380 * kl, '255,225,160', 0.7 * kl); ctx.fillStyle = `rgba(255,248,225,${kl})`; ctx.beginPath(); ctx.arc(760, 860, 16 * kl, 0, Math.PI * 2); ctx.fill(); }
    // The Order takes her in: warm light washes into their art.
    if (kw > 0) {
      ctx.save(); ctx.globalAlpha = kw; backdrop(ctx, 'card_full', t, dur, 0.5, 0.3, 0.35); ctx.restore();
      framed(ctx, 'card_full', 160, 260 + (1 - kw) * 60, 760, 873, { alpha: kw });
    }
    motes(ctx, t, { n: 18, seed: 9, a: 0.4 + 0.6 * kw });
    order(ctx, { wash: 0.04 });
    band(ctx, 1080, 1300, 0.6);
    if (t > tShore - 0.5 && kw < 1) pserif(ctx, 'alone, on a dark shore', W / 2, 1180, 68, { italic: true, alpha: fadeIn(t, tShore - 0.5) * (1 - kw), fill: ['#FFFFFF', '#DDE8FF', '#9DB8F0'], glowColor: 'rgba(140,170,240,0.9)' });
    if (t > tAco - 0.2) pplate(ctx, 'THE ORDER TOOK HER IN', W / 2, 1185, t, tAco - 0.2, 42);
  },

  // 2 — Light split into prisms; a soft glow on the darkest nights.
  (ctx, t, dur) => {
    const tLight = when('light', 0, 1.5), tPri = when('prisms', 0, 3.2), tNight = when('nights', 0, 5.2), tGlow = when('glow', 0, 7.8);
    backdrop(ctx, 'card_full', t, dur, 0.5, 0.3, 0.45);
    const kn = Math.sin(clamp((t - tNight + 0.4) / 2.4) * Math.PI) * (1 - prog(t, tGlow - 0.3, 0.6));
    if (kn > 0) { ctx.fillStyle = `rgba(2,4,16,${0.6 * kn})`; ctx.fillRect(0, 0, W, H); }
    roundInset(ctx, 'card_face', 500, 410, 360, W / 2, 600, 330 * ease.outBack(prog(t, 0, 0.6)));
    // A prism refracts her light into a rainbow fan.
    const kp = prog(t, tPri - 0.4, 0.8);
    if (kp > 0) {
      const px = W / 2, py = 1060;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const cols = ['255,80,80', '255,170,60', '255,240,90', '90,230,120', '80,170,255', '170,110,255'];
      cols.forEach((c, i) => [0, Math.PI].forEach(base => {
        const a = base + (base ? -1 : 1) * ((i - 2.5) * 0.07 + 0.12) + Math.sin(t) * 0.02, len = 620 * ease.outCubic(kp);
        const g = ctx.createLinearGradient(px, py, px + Math.cos(a) * len, py + Math.sin(a) * len);
        g.addColorStop(0, `rgba(${c},0.5)`); g.addColorStop(1, `rgba(${c},0)`);
        ctx.strokeStyle = g; ctx.lineWidth = 30; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * len, py + Math.sin(a) * len); ctx.stroke();
      }));
      ctx.restore();
      withT(ctx, px, py, ease.outBack(Math.min(1, kp * 1.5)), t * 0.3, () => {
        glow(ctx, 0, 0, 90, '255,255,255', 0.6);
        ctx.fillStyle = 'rgba(220,240,255,0.85)'; ctx.fill(polyPath([[0, -50], [44, 28], [-44, 28]]));
        ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 3; ctx.stroke(polyPath([[0, -50], [44, 28], [-44, 28]]));
      });
    }
    const kg = prog(t, tGlow - 0.4, 0.8);
    if (kg > 0) glow(ctx, W / 2, 800, 900, '255,220,160', 0.45 * kg);
    motes(ctx, t, { n: 30, seed: 13, a: 0.5 + 0.5 * kg });
    order(ctx, { wash: 0.03 });
    band(ctx, 1120, 1300, 0.6);
    if (t > tLight - 0.3) pplate(ctx, 'SHE CREATES LIGHT', W / 2, 210, t, tLight - 0.3, 42);
    if (t > tNight - 0.3 && t < tGlow - 0.3) pserif(ctx, 'on the darkest nights...', W / 2, 1210, 64, { italic: true, alpha: fadeIn(t, tNight - 0.3) });
    if (t > tGlow - 0.3) pserif(ctx, 'a soft glow', W / 2, 1210, 74, { italic: true, alpha: fadeIn(t, tGlow - 0.3) });
  },

  // 3 — A pizza argument at Margherita's... one swing of her staff settles it.
  (ctx, t, dur) => {
    const tFight = when('fight', 0, 0.4), tPizza = when('pizza', 0, 1.5), tCalm = when('calm', 0, 4.7), tSwing = when('swing', 0, 6.0), tSet = when('settles', 0, 7.0);
    const kf = prog(t, tFight - 0.2, 0.4) * (1 - prog(t, tSwing, 0.4));
    const [sx, sy] = [Math.sin(t * 43) * 5 * kf, Math.cos(t * 37) * 5 * kf];
    ctx.save(); ctx.translate(sx, sy);
    backdrop(ctx, 'close', t, dur, 0.5, 0.4, 0.45);
    const kc = fadeIn(t, 0, 0.6) * (1 - prog(t, tCalm - 0.4, 0.4));
    if (kc > 0) framed(ctx, 'staff', 40, 380, 1000, 480, { alpha: kc, r: 20 });
    // The fight: a pizza slice and angry sparks.
    if (kf > 0) {
      pizza(ctx, W / 2, 1010, 1.1 * ease.outBack(prog(t, tPizza - 0.3, 0.5)), Math.sin(t * 9) * 0.15);
      [[300, 960], [780, 960]].forEach(([x, y], i) => {
        withT(ctx, x, y, kf, 0, () => {
          ctx.strokeStyle = '#FF5A5A'; ctx.lineWidth = 8; ctx.lineCap = 'round';
          for (let j = 0; j < 4; j++) { const a = j * Math.PI / 2 + Math.PI / 4 + Math.sin(t * 12 + i) * 0.1; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 14, Math.sin(a) * 14); ctx.lineTo(Math.cos(a) * 40, Math.sin(a) * 40); ctx.stroke(); }
        });
      });
    }
    // Her staff lifts from the card and swings.
    const kl = ease.outBack(prog(t, tCalm - 0.4, 0.6));
    if (kl > 0) {
      roundInset(ctx, 'staff', 188, 247, 150, lerp(40 + 188, W / 2, kl), lerp(380 + 247, 640, kl), lerp(150, 260, kl));
      swingArc(ctx, t, tSwing - 0.2, W / 2, 640, 340, -0.6, 2.2);
    }
    const ks = prog(t, tSet - 0.2, 0.8);
    if (ks > 0) { glow(ctx, W / 2, 800, 800, '255,230,170', 0.4 * Math.sin(Math.min(1, ks) * Math.PI)); }
    ctx.restore();
    motes(ctx, t, { n: 18, seed: 17, a: 0.7 });
    order(ctx, { wash: 0.03 });
    band(ctx, 1080, 1300, 0.65);
    if (t > tPizza - 0.3 && t < tCalm - 0.3) pplate(ctx, 'A PIZZA ARGUMENT', W / 2, 220, t, tPizza - 0.3, 42);
    if (t > tCalm - 0.3 && t < tSet - 0.3) pserif(ctx, '"Please... calm down!"', W / 2, 1180, 70, { italic: true, alpha: fadeIn(t, tCalm - 0.3) });
    if (t > tSet - 0.3) withT(ctx, W / 2, 1180, pop(t, tSet - 0.3, 0.45), 0, () => pplate(ctx, 'SETTLED', 0, 0, t, tSet - 0.3, 46));
  },

  // 4 — Echoes adore her and follow her like eager puppies.
  (ctx, t, dur) => {
    const tAd = when('adore', 0, 0.5), tTell = when('tell', 0, 1.9), tFol = when('follow', 0, 4.5), tPup = when('puppies', 0, 6.0);
    backdrop(ctx, 'close', t, dur, 0.5, 0.5, 0.4);
    framed(ctx, 'close', 40, 230 + (1 - fadeIn(t, 0, 0.6)) * 60, 1000, 800, { alpha: fadeIn(t, 0, 0.6) });
    // A little parade of Echoes trotting along the bottom.
    const kp = fadeIn(t, tFol - 0.4, 0.6);
    if (kp > 0) {
      const lead = lerp(1250, 150, prog(t, tFol - 0.4, 3.2));
      for (let i = 0; i < 6; i++) echo(ctx, lead + i * 190, 1140, 1.5 - i * 0.08, t, i * 0.8, 190 + i * 22);
    }
    motes(ctx, t, { n: 16, seed: 21, a: 0.6 });
    order(ctx, { wash: 0.03 });
    if (t > tAd - 0.3) pplate(ctx, 'ECHOES ADORE HER', W / 2, 160, t, tAd - 0.3, 42);
    if (t > tTell - 0.3 && t < tFol - 0.4) pserif(ctx, 'she knows every one', W / 2, 1150, 66, { italic: true, alpha: fadeIn(t, tTell - 0.3) });
    if (t > tPup - 0.3) withT(ctx, W / 2, 1050, pop(t, tPup - 0.3, 0.45), 0, () => pplate(ctx, 'LIKE EAGER PUPPIES', 0, 0, t, tPup - 0.3, 34));
  },

  // 5 — Five-star Spectro; favorite food: pizza (Pizza Day at the orphanage).
  (ctx, t, dur) => {
    const tStar = when('fivestar', 0, 0.4), tSpec = when('spectro', 0, 1.0), tFood = when('food', 0, 3.9), tPizza = when('pizza', 0, 4.7), tDay = when('day', 0, 7.1);
    backdrop(ctx, 'card_full', t, dur, 0.5, 0.3, 0.45);
    motes(ctx, t, { n: 20, seed: 29, a: 0.7 });
    const p1 = 1 - prog(t, tFood - 0.6, 0.4);
    roundInset(ctx, 'card_face', 500, 410, 360, W / 2, lerp(600, 520, 1 - p1), lerp(330, 280, 1 - p1) * ease.outBack(prog(t, 0, 0.6)));
    if (p1 > 0) {
      ctx.save(); ctx.globalAlpha = p1;
      fiveStars(ctx, t, tStar, 1010);
      badge(ctx, t, tSpec - 0.2, W / 2, 1175, 'SPECTRO', '255,225,130', 78);
      ctx.restore();
    }
    if (t > tPizza - 0.3) {
      const kz = ease.outBack(prog(t, tPizza - 0.3, 0.5));
      pizza(ctx, W / 2, 1000, 1.25 * kz, Math.sin(t * 2) * 0.1);
      ring(ctx, t, tPizza - 0.2, W / 2, 1000, { maxR: 500, life: 0.6, color: '255,220,140', width: 12 });
    }
    order(ctx, { wash: 0.03 });
    if (t > tFood - 0.3) pplate(ctx, 'FAVORITE FOOD', W / 2, 160, t, tFood - 0.3, 42);
    if (t > tDay - 0.4) withT(ctx, W / 2, 1210, pop(t, tDay - 0.4, 0.45), -0.03, () => pserif(ctx, 'Pizza Day!', 0, 0, 92, { italic: true }));
  },

  // 6 — Outro: has her gentle swing ever calmed you down?
  (ctx, t, dur) => {
    const tSwing = when('swing', 0, 1.3), tCalm = when('calmed', 0, 2.0), tComments = when('comments', 0, 3.8);
    cover(ctx, 'vert', t, dur, [0.45, 0.3, 1.4], [0.45, 0.32, 1.55]);
    motes(ctx, t, { n: 26, seed: 31 });
    order(ctx, { wash: 0.05 });
    band(ctx, 900, 1290, 0.6 * fadeIn(t, 0, 0.6));
    if (t > tSwing - 0.4) pserif(ctx, 'Has her gentle swing', W / 2, 1000, 80, { italic: true, alpha: fadeIn(t, tSwing - 0.4, 0.6) });
    if (t > tCalm - 0.3) pserif(ctx, 'ever calmed you down?', W / 2, 1105, 80, { italic: true, alpha: fadeIn(t, tCalm - 0.3, 0.6) });
    if (t > tComments - 0.3) pplate(ctx, 'TELL ME IN THE COMMENTS', W / 2, 1215, t, tComments - 0.3, 38);
  },
];
</script>
</body>
</html>
