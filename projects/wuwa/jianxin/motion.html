<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Who is Jianxin? motion scenes</title>
<script>
// Official Kuro Games art (see presskit/SOURCE.txt), cropped only and credited.
window.ART = Object.fromEntries(['vert', 'key', 'story', 'report', 'mirrors'].map(n => [n, `presskit/${n}.jpg`]));
</script>
<script src="../../../motion/lib.js"></script>
<script src="../../../motion/wuwa/wuwa.js"></script>
</head>
<body>
<script>
// Captions are burned in around y = 1300-1420, so keep that band calm.
// Jianxin's palette: ink-wash jade and cloud white (yin and yang).
const JADE = ['#FFFFFF', '#E4FFF3', '#6FDDB0'];
const JGLOW = 'rgba(90,220,170,0.9)';
const WARM = ['#FFFFFF', '#FFF1CC', '#E8B65A'];
const xplate = (ctx, str, x, y, t, t0, size = 44) =>
  plate(ctx, str, x, y, t, t0, size, { border: 'rgba(140,230,190,0.9)', bg: 'rgba(8,22,20,0.8)', color: '#EFFFF8' });
const xserif = (ctx, str, x, y, size, opts = {}) => serif(ctx, str, x, y, size, { fill: JADE, glowColor: JGLOW, ...opts });
const fadeIn = (t, t0, d = 0.5) => ease.outCubic(prog(t, t0, d));

function ink(ctx, { wash = 0.06 } = {}) {
  ctx.fillStyle = `rgba(0,30,25,${wash})`; ctx.fillRect(0, 0, W, H);
  vignette(ctx, 0.68);
  credit(ctx, 'Art © Kuro Games · official Wuthering Waves art');
}
function band(ctx, y0 = 920, y1 = 1290, a = 0.65) {
  ctx.fillStyle = vgrad(ctx, y0, y1, [[0, 'rgba(6,20,18,0)'], [0.3, `rgba(6,20,18,${a})`], [0.8, `rgba(6,20,18,${a})`], [1, 'rgba(6,20,18,0)']]);
  ctx.fillRect(0, y0, W, y1 - y0);
}
// Chi wisps: soft curling air currents.
function chi(ctx, t, k = 1, { n = 14, seed = 7, cx = W / 2, cy = 700 } = {}) {
  if (k <= 0) return;
  const r = rng(seed);
  ctx.save(); ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const a0 = r() * Math.PI * 2 + t * (0.5 + r() * 0.6), rad = 220 + r() * 420, len = 0.6 + r() * 0.8;
    ctx.strokeStyle = `rgba(190,255,225,${(0.2 + 0.35 * r()) * k})`; ctx.lineWidth = 3 + r() * 6;
    ctx.beginPath(); ctx.arc(cx, cy, rad, a0, a0 + len); ctx.stroke();
  }
  ctx.restore();
}
const motes = (ctx, t, n = 22, seed = 5, a = 1) => { ctx.save(); ctx.globalAlpha *= a; sparks(ctx, t, { n, seed, color: '170,255,215', rise: 40, size: 4 }); ctx.restore(); };
// Yin-yang emblem.
function yinyang(ctx, x, y, R, rot) {
  withT(ctx, x, y, 1, rot, () => {
    ctx.fillStyle = '#F4FFF9'; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#10201C'; ctx.beginPath(); ctx.arc(0, 0, R, -Math.PI / 2, Math.PI / 2); ctx.arc(0, R / 2, R / 2, Math.PI / 2, -Math.PI / 2, true); ctx.arc(0, -R / 2, R / 2, Math.PI / 2, -Math.PI / 2); ctx.fill();
    ctx.fillStyle = '#F4FFF9'; ctx.beginPath(); ctx.arc(0, R / 2, R / 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#10201C'; ctx.beginPath(); ctx.arc(0, -R / 2, R / 7, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(140,230,190,0.9)'; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
  });
}
function flatbread(ctx, x, y, s, t) {
  withT(ctx, x, y, s, 0, () => {
    glow(ctx, 0, 0, 160, '255,210,130', 0.4);
    ctx.fillStyle = '#D9A25A'; ctx.beginPath(); ctx.arc(0, 0, 110, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#E9BE78'; ctx.beginPath(); ctx.arc(0, 0, 86, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#B97A34'; const r = rng(3); for (let i = 0; i < 18; i++) { ctx.beginPath(); ctx.arc((r() - 0.5) * 150, (r() - 0.5) * 150, 4, 0, Math.PI * 2); ctx.fill(); }
    for (let i = 0; i < 3; i++) {
      const ph = ((t * 0.6 + i / 3) % 1);
      ctx.strokeStyle = `rgba(255,255,255,${0.5 * Math.sin(ph * Math.PI)})`; ctx.lineWidth = 8; ctx.lineCap = 'round';
      const bx = (i - 1) * 50, by = -120 - ph * 120;
      ctx.beginPath(); ctx.moveTo(bx, by + 60); ctx.bezierCurveTo(bx - 20, by + 30, bx + 20, by + 10, bx, by - 20); ctx.stroke();
    }
  });
}
function leaf(ctx, x, y, s, rot) {
  withT(ctx, x, y, s, rot, () => {
    ctx.fillStyle = '#4FBF7F'; ctx.beginPath(); ctx.moveTo(0, -60); ctx.quadraticCurveTo(40, 0, 0, 60); ctx.quadraticCurveTo(-40, 0, 0, -60); ctx.fill();
    ctx.strokeStyle = '#2E7D52'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -55); ctx.lineTo(0, 55); ctx.stroke();
  });
}
function note(ctx, x, y, s, a) {
  ctx.save(); ctx.globalAlpha *= a; xserif(ctx, '♪', x, y, 60 * s); ctx.restore();
}

function framed(ctx, name, x, y, w, h, { alpha = 1, r = 26, border = 'rgba(140,230,190,0.95)' } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 50;
  ctx.fillStyle = '#000'; ctx.fill(rectPath(x, y, w, h, r));
  ctx.shadowBlur = 0;
  ctx.save(); ctx.clip(rectPath(x, y, w, h, r));
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(ARTS[name].img, x, y, w, h);
  ctx.restore();
  ctx.lineWidth = 5; ctx.strokeStyle = border; ctx.stroke(rectPath(x, y, w, h, r));
  ctx.restore();
}
function backdrop(ctx, name, t, dur, fx = 0.5, fy = 0.5, dark = 0.4) {
  cover(ctx, name, t, dur, [fx, fy, 1.25], [fx, fy, 1.35], { filter: 'blur(18px) saturate(1.1)' });
  ctx.fillStyle = `rgba(6,20,18,${dark})`; ctx.fillRect(0, 0, W, H);
}
function roundInset(ctx, name, sx, sy, sr, x, y, R, col = '140,230,190') {
  glow(ctx, x, y, R * 1.5, col, 0.45);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.clip();
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(ARTS[name].img, sx - sr, sy - sr, 2 * sr, 2 * sr, x - R, y - R, 2 * R, 2 * R);
  ctx.restore();
  ctx.lineWidth = 7; ctx.strokeStyle = `rgba(${col},0.95)`; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke();
}
function badge(ctx, t, t0, x, y, label, col, r = 80) {
  const k = pop(t, t0, 0.5);
  if (k <= 0) return;
  withT(ctx, x, y, k, 0, () => {
    glow(ctx, 0, 0, r * 1.8, col, 0.5 + 0.15 * Math.sin(t * 4));
    ctx.fillStyle = 'rgba(8,22,20,0.85)';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = `rgb(${col})`; ctx.stroke();
    serif(ctx, label, 0, 4, r * 0.36, { fill: ['#FFFFFF', `rgb(${col})`], glowColor: `rgba(${col},0.9)` });
  });
  ring(ctx, t, t0, x, y, { maxR: r * 3, life: 0.6, color: col, width: 10 });
}

window.scenes = [
  // 0 — "I am Jianxin, successor of Fengyiquan. Would you mind sparring with me?"
  (ctx, t, dur) => {
    const tSucc = when('successor', 0, 1.6), tSpar = when('sparring', 0, 4.2), tJx = when('jianxin', 1, 5.8), tWW = when('wuthering', 0, 7.1);
    cover(ctx, 'vert', t, dur, [0.45, 0.17, 2.2], [0.5, 0.42, 1.06]);
    chi(ctx, t, 0.8, { cx: 540, cy: 600 });
    motes(ctx, t, 20, 3, 0.7);
    ink(ctx, { wash: 0.03 });
    band(ctx, 900, 1290, 0.6 * fadeIn(t, 0, 0.6));
    const early = 1 - prog(t, tJx - 0.5, 0.4);
    if (early > 0) {
      ctx.save(); ctx.globalAlpha = early;
      if (t > tSucc - 0.3) xplate(ctx, 'SUCCESSOR OF FENGYIQUAN', W / 2, 1000, t, tSucc - 0.3, 38);
      if (t > tSpar - 0.3) withT(ctx, W / 2, 1130, pop(t, tSpar - 0.3, 0.45), -0.03, () => xserif(ctx, '"Spar with me?"', 0, 0, 84, { italic: true }));
      ctx.restore();
    }
    const kc = prog(t, tJx - 0.2, 0.6);
    if (kc > 0) {
      ctx.fillStyle = `rgba(230,255,245,${0.3 * (1 - kc)})`; ctx.fillRect(0, 0, W, H);
      withT(ctx, W / 2, 1050, lerp(1.25, 1, ease.outCubic(kc)), 0, () => xserif(ctx, 'JIANXIN', 0, 0, 150, { alpha: ease.outCubic(kc) }));
    }
    if (t > tWW - 0.3) xplate(ctx, 'WUTHERING WAVES', W / 2, 1195, t, tWW - 0.3, 38);
  },

  // 1 — Her secret: give it your all, leave yourself no escape, look death in the eye.
  (ctx, t, dur) => {
    const tSec = when('secret', 0, 0.4), tGive = when('give', 0, 3.1), tEsc = when('escape', 0, 5.9), tDeath = when('death', 0, 7.6);
    backdrop(ctx, 'story', t, dur, 0.5, 0.4, 0.45);
    const kc = fadeIn(t, 0, 0.6);
    framed(ctx, 'story', 40, 230 + (1 - kc) * 60, 1000, 685, { alpha: kc });
    // Her eyes sharpen on "death": a focusing ring.
    if (t > tDeath - 0.3) { const k = prog(t, tDeath - 0.3, 0.6); ctx.save(); ctx.lineWidth = 6; ctx.strokeStyle = `rgba(140,230,190,${1 - k * 0.5})`; ctx.beginPath(); ctx.arc(503, 447, lerp(420, 150, ease.outCubic(k)), 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
    motes(ctx, t, 14, 9, 0.5);
    ink(ctx, { wash: 0.02 });
    band(ctx, 960, 1300, 0.72);
    if (t > tSec - 0.3) xplate(ctx, 'HER SECRET TO VICTORY', W / 2, 160, t, tSec - 0.3, 42);
    [[tGive, 'Give it your all.', 1030], [tEsc, 'Leave no escape.', 1120], [tDeath, 'Look death in the eye.', 1215]].forEach(([t0, s, y], i) => {
      if (t > t0 - 0.3) xserif(ctx, s, W / 2, y, i === 2 ? 64 : 58, { italic: true, alpha: fadeIn(t, t0 - 0.3), fill: i === 2 ? WARM : JADE, glowColor: i === 2 ? 'rgba(255,190,90,0.9)' : JGLOW });
    });
  },

  // 2 — An exorcism: she forgot the incantation, so she used her fists. No more demon reports.
  (ctx, t, dur) => {
    const tEx = when('exorcise', 0, 1.4), tForgot = when('forgot', 0, 3.4), tFists = when('fists', 0, 6.6), tNo = when('no', 0, 8.4);
    const [sx, sy] = shakeAt(t, tFists, 26, 5);
    ctx.save(); ctx.translate(sx, sy);
    backdrop(ctx, 'key', t, dur, 0.5, 0.4, 0.5);
    // A paper talisman whose characters fade out ("forgot the incantation").
    const kt = fadeIn(t, tEx - 0.4, 0.5) * (1 - prog(t, tFists - 0.3, 0.3));
    if (kt > 0) {
      withT(ctx, W / 2, 600, kt, Math.sin(t * 2) * 0.04, () => {
        ctx.fillStyle = '#F2E2A8'; ctx.fill(rectPath(-120, -300, 240, 600, 10));
        ctx.lineWidth = 6; ctx.strokeStyle = '#C0392B'; ctx.stroke(rectPath(-100, -280, 200, 560, 6));
        const fade = 1 - prog(t, tForgot, 1.2);
        ctx.fillStyle = `rgba(160,30,30,${fade})`; ctx.font = `900 64px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.strokeStyle = `rgba(160,30,30,${fade})`; ctx.lineWidth = 12; ctx.lineCap = 'round';
        for (let i = 0; i < 4; i++) { const y = -220 + i * 90; ctx.beginPath(); ctx.moveTo(-50, y); ctx.lineTo(40, y + 10); ctx.moveTo(0, y - 20); ctx.lineTo(-10, y + 40); ctx.moveTo(20, y + 20); ctx.lineTo(50, y + 45); ctx.stroke(); }
        if (fade < 0.9) { ctx.fillStyle = `rgba(160,30,30,${1 - fade})`; ctx.font = `900 120px ${FONT}`; ctx.fillText('?', 0, 60); }
      });
    }
    if (t > tFists - 0.25) {
      flash(ctx, t, tFists - 0.1, { color: '230,255,240', peak: 0.7, life: 0.4 });
      burst(ctx, t, tFists - 0.1, W / 2, 620, { n: 50, color: '160,255,210', speed: 1100, life: 0.8, size: 10 });
      ring(ctx, t, tFists - 0.1, W / 2, 620, { maxR: 900, life: 0.6, color: '160,255,210', width: 24 });
      ctx.save(); ctx.globalAlpha *= 1 - prog(t, tNo - 0.8, 0.4);
      withT(ctx, W / 2, 620, pop(t, tFists - 0.25, 0.35), -0.1, () => xserif(ctx, 'POW!', 0, 0, 170, { fill: WARM, glowColor: 'rgba(255,190,90,0.95)' }));
      ctx.restore();
    }
    ctx.restore();
    motes(ctx, t, 14, 13, 0.5);
    ink(ctx, { wash: 0.02 });
    band(ctx, 1060, 1300, 0.72);
    if (t > tEx - 0.3 && t < tForgot - 0.2) xplate(ctx, 'AN EXORCISM REQUEST', W / 2, 1180, t, tEx - 0.3, 42);
    if (t > tForgot - 0.2 && t < tFists - 0.3) xserif(ctx, '...forgot the incantation', W / 2, 1180, 64, { italic: true, alpha: fadeIn(t, tForgot - 0.2) });
    if (t > tNo - 0.4) xplate(ctx, 'NO MORE DEMON REPORTS', W / 2, 1180, t, tNo - 0.4, 40);
  },

  // 3 — No perfect leaf to whistle with, so she whistled with a strand of her hair.
  (ctx, t, dur) => {
    const tWh = when('whistle', 0, 1.2), tLeaf = when('leaf', 0, 1.8), tCouldnt = when('couldnt', 0, 3.2), tHair = when('hair', 0, 6.2), tStrand = when('strand', 0, 5.2);
    backdrop(ctx, 'vert', t, dur, 0.5, 0.3, 0.35);
    roundInset(ctx, 'story', 520, 260, 240, W / 2, 520, 300 * ease.outBack(prog(t, 0, 0.6)));
    // Leaves fall away (none was right).
    const kl = prog(t, tLeaf - 0.3, 3.0) * (1 - prog(t, tStrand - 0.3, 0.4));
    if (kl > 0) { const r = rng(4); for (let i = 0; i < 8; i++) { const k = (kl * 2 + i / 8) % 1; leaf(ctx, 150 + r() * 780, 300 + k * 700, 0.9, k * 6 + i); } }
    // A single strand of hair, then musical notes.
    const kh = fadeIn(t, tStrand - 0.3, 0.6);
    if (kh > 0) {
      ctx.save(); ctx.strokeStyle = `rgba(230,240,235,${kh})`; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.shadowColor = 'rgba(160,255,210,1)'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.moveTo(330, 940); ctx.bezierCurveTo(480, 880, 600, 1000, 750, 930); ctx.stroke(); ctx.restore();
      if (t > tHair - 0.2) for (let i = 0; i < 6; i++) { const k = ((t - tHair + 0.2) * 0.5 + i / 6) % 1; note(ctx, 300 + i * 100 + Math.sin(k * 6 + i) * 30, 880 - k * 500, 1, Math.sin(k * Math.PI)); }
    }
    motes(ctx, t, 14, 17, 0.5);
    ink(ctx, { wash: 0.02 });
    band(ctx, 1060, 1300, 0.72);
    if (t > tWh - 0.3 && t < tCouldnt - 0.3) xplate(ctx, 'WHISTLE WITH A LEAF', W / 2, 1180, t, tWh - 0.3, 42);
    if (t > tCouldnt - 0.3 && t < tStrand - 0.3) xserif(ctx, 'no leaf was right...', W / 2, 1180, 66, { italic: true, alpha: fadeIn(t, tCouldnt - 0.3) });
    if (t > tStrand - 0.3) withT(ctx, W / 2, 1180, pop(t, tStrand - 0.3, 0.45), 0, () => xplate(ctx, 'SO SHE USED HER HAIR', 0, 0, t, tStrand - 0.3, 42));
  },

  // 4 — Every move 3,000 times a day, any weather; even cooking: Chi controls the heat.
  (ctx, t, dur) => {
    const tThree = when('three', 0, 1.7), tDay = when('day', 0, 2.9), tWeather = when('weather', 0, 4.1), tCook = when('cooking', 0, 5.3), tChi = when('chi', 0, 7.4), tHeat = when('heat', 0, 8.5);
    backdrop(ctx, 'key', t, dur, 0.5, 0.45, 0.45);
    const p1 = 1 - prog(t, tCook - 0.5, 0.4);
    if (p1 > 0) {
      ctx.save(); ctx.globalAlpha = p1;
      framed(ctx, 'key', 150, 200, 780, 860);
      // Rain on "any weather".
      const kr = fadeIn(t, tWeather - 0.4, 0.4);
      if (kr > 0) { const r = rng(9); ctx.strokeStyle = `rgba(200,230,255,${0.6 * kr})`; ctx.lineWidth = 3; for (let i = 0; i < 60; i++) { const x = r() * W, y = ((r() * H + t * 1400) % H); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 10, y + 40); ctx.stroke(); } }
      ctx.restore();
    }
    if (t > tCook - 0.4) {
      // A wok over a flame that brightens and dims with her Chi.
      const kc = ease.outBack(prog(t, tCook - 0.4, 0.5)), heat = 0.5 + 0.5 * Math.sin(t * 3) * prog(t, tChi - 0.3, 0.5);
      withT(ctx, W / 2, 720, kc, 0, () => {
        glow(ctx, 0, 140, 220 + 160 * heat, '255,150,60', 0.4 + 0.3 * heat);
        for (let i = -2; i <= 2; i++) { ctx.fillStyle = `rgba(255,${140 + 60 * heat | 0},60,0.9)`; ctx.beginPath(); ctx.moveTo(i * 50 - 25, 200); ctx.quadraticCurveTo(i * 50, 120 - 60 * heat - Math.abs(Math.sin(t * 9 + i)) * 30, i * 50 + 25, 200); ctx.fill(); }
        ctx.fillStyle = '#2B2B2B'; ctx.beginPath(); ctx.ellipse(0, 60, 260, 90, 0, 0, Math.PI); ctx.fill();
        ctx.fillStyle = '#444'; ctx.fill(rectPath(240, 40, 180, 26, 12));
      });
      chi(ctx, t, prog(t, tChi - 0.3, 0.5), { cx: W / 2, cy: 760, n: 12 });
    }
    motes(ctx, t, 14, 21, 0.5);
    ink(ctx, { wash: 0.02 });
    band(ctx, 1040, 1300, 0.72);
    // Counter.
    if (t > tThree - 0.4 && p1 > 0) {
      const n = Math.floor(3000 * ease.outCubic(prog(t, tThree - 0.4, 1.6)));
      ctx.save(); ctx.globalAlpha = p1; withT(ctx, W / 2, 1120, pop(t, tThree - 0.4, 0.4), 0, () => xserif(ctx, `× ${n.toLocaleString('en-US')}`, 0, 0, 110, { fill: WARM, glowColor: 'rgba(255,190,90,0.9)' })); ctx.restore();
    }
    if (t > tDay - 0.3 && p1 > 0) { ctx.save(); ctx.globalAlpha = p1; xplate(ctx, 'EVERY MOVE, EVERY DAY', W / 2, 1235, t, tDay - 0.3, 38); ctx.restore(); }
    if (t > tCook - 0.3) xplate(ctx, 'EVEN COOKING IS TRAINING', W / 2, 1110, t, tCook - 0.3, 40);
    if (t > tChi - 0.3) xserif(ctx, 'Chi controls the heat', W / 2, 1215, 60, { italic: true, alpha: fadeIn(t, tChi - 0.3) });
  },

  // 5 — She followed the scent of fresh flatbread up the mountain — and joined the sect.
  (ctx, t, dur) => {
    const tJoke = when('jokes', 0, 0.6), tScent = when('scent', 0, 2.7), tBread = when('flatbread', 0, 3.4), tMount = when('mountain', 0, 4.7), tSect = when('sect', 0, 7.0);
    // Ink-wash mountain with a winding path.
    ctx.fillStyle = vgrad(ctx, 0, H, [[0, '#E9F4EE'], [0.6, '#BFD8CB'], [1, '#7FA894']]); ctx.fillRect(-40, -40, W + 80, H + 80);
    ctx.fillStyle = 'rgba(40,70,60,0.85)'; ctx.beginPath(); ctx.moveTo(0, 1100); ctx.lineTo(260, 700); ctx.lineTo(420, 820); ctx.lineTo(560, 380); ctx.lineTo(760, 760); ctx.lineTo(900, 640); ctx.lineTo(1080, 900); ctx.lineTo(1080, 1300); ctx.lineTo(0, 1300); ctx.fill();
    ctx.fillStyle = 'rgba(20,40,35,0.9)'; ctx.fill(rectPath(520, 320, 80, 60, 6)); ctx.fill(polyPath([[505, 330], [560, 290], [615, 330]]));
    // Path from bottom to the temple and a small figure following it.
    const path = [[180, 1240], [380, 1080], [300, 960], [480, 860], [440, 720], [560, 560], [560, 400]];
    const kp = prog(t, tScent - 0.4, tSect - tScent);
    ctx.save(); ctx.strokeStyle = 'rgba(255,240,210,0.8)'; ctx.lineWidth = 6; ctx.setLineDash([16, 14]);
    ctx.beginPath(); path.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke(); ctx.restore();
    const seg = kp * (path.length - 1), i0 = Math.min(path.length - 2, Math.floor(seg)), f = seg - i0;
    const fx = lerp(path[i0][0], path[i0 + 1][0], f), fy = lerp(path[i0][1], path[i0 + 1][1], f);
    ctx.fillStyle = '#16302A'; ctx.beginPath(); ctx.arc(fx, fy - 40 + Math.abs(Math.sin(t * 8)) * -4, 14, 0, Math.PI * 2); ctx.fill(); ctx.fill(rectPath(fx - 10, fy - 28, 20, 34, 8));
    if (t > tBread - 0.4) flatbread(ctx, 760, 300, ease.outBack(prog(t, tBread - 0.4, 0.5)) * 0.9, t);
    if (t > tSect - 0.3) { glow(ctx, 560, 350, 260, '255,230,170', 0.6 * fadeIn(t, tSect - 0.3)); ring(ctx, t, tSect - 0.3, 560, 350, { maxR: 500, life: 0.7, color: '255,220,150', width: 10 }); }
    ink(ctx, { wash: 0.0 });
    band(ctx, 1080, 1300, 0.65);
    if (t > tJoke - 0.3 && t < tScent - 0.4) xplate(ctx, 'HER MASTER JOKES...', W / 2, 1180, t, tJoke - 0.3, 42);
    if (t > tScent - 0.4 && t < tSect - 0.3) xserif(ctx, 'following the scent of flatbread', W / 2, 1180, 54, { italic: true, alpha: fadeIn(t, tScent - 0.4), fill: WARM, glowColor: 'rgba(255,190,90,0.9)' });
    if (t > tSect - 0.3) withT(ctx, W / 2, 1180, pop(t, tSect - 0.3, 0.45), 0, () => xplate(ctx, 'AND JOINED THE SECT', 0, 0, t, tSect - 0.3, 44));
  },

  // 6 — Aero Resonator. Would you spar with Jianxin?
  (ctx, t, dur) => {
    const tAero = when('aero', 0, 0.5), tSpar = when('spar', 0, 2.9), tComments = when('comments', 0, 5.0);
    cover(ctx, 'vert', t, dur, [0.5, 0.25, 1.45], [0.5, 0.27, 1.6]);
    chi(ctx, t, 0.7, { cx: 540, cy: 500 });
    motes(ctx, t, 22, 31);
    ink(ctx, { wash: 0.04 });
    band(ctx, 900, 1290, 0.65 * fadeIn(t, 0, 0.6));
    const p1 = 1 - prog(t, tSpar - 0.8, 0.4);
    if (p1 > 0) { ctx.save(); ctx.globalAlpha = p1; yinyang(ctx, W / 2, 1060, 80 * pop(t, 0.1, 0.5), t * 0.8); badge(ctx, t, tAero - 0.2, W / 2, 1060, 'AERO', '110,240,180', 84); ctx.restore(); }
    if (t > tSpar - 0.6) xserif(ctx, 'Would you spar', W / 2, 1000, 88, { italic: true, alpha: fadeIn(t, tSpar - 0.6, 0.6) });
    if (t > tSpar - 0.2) xserif(ctx, 'with Jianxin?', W / 2, 1105, 88, { italic: true, alpha: fadeIn(t, tSpar - 0.2, 0.6), fill: WARM, glowColor: 'rgba(255,190,90,0.9)' });
    if (t > tComments - 0.3) xplate(ctx, 'TELL ME IN THE COMMENTS', W / 2, 1215, t, tComments - 0.3, 38);
  },
];
</script>
