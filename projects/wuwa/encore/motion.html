<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Who is Encore? motion scenes</title>
<script>
// Official Kuro Games art (see presskit/SOURCE.txt), cropped only and credited.
window.ART = Object.fromEntries(['vert', 'key', 'story', 'report', 'woolies', 'liberation', 'dolls'].map(n => [n, `presskit/${n}.jpg`]));
</script>
<script src="../../../motion/lib.js"></script>
<script src="../../../motion/wuwa/wuwa.js"></script>
</head>
<body>
<script>
// Captions are burned in around y = 1300-1420, so keep that band calm.
// Encore's palette: storybook pink and candy cream, with Fusion orange sparks.
const PINK = ['#FFFFFF', '#FFE3EE', '#FF7FAF'];
const PGLOW = 'rgba(255,110,170,0.9)';
const CREAM = ['#FFFFFF', '#FFF4D6', '#FFC24A'];
const eplate = (ctx, str, x, y, t, t0, size = 44) =>
  plate(ctx, str, x, y, t, t0, size, { border: 'rgba(255,160,200,0.95)', bg: 'rgba(60,14,38,0.78)', color: '#FFF2F8' });
const eserif = (ctx, str, x, y, size, opts = {}) => serif(ctx, str, x, y, size, { fill: PINK, glowColor: PGLOW, ...opts });
const fadeIn = (t, t0, d = 0.5) => ease.outCubic(prog(t, t0, d));

function candy(ctx, { wash = 0.06 } = {}) {
  ctx.fillStyle = `rgba(80,10,50,${wash})`; ctx.fillRect(0, 0, W, H);
  vignette(ctx, 0.62);
  credit(ctx, 'Art © Kuro Games · official Wuthering Waves art');
}
function band(ctx, y0 = 920, y1 = 1290, a = 0.65) {
  ctx.fillStyle = vgrad(ctx, y0, y1, [[0, 'rgba(45,8,30,0)'], [0.3, `rgba(45,8,30,${a})`], [0.8, `rgba(45,8,30,${a})`], [1, 'rgba(45,8,30,0)']]);
  ctx.fillRect(0, y0, W, y1 - y0);
}
// Floating sparkles and little hearts.
function sparkles(ctx, t, { n = 26, seed = 4, a = 1 } = {}) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const x = r() * W + Math.sin(t * 0.7 + i) * 30, y = ((r() * H - t * (25 + r() * 35)) % H + H) % H, s = 0.5 + r() * 0.7;
    withT(ctx, x, y, s, Math.sin(t + i) * 0.3, () => {
      ctx.globalAlpha *= a * (0.5 + 0.5 * Math.sin(t * 2 + i) ** 2);
      if (i % 3 === 0) { ctx.fillStyle = '#FF9CC4'; heart(ctx, 0, 0, 16); }
      else { ctx.fillStyle = '#FFF2C8'; ctx.fill(starPath(14, 5, 4)); }
    });
  }
}
function heart(ctx, x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.6, y - s * 0.2, x - s * 0.6, y - s * 1.3, x, y - s * 0.4);
  ctx.bezierCurveTo(x + s * 0.6, y - s * 1.3, x + s * 1.6, y - s * 0.2, x, y + s * 0.9); ctx.fill();
}
// Omelet roll with two sausages (one a little burnt).
function omelet(ctx, x, y, s, burntK) {
  withT(ctx, x, y, s, 0, () => {
    glow(ctx, 0, 0, 220, '255,220,140', 0.35);
    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.ellipse(0, 40, 260, 70, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#F7D04A'; ctx.fill(rectPath(-200, -50, 400, 110, 50));
    ctx.fillStyle = '#FBE38A'; ctx.fill(rectPath(-180, -40, 360, 30, 15));
    [[-80, '#C9553A'], [80, burntK > 0 ? `rgb(${Math.round(lerp(201, 70, burntK))},${Math.round(lerp(85, 35, burntK))},${Math.round(lerp(58, 20, burntK))})` : '#C9553A']].forEach(([dx, col]) => {
      ctx.fillStyle = col; ctx.fill(rectPath(dx - 70, -110, 140, 56, 28));
      ctx.strokeStyle = 'rgba(255,240,220,0.6)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(dx - 40, -92); ctx.lineTo(dx + 30, -92); ctx.stroke();
    });
  });
}
function shootingStar(ctx, t, t0, x0, y0, x1, y1) {
  const k = prog(t, t0, 0.9);
  if (k <= 0 || k >= 1) return;
  const x = lerp(x0, x1, ease.outCubic(k)), y = lerp(y0, y1, ease.outCubic(k));
  const g = ctx.createLinearGradient(x0, y0, x, y);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,245,210,0.95)');
  ctx.save(); ctx.strokeStyle = g; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(lerp(x0, x, 0.4), lerp(y0, y, 0.4)); ctx.lineTo(x, y); ctx.stroke(); ctx.restore();
  glow(ctx, x, y, 90, '255,240,200', 0.8);
  ctx.fillStyle = '#FFFBEA'; ctx.fill(new Path2D(`M ${x} ${y - 24} L ${x + 7} ${y - 7} L ${x + 24} ${y} L ${x + 7} ${y + 7} L ${x} ${y + 24} L ${x - 7} ${y + 7} L ${x - 24} ${y} L ${x - 7} ${y - 7} Z`));
}

function framed(ctx, name, x, y, w, h, { alpha = 1, r = 26, border = 'rgba(255,160,200,0.95)' } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.shadowColor = 'rgba(80,0,40,0.45)'; ctx.shadowBlur = 50;
  ctx.fillStyle = '#000'; ctx.fill(rectPath(x, y, w, h, r));
  ctx.shadowBlur = 0;
  ctx.save(); ctx.clip(rectPath(x, y, w, h, r));
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(ARTS[name].img, x, y, w, h);
  ctx.restore();
  ctx.lineWidth = 5; ctx.strokeStyle = border; ctx.stroke(rectPath(x, y, w, h, r));
  ctx.restore();
}
function backdrop(ctx, name, t, dur, fx = 0.5, fy = 0.5, dark = 0.3) {
  cover(ctx, name, t, dur, [fx, fy, 1.25], [fx, fy, 1.35], { filter: 'blur(18px) saturate(1.2)' });
  ctx.fillStyle = `rgba(60,10,40,${dark})`; ctx.fillRect(0, 0, W, H);
}
function roundInset(ctx, name, sx, sy, sr, x, y, R, col = '255,160,200') {
  glow(ctx, x, y, R * 1.5, col, 0.45);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.clip();
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(ARTS[name].img, sx - sr, sy - sr, 2 * sr, 2 * sr, x - R, y - R, 2 * R, 2 * R);
  ctx.restore();
  ctx.lineWidth = 7; ctx.strokeStyle = `rgba(${col},0.95)`; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke();
}
function badge(ctx, t, t0, x, y, label, col, r = 80) {
  const k = pop(t, t0, 0.5);
  if (k <= 0) return;
  withT(ctx, x, y, k, 0, () => {
    glow(ctx, 0, 0, r * 1.8, col, 0.5 + 0.15 * Math.sin(t * 4));
    ctx.fillStyle = 'rgba(60,14,38,0.85)';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = `rgb(${col})`; ctx.stroke();
    serif(ctx, label, 0, 4, r * 0.36, { fill: ['#FFFFFF', `rgb(${col})`], glowColor: `rgba(${col},0.9)` });
  });
  ring(ctx, t, t0, x, y, { maxR: r * 3, life: 0.6, color: col, width: 10 });
}
function fiveStars(ctx, t, t0, y) {
  for (let i = 0; i < 5; i++) {
    const k = pop(t, t0 - 0.2 + i * 0.07, 0.4);
    if (k > 0) withT(ctx, W / 2 + (i - 2) * 92, y, k, 0, () => {
      glow(ctx, 0, 0, 60, '255,210,120', 0.6);
      ctx.fillStyle = '#FFD27A'; ctx.fill(starPath(38, 16));
      ctx.lineWidth = 3; ctx.strokeStyle = '#7A4A10'; ctx.stroke(starPath(38, 16));
    });
  }
}

window.scenes = [
  // 0 — "Hi there! I'm Encore from the Black Shores! Wanna go on an adventure with me and my Woolies?"
  (ctx, t, dur) => {
    const tHi = when('hi', 0, 0.0), tBS = when('black', 0, 2.0), tAdv = when('adventure', 0, 4.0), tWool = when('woolies', 0, 5.4), tEnc = when('encore', 1, 6.7), tWW = when('wuthering', 0, 7.9);
    cover(ctx, 'vert', t, dur, [0.53, 0.35, 1.9], [0.5, 0.45, 1.06]);
    sparkles(ctx, t, { n: 24 });
    candy(ctx, { wash: 0.03 });
    band(ctx, 900, 1290, 0.6 * fadeIn(t, 0, 0.6));
    const early = 1 - prog(t, tEnc - 0.5, 0.4);
    if (early > 0) {
      ctx.save(); ctx.globalAlpha = early;
      if (t > tHi - 0.1) withT(ctx, W / 2, 1000, pop(t, tHi - 0.1, 0.45), -0.04, () => eserif(ctx, '"Hi there!"', 0, 0, 92, { italic: true }));
      if (t > tBS - 0.3 && t < tAdv - 0.2) eplate(ctx, 'FROM THE BLACK SHORES', W / 2, 1120, t, tBS - 0.3, 40);
      if (t > tAdv - 0.2) eserif(ctx, 'wanna go on an adventure?', W / 2, 1125, 60, { italic: true, alpha: fadeIn(t, tAdv - 0.2), fill: CREAM, glowColor: 'rgba(255,190,90,0.9)' });
      ctx.restore();
    }
    const kc = prog(t, tEnc - 0.2, 0.6);
    if (kc > 0) {
      ctx.fillStyle = `rgba(255,230,240,${0.35 * (1 - kc)})`; ctx.fillRect(0, 0, W, H);
      withT(ctx, W / 2, 1050, lerp(1.25, 1, ease.outCubic(kc)), 0, () => eserif(ctx, 'ENCORE', 0, 0, 160, { alpha: ease.outCubic(kc) }));
    }
    if (t > tWW - 0.3) eplate(ctx, 'WUTHERING WAVES', W / 2, 1195, t, tWW - 0.3, 38);
  },

  // 1 — Cosmos the short-tempered knight; Cloudy the kind-hearted princess finding her courage.
  (ctx, t, dur) => {
    const tCos = when('cosmos', 0, 1.1), tKn = when('knight', 0, 2.9), tClo = when('cloudy', 0, 4.7), tPr = when('princess', 0, 6.4), tCour = when('courage', 0, 7.9);
    backdrop(ctx, 'story', t, dur, 0.5, 0.4, 0.25);
    sparkles(ctx, t, { n: 16, seed: 9, a: 0.6 });
    framed(ctx, 'story', 40, 220 + (1 - fadeIn(t, 0, 0.6)) * 60, 1000, 685, { alpha: fadeIn(t, 0, 0.6) });
    // Spotlights on each Wooly: Cosmos (black, top right) then Cloudy (white, bottom left).
    const spot = (x, y, r, k) => { if (k > 0) { ctx.save(); ctx.lineWidth = 8; ctx.strokeStyle = `rgba(255,220,120,${0.95 * k})`; ctx.setLineDash([22, 14]); ctx.lineDashOffset = -t * 60; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); } };
    spot(730, 360, 150, fadeIn(t, tCos - 0.3, 0.4) * (1 - prog(t, tClo - 0.4, 0.3)));
    spot(160, 700, 160, fadeIn(t, tClo - 0.3, 0.4));
    candy(ctx, { wash: 0.02 });
    band(ctx, 960, 1300, 0.72);
    if (t > tCos - 0.3 && t < tClo - 0.4) { eplate(ctx, 'COSMOS', W / 2, 1060, t, tCos - 0.3, 48); if (t > tKn - 0.4) eserif(ctx, 'the short-tempered knight', W / 2, 1185, 58, { italic: true, alpha: fadeIn(t, tKn - 0.4) }); }
    if (t > tClo - 0.3) { eplate(ctx, 'CLOUDY', W / 2, 1060, t, tClo - 0.3, 48); if (t > tPr - 0.4) eserif(ctx, 'the princess finding her courage', W / 2, 1185, 52, { italic: true, alpha: fadeIn(t, tPr - 0.4) }); }
  },

  // 2 — A shooting-star wish for sausage omelet rolls; next morning there they were (one a bit burnt).
  (ctx, t, dur) => {
    const tStar = when('shooting', 0, 1.2), tSaus = when('sausage', 0, 2.2), tTwo = when('two', 0, 3.7), tMorn = when('morning', 0, 6.4), tBurnt = when('burnt', 0, 9.2);
    const day = prog(t, tMorn - 0.6, 0.9);
    ctx.fillStyle = vgrad(ctx, 0, H, [[0, '#1C1446'], [0.6, '#5A2D6E'], [1, '#B0507A']]); ctx.fillRect(-40, -40, W + 80, H + 80);
    if (day > 0) { ctx.fillStyle = vgrad(ctx, 0, H, [[0, `rgba(255,214,170,${day})`], [0.6, `rgba(255,190,200,${day})`], [1, `rgba(255,160,190,${day})`]]); ctx.fillRect(-40, -40, W + 80, H + 80); }
    // Night stars.
    if (day < 1) { const r = rng(3); for (let i = 0; i < 60; i++) { ctx.fillStyle = `rgba(255,255,255,${(1 - day) * (0.3 + 0.6 * Math.sin(t * 2 + i) ** 2)})`; ctx.beginPath(); ctx.arc(r() * W, r() * 900, 1.5 + r() * 2.5, 0, Math.PI * 2); ctx.fill(); } }
    shootingStar(ctx, t, tStar - 0.3, 980, 120, 220, 600);
    // Thought bubble with the wish, then the real breakfast in the morning.
    const kw = fadeIn(t, tSaus - 0.4, 0.5) * (1 - day);
    if (kw > 0) {
      ctx.save(); ctx.globalAlpha = kw;
      ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.beginPath(); ctx.ellipse(W / 2, 700, 380, 260, 0, 0, Math.PI * 2); ctx.fill();
      [[300, 1010, 40], [240, 1090, 24]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); });
      omelet(ctx, W / 2, 730, 1.05, 0);
      if (t > tTwo - 0.3) { eserif(ctx, '× 2!', W / 2 + 270, 560, 72, { fill: CREAM, glowColor: 'rgba(255,190,90,0.9)', alpha: fadeIn(t, tTwo - 0.3) }); }
      ctx.restore();
    }
    if (day > 0) {
      omelet(ctx, W / 2, 760, 1.5 * ease.outBack(prog(t, tMorn - 0.3, 0.6)), prog(t, tBurnt - 0.6, 0.6));
      glow(ctx, 880, 260, 260, '255,230,160', 0.6 * day);
    }
    sparkles(ctx, t, { n: 14, seed: 13, a: 0.5 });
    candy(ctx, { wash: 0.02 });
    band(ctx, 1060, 1300, 0.65);
    if (t > tStar - 0.3 && t < tMorn - 0.6) eplate(ctx, 'A SHOOTING-STAR WISH', W / 2, 1180, t, tStar - 0.3, 42);
    if (t > tMorn - 0.3 && t < tBurnt - 0.4) eplate(ctx, 'THE NEXT MORNING...', W / 2, 1180, t, tMorn - 0.3, 42);
    if (t > tBurnt - 0.4) withT(ctx, W / 2, 1180, pop(t, tBurnt - 0.4, 0.45), -0.03, () => eserif(ctx, '(one a little burnt)', 0, 0, 62, { italic: true, fill: CREAM, glowColor: 'rgba(255,190,90,0.9)' }));
  },

  // 3 — Watering flowers or saving the world? She wants to ride all the rides!
  (ctx, t, dur) => {
    const tWat = when('watering', 0, 0.0), tSave = when('saving', 0, 1.2), tAns = when('answer', 0, 3.7), tThink = when('think', 0, 5.3), tRide = when('ride', 0, 7.1);
    cover(ctx, 'key', t, dur, [0.5, 0.35, 1.25], [0.5, 0.42, 1.08]);
    sparkles(ctx, t, { n: 22, seed: 17 });
    candy(ctx, { wash: 0.03 });
    band(ctx, 850, 1300, 0.7);
    if (t > tWat - 0.2 && t < tAns - 0.3) {
      eplate(ctx, 'WATERING FLOWERS', W / 2 - 0, 940, t, tWat - 0.2, 40);
      if (t > tSave - 0.3) eserif(ctx, 'or', W / 2, 1040, 58, { italic: true, alpha: fadeIn(t, tSave - 0.3) });
      if (t > tSave - 0.2) eplate(ctx, 'SAVING THE WORLD', W / 2, 1140, t, tSave - 0.2, 40);
    }
    if (t > tAns - 0.3 && t < tRide - 0.4) eserif(ctx, '"What\'s there to think about?"', W / 2, 1050, 60, { italic: true, alpha: fadeIn(t, tAns - 0.3) });
    if (t > tRide - 0.4) {
      withT(ctx, W / 2, 1080, pop(t, tRide - 0.4, 0.45), -0.04 + Math.sin(t * 6) * 0.02, () => eserif(ctx, 'RIDE ALL THE RIDES!', 0, 0, 80, { fill: CREAM, glowColor: 'rgba(255,190,90,0.9)' }));
      burst(ctx, t, tRide - 0.3, W / 2, 1080, { n: 40, color: '255,180,210', speed: 700, life: 0.9, size: 9 });
    }
  },

  // 4 — Liberation: hair turns fluffy like sheep's wool, sheep horns appear. "You're in for it now!"
  (ctx, t, dur) => {
    const tLib = when('liberation', 0, 0.7), tFluffy = when('fluffy', 0, 2.0), tHorns = when('horns', 0, 3.8), tNow = when('now', 0, 5.5);
    const [sx, sy] = shakeAt(t, tNow - 0.2, 20, 4);
    ctx.save(); ctx.translate(sx, sy);
    backdrop(ctx, 'liberation', t, dur, 0.2, 0.5, 0.35);
    framed(ctx, 'liberation', 50, 300, 980, 592, { alpha: fadeIn(t, 0, 0.5) * (1 - prog(t, tHorns - 0.4, 0.4)), r: 20 });
    const kl = ease.outBack(prog(t, tHorns - 0.4, 0.6));
    if (kl > 0) {
      roundInset(ctx, 'story', 420, 330, 240, W / 2, 600, 280 * kl, '255,120,160');
      // Fusion flames ring.
      for (let i = 0; i < 14; i++) {
        const a = i / 14 * Math.PI * 2 + t * 0.6, rr = 290 * kl + 30 + 12 * Math.sin(t * 9 + i);
        glow(ctx, W / 2 + Math.cos(a) * rr, 600 + Math.sin(a) * rr, 50, '255,140,80', 0.7);
      }
    }
    // Fluffy wool puffs.
    const kf = fadeIn(t, tFluffy - 0.3, 0.6);
    if (kf > 0) { const r = rng(5); for (let i = 0; i < 12; i++) { const a = r() * Math.PI * 2, d = 360 + r() * 140; ctx.fillStyle = `rgba(255,248,252,${0.85 * kf})`; for (let j = 0; j < 5; j++) { ctx.beginPath(); ctx.arc(W / 2 + Math.cos(a) * d + (j - 2) * 14, 600 + Math.sin(a) * d + Math.sin(j) * 10, 18 * kf, 0, Math.PI * 2); ctx.fill(); } } }
    if (t > tNow - 0.3) { flash(ctx, t, tNow - 0.3, { color: '255,200,220', peak: 0.5 }); burst(ctx, t, tNow - 0.3, W / 2, 600, { n: 50, color: '255,150,90', speed: 1000, life: 0.8, size: 10 }); }
    ctx.restore();
    sparkles(ctx, t, { n: 16, seed: 21, a: 0.6 });
    candy(ctx, { wash: 0.02 });
    band(ctx, 1060, 1300, 0.7);
    if (t > tLib - 0.3 && t < tNow - 0.3) eplate(ctx, 'RESONANCE LIBERATION', W / 2, 220, t, tLib - 0.3, 40);
    if (t > tFluffy - 0.3 && t < tNow - 0.3) eserif(ctx, 'fluffy wool... and horns', W / 2, 1180, 64, { italic: true, alpha: fadeIn(t, tFluffy - 0.3) });
    if (t > tNow - 0.3) withT(ctx, W / 2, 1180, pop(t, tNow - 0.3, 0.4), -0.05, () => eserif(ctx, '"YOU\'RE IN FOR IT NOW!"', 0, 0, 66, { fill: CREAM, glowColor: 'rgba(255,140,80,0.95)' }));
  },

  // 5 — Behind the smile: the Woolies were a gift from her mom. "Can you hug me a little?"
  (ctx, t, dur) => {
    const tSmile = when('smile', 0, 0.7), tGift = when('gift', 0, 2.4), tMom = when('mom', 0, 3.0), tDream = when('dreams', 0, 4.3), tHug = when('hug', 0, 6.2);
    const kd = prog(t, tDream - 0.5, 1.0);
    backdrop(ctx, 'story', t, dur, 0.5, 0.4, 0.35 + 0.35 * kd);
    const kc = ease.outBack(prog(t, 0, 0.6));
    roundInset(ctx, 'dolls', 170, 170, 160, W / 2, 620, 320 * kc, '255,170,200');
    if (t > tGift - 0.2) { const k = Math.sin(clamp((t - tGift + 0.2) / 1.4) * Math.PI); glow(ctx, W / 2, 620, 520, '255,220,200', 0.5 * k); }
    // Soft hearts drifting up on "hug".
    if (t > tHug - 0.3) { const r = rng(11); for (let i = 0; i < 10; i++) { const k = prog(t, tHug - 0.3 + i * 0.08, 1.6); if (k > 0 && k < 1) { ctx.fillStyle = `rgba(255,160,200,${0.9 * (1 - k)})`; heart(ctx, 200 + r() * 680, 900 - k * 600, 22 + r() * 16); } } }
    sparkles(ctx, t, { n: 12, seed: 27, a: 0.5 * (1 - kd) });
    candy(ctx, { wash: 0.03 });
    band(ctx, 1040, 1300, 0.72);
    if (t > tSmile - 0.3 && t < tDream - 0.5) eplate(ctx, 'BEHIND THE SMILE', W / 2, 1110, t, tSmile - 0.3, 42);
    if (t > tGift - 0.3 && t < tDream - 0.5) eserif(ctx, 'a gift from her mom', W / 2, 1215, 64, { italic: true, alpha: fadeIn(t, tGift - 0.3) });
    if (t > tHug - 0.6) eserif(ctx, '"can you hug me a little?"', W / 2, 1170, 64, { italic: true, alpha: fadeIn(t, tHug - 0.6, 0.7) });
  },

  // 6 — Five-star Fusion. Would you give Encore a hug?
  (ctx, t, dur) => {
    const tStar = when('fivestar', 0, 0.4), tFus = when('fusion', 0, 0.9), tHug = when('hug', 0, 4.1), tGive = when('give', 0, 3.3), tComments = when('comments', 0, 5.3);
    const p2 = prog(t, tGive - 0.8, 0.5);
    cover(ctx, 'vert', t, dur, [0.53, 0.37, 1.5], [0.53, 0.38, 1.6]);
    sparkles(ctx, t, { n: 26, seed: 31 });
    candy(ctx, { wash: 0.04 });
    band(ctx, 900, 1290, 0.6 * fadeIn(t, 0, 0.6));
    if (p2 < 1) {
      ctx.save(); ctx.globalAlpha = 1 - p2;
      fiveStars(ctx, t, tStar, 1010);
      badge(ctx, t, tFus - 0.2, W / 2, 1160, 'FUSION', '255,150,90', 78);
      ctx.restore();
    }
    if (t > tGive - 0.5) eserif(ctx, 'Would you give', W / 2, 1000, 84, { italic: true, alpha: fadeIn(t, tGive - 0.5, 0.6) });
    if (t > tHug - 0.5) eserif(ctx, 'Encore a hug?', W / 2, 1105, 90, { italic: true, alpha: fadeIn(t, tHug - 0.5, 0.6), fill: CREAM, glowColor: 'rgba(255,190,90,0.9)' });
    if (t > tComments - 0.3) eplate(ctx, 'TELL ME IN THE COMMENTS', W / 2, 1215, t, tComments - 0.3, 38);
  },
];
