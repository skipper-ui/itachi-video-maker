<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Who is Yinlin? motion scenes</title>
<script>
// Official Kuro Games art (see presskit/SOURCE.txt), cropped only and credited.
window.ART = Object.fromEntries(['vert', 'close', 'story', 'report', 'net', 'puppet'].map(n => [n, `presskit/${n}.jpg`]));
</script>
<script src="../../../motion/lib.js"></script>
<script src="../../../motion/wuwa/wuwa.js"></script>
</head>
<body>
<script>
// Captions are burned in around y = 1300-1420, so keep that band calm.
// Yinlin's palette: Electro violet on noir, with her crimson as the accent.
const VIO = ['#FFFFFF', '#F1DEFF', '#C07BFF'];
const VGLOW = 'rgba(190,110,255,0.9)';
const CRIM = ['#FFFFFF', '#FFD8D8', '#FF5E6E'];
const yplate = (ctx, str, x, y, t, t0, size = 44) =>
  plate(ctx, str, x, y, t, t0, size, { border: 'rgba(210,150,255,0.9)', bg: 'rgba(16,6,26,0.8)', color: '#F8F0FF' });
const yserif = (ctx, str, x, y, size, opts = {}) => serif(ctx, str, x, y, size, { fill: VIO, glowColor: VGLOW, ...opts });
const fadeIn = (t, t0, d = 0.5) => ease.outCubic(prog(t, t0, d));

function noir(ctx, { wash = 0.08 } = {}) {
  ctx.fillStyle = `rgba(20,0,35,${wash})`; ctx.fillRect(0, 0, W, H);
  vignette(ctx, 0.75);
  credit(ctx, 'Art © Kuro Games · official Wuthering Waves art');
}
function band(ctx, y0 = 920, y1 = 1290, a = 0.65) {
  ctx.fillStyle = vgrad(ctx, y0, y1, [[0, 'rgba(10,3,18,0)'], [0.3, `rgba(10,3,18,${a})`], [0.8, `rgba(10,3,18,${a})`], [1, 'rgba(10,3,18,0)']]);
  ctx.fillRect(0, y0, W, y1 - y0);
}
const motes = (ctx, t, n = 24, seed = 5, a = 1) => { ctx.save(); ctx.globalAlpha *= a; sparks(ctx, t, { n, seed, color: '200,140,255', rise: 50, size: 4 }); ctx.restore(); };

// A jagged lightning bolt from (x0,y0) to (x1,y1), reseeded a few times per second so it flickers.
function bolt(ctx, t, x0, y0, x1, y1, { a = 1, seed = 1, w = 6 } = {}) {
  if (a <= 0) return;
  const r = rng(seed * 97 + Math.floor(t * 12));
  const n = 10;
  ctx.save(); ctx.globalAlpha *= a; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(200,120,255,1)'; ctx.shadowBlur = 24;
  const pts = [[x0, y0]];
  for (let i = 1; i < n; i++) {
    const k = i / n, nx = -(y1 - y0), ny = x1 - x0, len = Math.hypot(nx, ny) || 1, off = (r() - 0.5) * 70;
    pts.push([lerp(x0, x1, k) + nx / len * off, lerp(y0, y1, k) + ny / len * off]);
  }
  pts.push([x1, y1]);
  [[w * 2.2, 'rgba(170,80,255,0.6)'], [w, 'rgba(245,225,255,0.95)']].forEach(([lw, col]) => {
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
  });
  ctx.restore();
}
function key(ctx, x, y, s, rot) {
  withT(ctx, x, y, s, rot, () => {
    glow(ctx, 0, 0, 120, '255,215,140', 0.35);
    ctx.strokeStyle = '#E8C46A'; ctx.lineWidth = 16;
    ctx.beginPath(); ctx.arc(-70, 0, 34, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#E8C46A'; ctx.fill(rectPath(-38, -9, 140, 18, 6)); ctx.fill(rectPath(70, 0, 14, 36, 3)); ctx.fill(rectPath(92, 0, 12, 26, 3));
  });
}
function bullet(ctx, x, y, s, rot) {
  withT(ctx, x, y, s, rot, () => {
    glow(ctx, 0, 0, 120, '255,180,120', 0.3);
    ctx.fillStyle = '#C98B3A'; ctx.fill(rectPath(-30, -70, 60, 110, 8));
    ctx.fillStyle = '#D9D2C8'; ctx.beginPath(); ctx.moveTo(-30, -70); ctx.quadraticCurveTo(0, -150, 30, -70); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8A5A22'; ctx.fill(rectPath(-34, 34, 68, 14, 4));
  });
}

function framed(ctx, name, x, y, w, h, { alpha = 1, r = 26, border = 'rgba(210,150,255,0.95)' } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 50;
  ctx.fillStyle = '#000'; ctx.fill(rectPath(x, y, w, h, r));
  ctx.shadowBlur = 0;
  ctx.save(); ctx.clip(rectPath(x, y, w, h, r));
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(ARTS[name].img, x, y, w, h);
  ctx.restore();
  ctx.lineWidth = 5; ctx.strokeStyle = border; ctx.stroke(rectPath(x, y, w, h, r));
  ctx.restore();
}
function backdrop(ctx, name, t, dur, fx = 0.5, fy = 0.5, dark = 0.5) {
  cover(ctx, name, t, dur, [fx, fy, 1.25], [fx, fy, 1.35], { filter: 'blur(18px) saturate(1.2)' });
  ctx.fillStyle = `rgba(10,3,18,${dark})`; ctx.fillRect(0, 0, W, H);
}
function roundInset(ctx, name, sx, sy, sr, x, y, R, col = '210,150,255') {
  glow(ctx, x, y, R * 1.5, col, 0.45);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.clip();
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(ARTS[name].img, sx - sr, sy - sr, 2 * sr, 2 * sr, x - R, y - R, 2 * R, 2 * R);
  ctx.restore();
  ctx.lineWidth = 7; ctx.strokeStyle = `rgba(${col},0.95)`; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke();
}
function badge(ctx, t, t0, x, y, label, col, r = 80) {
  const k = pop(t, t0, 0.5);
  if (k <= 0) return;
  withT(ctx, x, y, k, 0, () => {
    glow(ctx, 0, 0, r * 1.8, col, 0.5 + 0.15 * Math.sin(t * 4));
    ctx.fillStyle = 'rgba(16,6,26,0.85)';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = `rgb(${col})`; ctx.stroke();
    serif(ctx, label, 0, 4, r * 0.34, { fill: ['#FFFFFF', `rgb(${col})`], glowColor: `rgba(${col},0.9)` });
  });
  ring(ctx, t, t0, x, y, { maxR: r * 3, life: 0.6, color: col, width: 10 });
}
function fiveStars(ctx, t, t0, y) {
  for (let i = 0; i < 5; i++) {
    const k = pop(t, t0 - 0.2 + i * 0.07, 0.4);
    if (k > 0) withT(ctx, W / 2 + (i - 2) * 92, y, k, 0, () => {
      glow(ctx, 0, 0, 60, '255,210,120', 0.6);
      ctx.fillStyle = '#FFD27A'; ctx.fill(starPath(38, 16));
      ctx.lineWidth = 3; ctx.strokeStyle = '#7A4A10'; ctx.stroke(starPath(38, 16));
    });
  }
}

window.scenes = [
  // 0 — "Name's Yinlin. As for what she does? We don't talk about that in public."
  (ctx, t, dur) => {
    const tName = when('names', 0, 0.0), tWhat = when('what', 0, 1.7), tPub = when('public', 0, 3.7), tYin = when('yinlin', 1, 4.7), tWW = when('wuthering', 0, 5.7);
    cover(ctx, 'vert', t, dur, [0.45, 0.2, 2.3], [0.5, 0.42, 1.08]);
    bolt(ctx, t, -40, 300, 420, 760, { a: fadeIn(t, 0.1, 0.3) * 0.8, seed: 1 });
    bolt(ctx, t, W + 40, 520, 640, 980, { a: fadeIn(t, tWhat, 0.3) * 0.7, seed: 2 });
    motes(ctx, t, 22, 3, 0.8);
    noir(ctx, { wash: 0.05 });
    band(ctx, 900, 1290, 0.65 * fadeIn(t, 0, 0.6));
    const early = 1 - prog(t, tYin - 0.5, 0.4);
    if (early > 0) {
      ctx.save(); ctx.globalAlpha = early;
      if (t > tName - 0.2) yserif(ctx, '"Name\'s Yinlin."', W / 2, 1000, 80, { italic: true, alpha: fadeIn(t, tName - 0.2) });
      if (t > tPub - 0.8) {
        // A redaction bar slams over "what she does".
        const kr = prog(t, tPub - 0.8, 0.35);
        ctx.fillStyle = '#0A0310'; ctx.fill(rectPath(W / 2 - 300, 1080, 600 * ease.outCubic(kr), 80, 6));
        if (kr >= 1) { ctx.font = `900 40px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(255,90,110,0.95)'; ctx.fillText('[REDACTED]', W / 2, 1122); }
      } else if (t > tWhat - 0.3) yserif(ctx, 'what she does?', W / 2, 1120, 66, { italic: true, alpha: fadeIn(t, tWhat - 0.3) });
      ctx.restore();
    }
    const kc = prog(t, tYin - 0.2, 0.6);
    if (kc > 0) {
      ctx.fillStyle = `rgba(230,200,255,${0.3 * (1 - kc)})`; ctx.fillRect(0, 0, W, H);
      withT(ctx, W / 2, 1050, lerp(1.25, 1, ease.outCubic(kc)), 0, () => yserif(ctx, 'YINLIN', 0, 0, 160, { alpha: ease.outCubic(kc) }));
    }
    if (t > tWW - 0.3) yplate(ctx, 'WUTHERING WAVES', W / 2, 1195, t, tWW - 0.3, 38);
  },

  // 1 — Once a Patroller; lost her identity in a case; now hunts crime alone in the shadows.
  (ctx, t, dur) => {
    const tPat = when('patroller', 0, 1.6), tLost = when('lost', 0, 3.2), tShad = when('shadows', 0, 5.7), tAlone = when('alone', 0, 7.6);
    const kd = prog(t, tShad - 0.5, 1.0);
    backdrop(ctx, 'vert', t, dur, 0.5, 0.4, 0.55);
    framed(ctx, 'report', 90, 180 + (1 - fadeIn(t, 0, 0.6)) * 60, 900, 1009, { alpha: fadeIn(t, 0, 0.6), r: 16 });
    // Her name gets struck out on "lost her identity".
    const ks = prog(t, tLost, 0.5);
    if (ks > 0) {
      ctx.save(); ctx.strokeStyle = 'rgba(230,40,60,0.95)'; ctx.lineWidth = 12; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(135, 600); ctx.lineTo(135 + 260 * ease.outCubic(ks), 590); ctx.stroke(); ctx.restore();
    }
    if (kd > 0) { ctx.fillStyle = vgrad(ctx, 0, H, [[0, `rgba(5,0,10,${0.7 * kd})`], [1, `rgba(5,0,10,${0.3 * kd})`]]); ctx.fillRect(0, 0, W, H); }
    motes(ctx, t, 18, 9, 0.4 + 0.4 * kd);
    noir(ctx, { wash: 0.04 });
    band(ctx, 1060, 1300, 0.75);
    if (t > tPat - 0.3 && t < tLost - 0.2) yplate(ctx, 'ONCE A PATROLLER', W / 2, 1180, t, tPat - 0.3, 44);
    if (t > tLost - 0.2 && t < tShad - 0.4) yplate(ctx, 'IDENTITY: LOST', W / 2, 1180, t, tLost - 0.2, 44);
    if (t > tShad - 0.4) yserif(ctx, 'now, in the shadows', W / 2, 1180, 72, { italic: true, alpha: fadeIn(t, tShad - 0.4) });
  },

  // 2 — Master of lies; perps scream "She can't be a Patroller!"
  (ctx, t, dur) => {
    const tLies = when('lies', 0, 1.1), tTrust = when('trust', 0, 3.8), tCrim = when('criminals', 0, 5.3), tCant = when('cant', 0, 6.8);
    const [sx, sy] = shakeAt(t, tCant, 16, 5);
    ctx.save(); ctx.translate(sx, sy);
    backdrop(ctx, 'close', t, dur, 0.6, 0.4, 0.45);
    framed(ctx, 'close', 170, 220 + (1 - fadeIn(t, 0, 0.6)) * 60, 740, 840, { alpha: fadeIn(t, 0, 0.6) });
    // A sly wink of light near her eye on "trust".
    if (t > tTrust - 0.2) { const k = Math.sin(clamp((t - tTrust + 0.2) / 0.6) * Math.PI); glow(ctx, 650, 480, 160, '255,220,255', 0.7 * k); }
    ctx.restore();
    motes(ctx, t, 16, 11, 0.6);
    noir(ctx, { wash: 0.03 });
    band(ctx, 1060, 1300, 0.75);
    if (t > tLies - 0.3) yplate(ctx, 'MASTER OF LIES', W / 2, 160, t, tLies - 0.3, 46);
    if (t > tTrust - 0.3 && t < tCrim - 0.3) yserif(ctx, '...and still trusted', W / 2, 1180, 72, { italic: true, alpha: fadeIn(t, tTrust - 0.3) });
    if (t > tCant - 0.4) withT(ctx, W / 2, 1180, pop(t, tCant - 0.4, 0.4), -0.04, () => yserif(ctx, '"SHE CAN\'T BE A PATROLLER!"', 0, 0, 56, { fill: CRIM, glowColor: 'rgba(255,80,100,0.9)' }));
  },

  // 3 — Always a Plan B: a second key in the pocket, another bullet in the chamber.
  (ctx, t, dur) => {
    const tPlan = when('plan', 0, 1.9), tKey = when('key', 0, 3.5), tBul = when('bullet', 0, 5.3);
    backdrop(ctx, 'vert', t, dur, 0.5, 0.4, 0.55);
    motes(ctx, t, 18, 13, 0.5);
    if (t < tPlan - 0.2) yserif(ctx, 'her rule?', W / 2, 520, 110, { italic: true, alpha: fadeIn(t, 0, 0.4) * (1 - prog(t, tPlan - 0.5, 0.3)) });
    const kb = pop(t, tPlan - 0.3, 0.5);
    if (kb > 0) withT(ctx, W / 2, 470, kb, -0.06, () => {
      glow(ctx, 0, 0, 260, '200,130,255', 0.4);
      ctx.fillStyle = 'rgba(16,6,26,0.9)'; ctx.fill(rectPath(-210, -150, 420, 300, 40));
      ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(210,150,255,0.95)'; ctx.stroke(rectPath(-210, -150, 420, 300, 40));
      yserif(ctx, 'PLAN B', 0, 6, 110);
    });
    const kk = ease.outBack(prog(t, tKey - 0.3, 0.5));
    if (kk > 0) key(ctx, 330, 860, 1.4 * kk, -0.5 + Math.sin(t * 2) * 0.05);
    const kl = ease.outBack(prog(t, tBul - 0.3, 0.5));
    if (kl > 0) bullet(ctx, 760, 870, 1.3 * kl, 0.25 + Math.sin(t * 2 + 1) * 0.05);
    noir(ctx, { wash: 0.03 });
    band(ctx, 1060, 1300, 0.7);
    if (t > tKey - 0.3) yplate(ctx, 'A SECOND KEY', 330, 1110, t, tKey - 0.3, 34);
    if (t > tBul - 0.3) yplate(ctx, 'ANOTHER BULLET', 760, 1110, t, tBul - 0.3, 34);
    if (t > tPlan - 0.3) yserif(ctx, 'always', W / 2, 260, 66, { italic: true, alpha: fadeIn(t, tPlan - 0.3) });
  },

  // 4 — Zapstring, a puppet rebuilt into a weapon; its dents come from household chores.
  (ctx, t, dur) => {
    const tZap = when('zapstring', 0, 0.9), tWeap = when('weapon', 0, 3.5), tDents = when('dents', 0, 5.0), tNot = when('not', 0, 6.2), tChores = when('chores', 0, 8.7);
    backdrop(ctx, 'close', t, dur, 0.2, 0.3, 0.5);
    motes(ctx, t, 16, 17, 0.5);
    const kp = ease.outBack(prog(t, tZap - 0.4, 0.6));
    const hop = t > tChores - 1.2 ? Math.abs(Math.sin(t * 7)) * 30 : 0;
    if (kp > 0) roundInset(ctx, 'puppet', 170, 170, 160, W / 2, 600 - hop, 320 * kp);
    if (t > tWeap - 0.2 && t < tDents) {
      const k = Math.sin(clamp((t - tWeap + 0.2) / 1.2) * Math.PI);
      bolt(ctx, t, W / 2 - 330, 300, W / 2 + 330, 900, { a: k, seed: 4 });
      bolt(ctx, t, W / 2 + 330, 300, W / 2 - 330, 900, { a: k, seed: 5 });
    }
    // Chores: a duster and a broom bob around it.
    const kc = fadeIn(t, tChores - 1.2, 0.5);
    if (kc > 0) {
      withT(ctx, 220, 760 - Math.sin(t * 6) * 20, kc, -0.5 + Math.sin(t * 6) * 0.3, () => {
        ctx.fillStyle = '#8A5A22'; ctx.fill(rectPath(-8, -10, 16, 200, 6));
        ctx.fillStyle = '#E3C98A'; ctx.beginPath(); ctx.moveTo(-40, 190); ctx.lineTo(40, 190); ctx.lineTo(55, 280); ctx.lineTo(-55, 280); ctx.closePath(); ctx.fill();
      });
      withT(ctx, 860, 740 + Math.sin(t * 6 + 1) * 20, kc, 0.5 + Math.sin(t * 6 + 1) * 0.3, () => {
        ctx.fillStyle = '#8A5A22'; ctx.fill(rectPath(-7, 0, 14, 150, 6));
        ctx.fillStyle = '#F2D6FF'; for (let i = 0; i < 7; i++) { const a = -Math.PI / 2 + (i - 3) * 0.3; ctx.beginPath(); ctx.ellipse(Math.cos(a) * 40, Math.sin(a) * 40, 14, 40, a + Math.PI / 2, 0, Math.PI * 2); ctx.fill(); }
      });
    }
    noir(ctx, { wash: 0.03 });
    band(ctx, 1060, 1300, 0.75);
    if (t > tZap - 0.3 && t < tDents - 0.3) yplate(ctx, 'ZAPSTRING', W / 2, 1100, t, tZap - 0.3, 48);
    if (t > tWeap - 0.3 && t < tDents - 0.3) yserif(ctx, 'rebuilt into a weapon', W / 2, 1210, 60, { italic: true, alpha: fadeIn(t, tWeap - 0.3) });
    if (t > tDents - 0.3 && t < tChores - 1.2) yserif(ctx, 'battle scars?', W / 2, 1180, 76, { italic: true, alpha: fadeIn(t, tDents - 0.3) });
    if (t > tChores - 1.2) withT(ctx, W / 2, 1180, pop(t, tChores - 1.2, 0.45), -0.03, () => yplate(ctx, 'HOUSEHOLD CHORES', 0, 0, t, tChores - 1.2, 46));
  },

  // 5 — A net of lightning, a cage for her enemies; five-star Electro.
  (ctx, t, dur) => {
    const tLight = when('lightning', 0, 1.3), tNet = when('net', 0, 2.0), tCage = when('cage', 0, 2.9), tStar = when('fivestar', 0, 5.3), tEl = when('electro', 0, 6.1);
    backdrop(ctx, 'story', t, dur, 0.5, 0.35, 0.5);
    const p1 = 1 - prog(t, tStar - 0.6, 0.4);
    if (p1 > 0) {
      ctx.save(); ctx.globalAlpha = p1;
      framed(ctx, 'net', 40, 280, 1000, 500, { r: 18 });
      ctx.restore();
      // The net: a web of bolts across the screen.
      const kn = prog(t, tNet - 0.3, 0.8) * p1;
      if (kn > 0) {
        const nodes = [[100, 200], [540, 150], [980, 200], [1010, 520], [980, 920], [540, 990], [100, 920], [70, 520]];
        nodes.forEach((a, i) => { const b = nodes[(i + 1) % nodes.length]; bolt(ctx, t, ...a, ...b, { a: kn, seed: 10 + i, w: 5 }); });
        if (t > tCage - 0.3) [[0, 4], [2, 6], [1, 5], [3, 7]].forEach(([i, j], q) => bolt(ctx, t, ...nodes[i], ...nodes[j], { a: kn * fadeIn(t, tCage - 0.3, 0.4), seed: 30 + q, w: 4 }));
      }
    }
    if (t > tStar - 0.4) {
      roundInset(ctx, 'report', 690, 600, 230, W / 2, 470, 270 * ease.outBack(prog(t, tStar - 0.4, 0.6)));
      fiveStars(ctx, t, tStar, 820);
      badge(ctx, t, tEl - 0.2, W / 2, 990, 'ELECTRO', '200,130,255', 80);
    }
    motes(ctx, t, 26, 19, 0.6);
    noir(ctx, { wash: 0.03 });
    band(ctx, 1100, 1300, 0.7 * p1);
    if (t > tLight - 0.3 && p1 > 0) { ctx.save(); ctx.globalAlpha = p1; yplate(ctx, 'A NET OF LIGHTNING', W / 2, 1150, t, tLight - 0.3, 44); ctx.restore(); }
    if (t > tCage - 0.3 && p1 > 0) { ctx.save(); ctx.globalAlpha = p1; yserif(ctx, 'a cage for her enemies', W / 2, 1245, 56, { italic: true, alpha: fadeIn(t, tCage - 0.3) }); ctx.restore(); }
  },

  // 6 — Outro: would you trust Yinlin?
  (ctx, t, dur) => {
    const tTrust = when('trust', 0, 0.9), tComments = when('comments', 0, 2.7);
    cover(ctx, 'vert', t, dur, [0.5, 0.28, 1.5], [0.5, 0.3, 1.65]);
    bolt(ctx, t, -40, 420, 380, 820, { a: 0.6, seed: 41 });
    motes(ctx, t, 24, 31);
    noir(ctx, { wash: 0.05 });
    band(ctx, 900, 1290, 0.65 * fadeIn(t, 0, 0.6));
    if (t > tTrust - 0.4) yserif(ctx, 'Would you trust', W / 2, 1000, 88, { italic: true, alpha: fadeIn(t, tTrust - 0.4, 0.6) });
    if (t > tTrust - 0.1) yserif(ctx, 'Yinlin?', W / 2, 1110, 96, { italic: true, alpha: fadeIn(t, tTrust - 0.1, 0.6), fill: CRIM, glowColor: 'rgba(255,80,100,0.9)' });
    if (t > tComments - 0.3) yplate(ctx, 'TELL ME IN THE COMMENTS', W / 2, 1215, t, tComments - 0.3, 38);
  },
];
</script>
</body>
</html>
