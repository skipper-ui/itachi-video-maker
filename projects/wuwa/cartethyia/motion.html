<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Who is Cartethyia? motion scenes</title>
<script>
// Official Kuro Games art (see presskit/SOURCE.txt), cropped only and credited.
window.ART = Object.fromEntries(['vert', 'card_full', 'card_face', 'story', 'report', 'form', 'sword', 'fleur'].map(n => [n, `presskit/${n}.jpg`]));
</script>
<script src="../../../motion/lib.js"></script>
<script src="../../../motion/wuwa/wuwa.js"></script>
</head>
<body>
<script>
// Captions are burned in around y = 1300-1420, so keep that band calm.
// Cartethyia's palette: Aero sky blue and laurel gold.
const AIR = ['#FFFFFF', '#E3F6FF', '#8ED8FF'];
const AGLOW = 'rgba(130,210,255,0.9)';
const GOLDF = ['#FFFFFF', '#FFF1C8', '#E9C46A'];
const aplate = (ctx, str, x, y, t, t0, size = 44) =>
  plate(ctx, str, x, y, t, t0, size, { border: 'rgba(170,225,255,0.9)', bg: 'rgba(10,25,50,0.74)', color: '#F0FAFF' });
const aserif = (ctx, str, x, y, size, opts = {}) => serif(ctx, str, x, y, size, { fill: AIR, glowColor: AGLOW, ...opts });
const fadeIn = (t, t0, d = 0.5) => ease.outCubic(prog(t, t0, d));

function sky(ctx, { wash = 0.08 } = {}) {
  ctx.fillStyle = `rgba(10,30,70,${wash})`; ctx.fillRect(0, 0, W, H);
  vignette(ctx, 0.7);
  credit(ctx, 'Art © Kuro Games · official Wuthering Waves art');
}
function band(ctx, y0 = 920, y1 = 1290, a = 0.65) {
  ctx.fillStyle = vgrad(ctx, y0, y1, [[0, 'rgba(8,20,45,0)'], [0.3, `rgba(8,20,45,${a})`], [0.8, `rgba(8,20,45,${a})`], [1, 'rgba(8,20,45,0)']]);
  ctx.fillRect(0, y0, W, y1 - y0);
}
// Drifting feathers (her Forte is the "Feathered Tempest").
function feathers(ctx, t, { n = 16, seed = 6, a = 1, speed = 60 } = {}) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const x0 = r() * W, y0 = r() * H, s = 0.6 + r() * 0.7, ph = r() * 6.28;
    const x = x0 + Math.sin(t * 0.8 + ph) * 80, y = ((y0 + t * speed * (0.5 + r())) % (H + 120)) - 60;
    withT(ctx, x, y, s, Math.sin(t * 1.3 + ph) * 0.8 + ph, () => {
      ctx.globalAlpha *= a * 0.85;
      ctx.fillStyle = 'rgba(235,248,255,0.9)';
      ctx.beginPath(); ctx.ellipse(0, 0, 9, 30, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(140,200,240,0.9)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(0, 34); ctx.stroke();
    });
  }
}
// Gale streaks sweeping across the frame.
function gale(ctx, t, k, { n = 26, seed = 13 } = {}) {
  if (k <= 0) return;
  const r = rng(seed);
  ctx.save(); ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const y = r() * H, len = 200 + r() * 400, sp = 1400 + r() * 1200, off = r() * 3000;
    const x = ((t * sp + off) % (W + len * 2)) - len;
    const g = ctx.createLinearGradient(x - len, 0, x, 0);
    g.addColorStop(0, 'rgba(200,240,255,0)'); g.addColorStop(1, `rgba(220,245,255,${0.7 * k})`);
    ctx.strokeStyle = g; ctx.lineWidth = 3 + r() * 5;
    ctx.beginPath(); ctx.moveTo(x - len, y + Math.sin(t * 3 + i) * 20); ctx.quadraticCurveTo(x - len / 2, y - 30, x, y); ctx.stroke();
  }
  ctx.restore();
}

// "cover" with keyframes: [[t, fx, fy, zoom], ...]
function coverK(ctx, name, t, keys, opts = {}) {
  let [fx, fy, z] = keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) {
    const [ta, xa, ya, za] = keys[i - 1], [tb, xb, yb, zb] = keys[i];
    if (t >= ta) { const k = ease.inOutCubic(prog(t, ta, Math.max(0.01, tb - ta))); fx = lerp(xa, xb, k); fy = lerp(ya, yb, k); z = lerp(za, zb, k); }
  }
  cover(ctx, name, 0, 1, [fx, fy, z], [fx, fy, z], opts);
}
function framed(ctx, name, x, y, w, h, { alpha = 1, r = 26, border = 'rgba(170,225,255,0.95)', filter } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 50;
  ctx.fillStyle = '#000'; ctx.fill(rectPath(x, y, w, h, r));
  ctx.shadowBlur = 0;
  ctx.save(); ctx.clip(rectPath(x, y, w, h, r));
  if (filter) ctx.filter = filter;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(ARTS[name].img, x, y, w, h);
  ctx.restore();
  ctx.lineWidth = 5; ctx.strokeStyle = border; ctx.stroke(rectPath(x, y, w, h, r));
  ctx.restore();
}
function backdrop(ctx, name, t, dur, fx = 0.5, fy = 0.5, dark = 0.4) {
  cover(ctx, name, t, dur, [fx, fy, 1.25], [fx, fy, 1.35], { filter: 'blur(18px) saturate(1.2)' });
  ctx.fillStyle = `rgba(8,20,45,${dark})`; ctx.fillRect(0, 0, W, H);
}
function roundInset(ctx, name, sx, sy, sr, x, y, R, col = '170,225,255') {
  glow(ctx, x, y, R * 1.5, col, 0.45);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.clip();
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(ARTS[name].img, sx - sr, sy - sr, 2 * sr, 2 * sr, x - R, y - R, 2 * R, 2 * R);
  ctx.restore();
  ctx.lineWidth = 7; ctx.strokeStyle = `rgba(${col},0.95)`; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke();
}
function badge(ctx, t, t0, x, y, label, col, r = 80) {
  const k = pop(t, t0, 0.5);
  if (k <= 0) return;
  withT(ctx, x, y, k, 0, () => {
    glow(ctx, 0, 0, r * 1.8, col, 0.5 + 0.15 * Math.sin(t * 4));
    ctx.fillStyle = 'rgba(10,25,50,0.82)';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = `rgb(${col})`; ctx.stroke();
    serif(ctx, label, 0, 4, r * 0.36, { fill: ['#FFFFFF', `rgb(${col})`], glowColor: `rgba(${col},0.9)` });
  });
  ring(ctx, t, t0, x, y, { maxR: r * 3, life: 0.6, color: col, width: 10 });
}
function fiveStars(ctx, t, t0, y) {
  for (let i = 0; i < 5; i++) {
    const k = pop(t, t0 - 0.2 + i * 0.07, 0.4);
    if (k > 0) withT(ctx, W / 2 + (i - 2) * 92, y, k, 0, () => {
      glow(ctx, 0, 0, 60, '255,210,120', 0.6);
      ctx.fillStyle = '#FFD27A'; ctx.fill(starPath(38, 16));
      ctx.lineWidth = 3; ctx.strokeStyle = '#7A4A10'; ctx.stroke(starPath(38, 16));
    });
  }
}
function mark(ctx, k, x, y, w, h) {
  if (k <= 0) return;
  ctx.lineWidth = 6; ctx.strokeStyle = `rgba(40,120,230,${k})`; ctx.stroke(rectPath(x, y, w, h, 12));
}

window.scenes = [
  // 0 — Once the Blessed Maiden; now a wandering knight. This is Cartethyia.
  (ctx, t, dur) => {
    const tBl = when('blessed', 0, 1.4), tKn = when('knight', 0, 4.4), tCar = when('cartethyia', 0, 5.6), tWW = when('wuthering', 0, 7.0);
    // Start on Fleurdelys (right), drift to Cartethyia (left), then pull back to both.
    coverK(ctx, 'vert', t, [[0, 0.67, 0.39, 2.1], [tKn - 1.0, 0.67, 0.4, 1.95], [tKn - 0.2, 0.32, 0.46, 2.0], [tCar - 0.3, 0.32, 0.47, 2.0], [tCar + 0.8, 0.5, 0.5, 1.12]]);
    feathers(ctx, t, { n: 14 });
    sky(ctx, { wash: 0.04 });
    band(ctx, 900, 1290, 0.6 * fadeIn(t, 0, 0.6));
    const early = 1 - prog(t, tCar - 0.5, 0.4);
    if (early > 0) {
      ctx.save(); ctx.globalAlpha = early;
      if (t > tBl - 0.3 && t < tKn - 0.5) aserif(ctx, 'the Blessed Maiden', W / 2, 1100, 84, { italic: true, fill: GOLDF, glowColor: 'rgba(255,210,120,0.9)', alpha: fadeIn(t, tBl - 0.3) * (1 - prog(t, tKn - 0.9, 0.4)) });
      if (t > tKn - 0.3) aplate(ctx, 'NOW: A WANDERING KNIGHT', W / 2, 1100, t, tKn - 0.3, 42);
      ctx.restore();
    }
    const kc = prog(t, tCar - 0.2, 0.6);
    if (kc > 0) {
      ctx.fillStyle = `rgba(220,240,255,${0.3 * (1 - kc)})`; ctx.fillRect(0, 0, W, H);
      withT(ctx, W / 2, 1050, lerp(1.25, 1, ease.outCubic(kc)), 0, () => aserif(ctx, 'CARTETHYIA', 0, 0, 132, { alpha: ease.outCubic(kc) }));
    }
    if (t > tWW - 0.3) aplate(ctx, 'WUTHERING WAVES', W / 2, 1195, t, tWW - 0.3, 38);
  },

  // 1 — Her old titles; she went by Fleurdelys.
  (ctx, t, dur) => {
    const tVes = when('vessel', 0, 1.3), tQueen = when('queen', 0, 3.1), tFl = when('fleurdelys', 0, 7.7);
    const kf = prog(t, tFl - 0.4, 0.6);
    cover(ctx, 'card_full', t, dur, [0.5, 0.2, 1.05], [0.5, 0.22, 1.12]);
    if (kf > 0) {
      ctx.save(); ctx.globalAlpha = kf; backdrop(ctx, 'fleur', t, dur, 0.5, 0.3, 0.35); ctx.restore();
      framed(ctx, 'fleur', 40, 180 + (1 - kf) * 60, 1000, 760, { alpha: kf });
      flash(ctx, t, tFl - 0.3, { color: '220,240,255', peak: 0.5 });
    }
    feathers(ctx, t, { n: 12, seed: 9, a: 0.8 });
    sky(ctx, { wash: 0.04 });
    band(ctx, 920, 1290, 0.65);
    const old = 1 - kf;
    if (old > 0) {
      ctx.save(); ctx.globalAlpha = old;
      if (t > tVes - 0.3) aplate(ctx, 'VESSEL OF DIVINITY', W / 2, 1020, t, tVes - 0.3, 42);
      if (t > tQueen - 0.3) aplate(ctx, 'QUEEN OF GALE AND TIDE', W / 2, 1130, t, tQueen - 0.3, 42);
      ctx.restore();
    }
    if (t > tFl - 0.2) withT(ctx, W / 2, 1110, lerp(1.25, 1, ease.outCubic(prog(t, tFl - 0.2, 0.6))), 0, () => aserif(ctx, 'FLEURDELYS', 0, 0, 124, { alpha: fadeIn(t, tFl - 0.2, 0.6) }));
  },

  // 2 — Born from the Threnodian's malice; her birth was part of an orchestrated plot.
  (ctx, t, dur) => {
    const tCurse = when('curse', 0, 1.7), tThr = when('threnodians', 0, 4.1), tPlot = when('plot', 0, 8.7), tOrch = when('orchestrated', 0, 7.9);
    backdrop(ctx, 'fleur', t, dur, 0.5, 0.3, 0.55);
    const kd = Math.sin(clamp((t - tCurse + 0.3) / 1.6) * Math.PI);
    framed(ctx, 'fleur', 40, 250, 1000, 760, { alpha: fadeIn(t, 0, 0.6), filter: `saturate(${(1 - 0.5 * prog(t, tCurse - 0.3, 1)).toFixed(2)})` });
    if (kd > 0) { ctx.fillStyle = `rgba(30,0,40,${0.45 * kd})`; ctx.fillRect(0, 0, W, H); }
    // Marionette strings from above, swaying, on "orchestrated".
    const ks = prog(t, tOrch - 0.6, 0.8);
    if (ks > 0) {
      ctx.save(); ctx.strokeStyle = `rgba(235,240,255,${0.85 * ks})`; ctx.lineWidth = 2.5; ctx.shadowColor = 'rgba(200,220,255,1)'; ctx.shadowBlur = 8;
      [[300, 480], [470, 400], [620, 420], [780, 520]].forEach(([x, y], i) => {
        const sw = Math.sin(t * 2 + i) * 14;
        ctx.beginPath(); ctx.moveTo(x + sw * 0.3, -20); ctx.lineTo(x + sw, lerp(-20, y, ks)); ctx.stroke();
        if (ks >= 1) { ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(x + sw, y, 5, 0, Math.PI * 2); ctx.fill(); }
      });
      ctx.restore();
      // the control bar
      ctx.save(); ctx.globalAlpha = ks; ctx.fillStyle = 'rgba(230,200,140,0.95)';
      ctx.fill(rectPath(250, 90 + Math.sin(t * 2) * 6, 580, 16, 8)); ctx.fill(rectPath(530, 40, 16, 120, 8)); ctx.restore();
    }
    sky(ctx, { wash: 0.05 });
    band(ctx, 1060, 1300, 0.7);
    if (t > tCurse - 0.3 && t < tOrch - 0.6) aplate(ctx, 'BORN FROM A CURSE', W / 2, 1180, t, tCurse - 0.3, 44);
    if (t > tThr - 0.3 && t < tOrch - 0.6) aserif(ctx, "the Threnodian's malice", W / 2, 180, 66, { italic: true, alpha: fadeIn(t, tThr - 0.3) });
    if (t > tOrch - 0.4) aserif(ctx, 'an orchestrated plot', W / 2, 1180, 76, { italic: true, alpha: fadeIn(t, tOrch - 0.4) });
  },

  // 3 — Two forms; as Fleurdelys her storm nearly tore a test simulation apart.
  (ctx, t, dur) => {
    const tTwo = when('two', 0, 2.2), tBec = when('becomes', 0, 3.9), tStorm = when('storm', 0, 5.6), tApart = when('apart', 0, 8.2);
    const kg = prog(t, tStorm - 0.3, 0.6);
    const [sx, sy] = [Math.sin(t * 41) * 10 * kg, Math.cos(t * 37) * 10 * kg];
    ctx.save(); ctx.translate(sx, sy);
    backdrop(ctx, 'vert', t, dur, 0.5, 0.45, 0.4);
    // Official "A Different Form" card, then both forms side by side.
    const kc = fadeIn(t, 0, 0.6) * (1 - prog(t, tTwo - 0.4, 0.4));
    if (kc > 0) framed(ctx, 'form', 60, 380, 960, 445, { alpha: kc, r: 18 });
    const k2 = ease.outBack(prog(t, tTwo - 0.3, 0.6));
    if (k2 > 0) {
      roundInset(ctx, 'card_face', 430, 360, 330, lerp(W / 2, 280, k2), 640, 210 * k2, '255,225,150');
      roundInset(ctx, 'form', 189, 228, 140, lerp(W / 2, 800, k2), 640, 210 * k2, '150,215,255');
      ctx.save(); ctx.globalAlpha = k2;
      aserif(ctx, '⇄', W / 2, 640, 90);
      aserif(ctx, 'Cartethyia', 280, 905, 46, { fill: GOLDF, glowColor: 'rgba(255,210,120,0.9)' });
      aserif(ctx, 'Fleurdelys', 800, 905, 46);
      ctx.restore();
      if (t > tBec - 0.2) glow(ctx, 800, 640, 360, '150,215,255', 0.5 * fadeIn(t, tBec - 0.2));
    }
    gale(ctx, t, kg);
    feathers(ctx, t, { n: 20, seed: 19, speed: 60 + 500 * kg, a: 0.5 + 0.5 * kg });
    // The simulation tears: glitch slices.
    const ka = prog(t, tApart - 0.3, 0.9);
    if (ka > 0 && ka < 1) {
      const r = rng(Math.floor(t * 12));
      for (let i = 0; i < 7; i++) {
        const y = r() * H, h = 20 + r() * 80, dx = (r() - 0.5) * 160 * (1 - ka);
        ctx.drawImage(ctx.canvas, 0, y, W, h, dx, y, W, h);
        ctx.fillStyle = `rgba(${r() > 0.5 ? '120,220,255' : '255,255,255'},${0.25 * (1 - ka)})`; ctx.fillRect(0, y, W, 3);
      }
      flash(ctx, t, tApart - 0.3, { color: '220,245,255', peak: 0.5 });
    }
    ctx.restore();
    sky(ctx, { wash: 0.04 });
    band(ctx, 1060, 1300, 0.7);
    if (t > tTwo - 0.3) aplate(ctx, 'TWO FORMS', W / 2, 220, t, tTwo - 0.3, 46);
    if (t > tStorm - 0.3 && t < tApart - 0.3) aserif(ctx, 'her storm...', W / 2, 1180, 80, { italic: true, alpha: fadeIn(t, tStorm - 0.3) });
    if (t > tApart - 0.3) withT(ctx, W / 2, 1180, pop(t, tApart - 0.3, 0.45), -0.03, () => aserif(ctx, 'TORE THE SIMULATION', 0, 0, 70));
  },

  // 4 — The hard part: staying solemn. Manners. Tone.
  (ctx, t, dur) => {
    const tHard = when('hard', 0, 0.2), tSol = when('solemn', 0, 1.9), tMan = when('manners', 0, 5.9), tTone = when('tone', 0, 6.5);
    backdrop(ctx, 'story', t, dur, 0.5, 0.4, 0.4);
    framed(ctx, 'story', 40, 230 + (1 - fadeIn(t, 0, 0.6)) * 60, 1000, 630, { alpha: fadeIn(t, 0, 0.6) });
    feathers(ctx, t, { n: 10, seed: 27, a: 0.6 });
    sky(ctx, { wash: 0.03 });
    band(ctx, 900, 1300, 0.7);
    if (t > tHard - 0.3) aserif(ctx, 'the hard part?', W / 2, 960, 80, { italic: true, alpha: fadeIn(t, tHard - 0.3) });
    if (t > tSol - 0.3) aplate(ctx, 'STAYING SOLEMN', W / 2, 1070, t, tSol - 0.3, 44);
    // A little checklist she runs through.
    [[tMan, 'MANNERS', -170], [tTone, 'TONE', 170]].forEach(([t0, s, dx]) => {
      if (t <= t0 - 0.3) return;
      withT(ctx, W / 2 + dx, 1195, pop(t, t0 - 0.3, 0.45), 0, () => {
        aplate(ctx, `✓ ${s}`, 0, 0, t, t0 - 0.3, 36);
      });
    });
  },

  // 5 — A child with a wooden sword; now a five-star Aero sword user.
  (ctx, t, dur) => {
    const tChild = when('child', 0, 0.4), tWood = when('wooden', 0, 2.1), tSwing = when('swinging', 0, 3.3), tInj = when('injustice', 0, 4.5),
          tNow = when('now', 0, 6.0), tStar = when('fivestar', 0, 6.6), tAero = when('aero', 0, 7.5), tSword = when('sword', 1, 7.9);
    backdrop(ctx, 'card_full', t, dur, 0.5, 0.3, 0.45);
    feathers(ctx, t, { n: 14, seed: 33, a: 0.7 });
    const p1 = 1 - prog(t, tNow - 0.4, 0.4);
    if (p1 > 0) {
      ctx.save(); ctx.globalAlpha = p1;
      const ki = ease.outBack(prog(t, tWood - 0.5, 0.6));
      if (ki > 0) {
        roundInset(ctx, 'sword', 180, 180, 170, W / 2, 680, 300 * ki, '230,200,150');
      }
      // The swing: arcs of motion on "swinging" and "injustice".
      [tSwing, tInj].forEach((t0, i) => {
        const k = prog(t, t0 - 0.1, 0.45);
        if (k > 0 && k < 1) {
          ctx.save(); ctx.strokeStyle = `rgba(255,240,200,${0.9 * (1 - k)})`; ctx.lineWidth = 14; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.arc(W / 2, 680, 360, (i ? 0.2 : -2.6) , (i ? 0.2 : -2.6) + 2.2 * ease.outCubic(k)); ctx.stroke(); ctx.restore();
        }
      });
      ctx.restore();
    }
    if (t > tNow - 0.3) {
      roundInset(ctx, 'card_face', 430, 360, 330, W / 2, 640, 320 * ease.outBack(prog(t, tNow - 0.3, 0.6)), '170,225,255');
      fiveStars(ctx, t, tStar, 1030);
      badge(ctx, t, tAero - 0.2, W / 2 - 150, 1185, 'AERO', '120,230,190', 74);
      badge(ctx, t, tSword - 0.2, W / 2 + 150, 1185, 'SWORD', '200,225,255', 74);
    }
    sky(ctx, { wash: 0.03 });
    if (p1 > 0) {
      ctx.save(); ctx.globalAlpha = p1;
      if (t > tChild - 0.3) aplate(ctx, 'AS A CHILD', W / 2, 220, t, tChild - 0.3, 44);
      if (t > tInj - 0.3) withT(ctx, W / 2, 1150, pop(t, tInj - 0.3, 0.45), -0.03, () => aserif(ctx, 'every injustice!', 0, 0, 76, { italic: true, fill: GOLDF, glowColor: 'rgba(255,210,120,0.9)' }));
      ctx.restore();
    }
  },

  // 6 — Outro: Cartethyia or Fleurdelys?
  (ctx, t, dur) => {
    const tCar = when('cartethyia', 0, 0.5), tFl = when('fleurdelys', 0, 1.5), tForm = when('form', 0, 2.9), tComments = when('comments', 0, 4.7);
    cover(ctx, 'vert', t, dur, [0.5, 0.5, 1.05], [0.5, 0.48, 1.12]);
    feathers(ctx, t, { n: 16, seed: 41 });
    sky(ctx, { wash: 0.06 });
    ctx.fillStyle = vgrad(ctx, 0, 420, [[0, 'rgba(8,20,45,0.7)'], [1, 'rgba(8,20,45,0)']]); ctx.fillRect(0, 0, W, 420);
    band(ctx, 1080, 1300, 0.6);
    if (t > tCar - 0.3) aplate(ctx, 'CARTETHYIA', 270, 960, t, tCar - 0.3, 38);
    if (t > tFl - 0.3) aplate(ctx, 'FLEURDELYS', 820, 820, t, tFl - 0.3, 38);
    if (t > tForm - 0.3) {
      aserif(ctx, 'Which form', W / 2, 150, 86, { italic: true, alpha: fadeIn(t, tForm - 0.3, 0.6) });
      aserif(ctx, 'do you like more?', W / 2, 255, 76, { italic: true, alpha: fadeIn(t, tForm - 0.1, 0.6) });
    }
    if (t > tComments - 0.3) aplate(ctx, 'TELL ME IN THE COMMENTS', W / 2, 1200, t, tComments - 0.3, 38);
  },
];
</script>
</body>
</html>
