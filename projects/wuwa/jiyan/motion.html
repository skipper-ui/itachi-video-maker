<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Who is Jiyan? motion scenes</title>
<script>
// Official Kuro Games art (see presskit/SOURCE.txt), cropped only and credited.
window.ART = Object.fromEntries(['vert', 'close', 'wide', 'story', 'report'].map(n => [n, `presskit/${n}.jpg`]));
</script>
<script src="../../../motion/lib.js"></script>
<script src="../../../motion/wuwa/wuwa.js"></script>
</head>
<body>
<script>
// Captions are burned in around y = 1300-1420, so keep that band calm.
// Jiyan's palette: Qingloong jade on night teal, with brass accents.
const JADE = ['#FFFFFF', '#DFFFF6', '#5FF0CF'];
const JGLOW = 'rgba(60,240,200,0.9)';
const BRASS = ['#FFFFFF', '#FFF1CC', '#E3B45A'];
const jplate = (ctx, str, x, y, t, t0, size = 44) =>
  plate(ctx, str, x, y, t, t0, size, { border: 'rgba(120,250,215,0.9)', bg: 'rgba(4,24,24,0.78)', color: '#ECFFFA' });
const jserif = (ctx, str, x, y, size, opts = {}) => serif(ctx, str, x, y, size, { fill: JADE, glowColor: JGLOW, ...opts });
const fadeIn = (t, t0, d = 0.5) => ease.outCubic(prog(t, t0, d));

function night(ctx, { wash = 0.08 } = {}) {
  ctx.fillStyle = `rgba(0,30,30,${wash})`; ctx.fillRect(0, 0, W, H);
  vignette(ctx, 0.72);
  credit(ctx, 'Art © Kuro Games · official Wuthering Waves art');
}
function band(ctx, y0 = 920, y1 = 1290, a = 0.65) {
  ctx.fillStyle = vgrad(ctx, y0, y1, [[0, 'rgba(3,18,18,0)'], [0.3, `rgba(3,18,18,${a})`], [0.8, `rgba(3,18,18,${a})`], [1, 'rgba(3,18,18,0)']]);
  ctx.fillRect(0, y0, W, y1 - y0);
}
// Wind streaks swirling.
function wind(ctx, t, k, { n = 22, seed = 13, cx = W / 2, cy = 700 } = {}) {
  if (k <= 0) return;
  const r = rng(seed);
  ctx.save(); ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const rad = 180 + r() * 520, a0 = r() * Math.PI * 2 + t * (1.2 + r()), len = 0.5 + r() * 0.7;
    ctx.strokeStyle = `rgba(150,255,225,${(0.25 + 0.4 * r()) * k})`; ctx.lineWidth = 2 + r() * 5;
    ctx.beginPath(); ctx.arc(cx, cy, rad, a0, a0 + len); ctx.stroke();
  }
  ctx.restore();
}
const leaves = (ctx, t, n = 26, seed = 5, a = 1) => { ctx.save(); ctx.globalAlpha *= a; sparks(ctx, t, { n, seed, color: '120,250,215', rise: 70, size: 4 }); ctx.restore(); };

// A gourd-shaped pill case (drawn; the lore describes it).
function gourd(ctx, x, y, s, rot = 0) {
  withT(ctx, x, y, s, rot, () => {
    glow(ctx, 0, 0, 160, '255,215,140', 0.35);
    const g = ctx.createLinearGradient(-90, 0, 90, 0);
    g.addColorStop(0, '#7A4E1C'); g.addColorStop(0.5, '#D99A3E'); g.addColorStop(1, '#6A3F14');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 50, 90, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -60, 58, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3E8F7A'; ctx.fill(rectPath(-34, -10, 68, 18, 8));
    ctx.fillStyle = '#5A3A14'; ctx.fill(rectPath(-12, -138, 24, 30, 6));
    ctx.strokeStyle = 'rgba(255,230,170,0.6)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(-30, 30, 40, Math.PI * 1.1, Math.PI * 1.5); ctx.stroke();
  });
}
function candy(ctx, x, y, s, rot, hue) {
  withT(ctx, x, y, s, rot, () => {
    ctx.fillStyle = `hsl(${hue},85%,65%)`;
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fill(polyPath([[-20, 0], [-44, -16], [-44, 16]])); ctx.fill(polyPath([[20, 0], [44, -16], [44, 16]]));
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 12, -2.4, -0.8); ctx.stroke();
  });
}
function flower(ctx, x, y, s, t, hue = 190) {
  withT(ctx, x, y, s, Math.sin(t * 2 + x) * 0.06, () => {
    ctx.strokeStyle = '#2E7D5A'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 90); ctx.stroke();
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2;
      ctx.fillStyle = `hsl(${hue},70%,${80 - (i % 2) * 8}%)`;
      ctx.beginPath(); ctx.ellipse(Math.cos(a) * 18, Math.sin(a) * 18, 18, 11, a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#FFE08A'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
  });
}

function framed(ctx, name, x, y, w, h, { alpha = 1, r = 26, border = 'rgba(120,250,215,0.95)' } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 50;
  ctx.fillStyle = '#000'; ctx.fill(rectPath(x, y, w, h, r));
  ctx.shadowBlur = 0;
  ctx.save(); ctx.clip(rectPath(x, y, w, h, r));
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(ARTS[name].img, x, y, w, h);
  ctx.restore();
  ctx.lineWidth = 5; ctx.strokeStyle = border; ctx.stroke(rectPath(x, y, w, h, r));
  ctx.restore();
}
function backdrop(ctx, name, t, dur, fx = 0.5, fy = 0.5, dark = 0.45) {
  cover(ctx, name, t, dur, [fx, fy, 1.25], [fx, fy, 1.35], { filter: 'blur(18px) saturate(1.2)' });
  ctx.fillStyle = `rgba(3,18,18,${dark})`; ctx.fillRect(0, 0, W, H);
}
function roundInset(ctx, name, sx, sy, sr, x, y, R, col = '120,250,215') {
  glow(ctx, x, y, R * 1.5, col, 0.45);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.clip();
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(ARTS[name].img, sx - sr, sy - sr, 2 * sr, 2 * sr, x - R, y - R, 2 * R, 2 * R);
  ctx.restore();
  ctx.lineWidth = 7; ctx.strokeStyle = `rgba(${col},0.95)`; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke();
}
function badge(ctx, t, t0, x, y, label, col, r = 80) {
  const k = pop(t, t0, 0.5);
  if (k <= 0) return;
  withT(ctx, x, y, k, 0, () => {
    glow(ctx, 0, 0, r * 1.8, col, 0.5 + 0.15 * Math.sin(t * 4));
    ctx.fillStyle = 'rgba(4,24,24,0.85)';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = `rgb(${col})`; ctx.stroke();
    serif(ctx, label, 0, 4, r * 0.36, { fill: ['#FFFFFF', `rgb(${col})`], glowColor: `rgba(${col},0.9)` });
  });
  ring(ctx, t, t0, x, y, { maxR: r * 3, life: 0.6, color: col, width: 10 });
}
function fiveStars(ctx, t, t0, y) {
  for (let i = 0; i < 5; i++) {
    const k = pop(t, t0 - 0.2 + i * 0.07, 0.4);
    if (k > 0) withT(ctx, W / 2 + (i - 2) * 92, y, k, 0, () => {
      glow(ctx, 0, 0, 60, '255,210,120', 0.6);
      ctx.fillStyle = '#FFD27A'; ctx.fill(starPath(38, 16));
      ctx.lineWidth = 3; ctx.strokeStyle = '#7A4A10'; ctx.stroke(starPath(38, 16));
    });
  }
}

window.scenes = [
  // 0 — He bends the wind into a dragon. This is Jiyan, General of the Midnight Rangers.
  (ctx, t, dur) => {
    const tWind = when('wind', 0, 0.8), tDragon = when('dragon', 0, 3.4), tJi = when('jiyan', 0, 5.3), tGen = when('general', 0, 6.4);
    // Open on the Qingloong's head (top-left of the key art), then down to Jiyan.
    cover(ctx, 'vert', t, dur, [0.3, 0.12, 2.2], [0.5, 0.38, 1.08]);
    wind(ctx, t, fadeIn(t, tWind - 0.3, 0.8), { cx: 380, cy: 520 });
    leaves(ctx, t, 26, 3, 0.8);
    night(ctx, { wash: 0.04 });
    band(ctx, 900, 1290, 0.6 * fadeIn(t, 0, 0.6));
    const early = 1 - prog(t, tJi - 0.5, 0.4);
    if (early > 0) {
      ctx.save(); ctx.globalAlpha = early;
      if (t > tWind - 0.3) jserif(ctx, 'he bends the wind...', W / 2, 1010, 78, { italic: true, alpha: fadeIn(t, tWind - 0.3) });
      if (t > tDragon - 0.3) withT(ctx, W / 2, 1130, pop(t, tDragon - 0.3, 0.45), 0, () => jplate(ctx, 'INTO A DRAGON', 0, 0, t, tDragon - 0.3, 44));
      ctx.restore();
    }
    const kc = prog(t, tJi - 0.2, 0.6);
    if (kc > 0) {
      ctx.fillStyle = `rgba(200,255,240,${0.3 * (1 - kc)})`; ctx.fillRect(0, 0, W, H);
      withT(ctx, W / 2, 1050, lerp(1.25, 1, ease.outCubic(kc)), 0, () => jserif(ctx, 'JIYAN', 0, 0, 170, { alpha: ease.outCubic(kc) }));
    }
    if (t > tGen - 0.3) jplate(ctx, 'GENERAL OF THE MIDNIGHT RANGERS', W / 2, 1195, t, tGen - 0.3, 34);
  },

  // 1 — Once an army medic from a medical family; still carries a gourd-shaped pill case.
  (ctx, t, dur) => {
    const tGen = when('general', 0, 0.7), tMed = when('medic', 0, 2.2), tFam = when('family', 0, 3.7), tGourd = when('gourdshaped', 0, 5.7), tAid = when('aid', 0, 7.4);
    backdrop(ctx, 'story', t, dur, 0.4, 0.4, 0.45);
    leaves(ctx, t, 18, 9, 0.5);
    const p1 = 1 - prog(t, tGourd - 0.5, 0.4);
    if (p1 > 0) {
      ctx.save(); ctx.globalAlpha = p1;
      framed(ctx, 'story', 40, 240 + (1 - fadeIn(t, 0, 0.6)) * 60, 1000, 667);
      ctx.restore();
    }
    if (t > tGourd - 0.4) {
      const kg = ease.outBack(prog(t, tGourd - 0.4, 0.6));
      gourd(ctx, W / 2, 640, 1.9 * kg, Math.sin(t * 2) * 0.06);
      if (t > tAid - 0.3) withT(ctx, W / 2 + 230, 470, pop(t, tAid - 0.3, 0.45), 0, () => {
        glow(ctx, 0, 0, 90, '255,255,255', 0.4);
        ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(0, 0, 58, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#E04848'; ctx.fill(rectPath(-12, -38, 24, 76, 4)); ctx.fill(rectPath(-38, -12, 76, 24, 4));
      });
    }
    night(ctx, { wash: 0.03 });
    band(ctx, 980, 1300, 0.7);
    if (t > tGen - 0.3 && t < tGourd - 0.4) jserif(ctx, 'before the general...', W / 2, 1050, 70, { italic: true, alpha: fadeIn(t, tGen - 0.3) });
    if (t > tMed - 0.3 && t < tGourd - 0.4) jplate(ctx, 'AN ARMY MEDIC', W / 2, 1170, t, tMed - 0.3, 44);
    if (t > tGourd - 0.3) jplate(ctx, 'THE GOURD PILL CASE', W / 2, 1170, t, tGourd - 0.3, 42);
  },

  // 2 — Candy for kids from the pill case; a myth of infinite space inside.
  (ctx, t, dur) => {
    const tCandy = when('candy', 0, 1.7), tKids = when('kids', 0, 2.6), tMyth = when('myth', 0, 4.3), tInf = when('infinite', 0, 5.4);
    backdrop(ctx, 'story', t, dur, 0.4, 0.4, 0.5);
    leaves(ctx, t, 14, 11, 0.5);
    gourd(ctx, W / 2, 700, 1.9 + 0.03 * Math.sin(t * 3), Math.sin(t * 2) * 0.06);
    // Candies pour out of the top — more and more once the myth kicks in.
    const n = Math.floor(lerp(0, 14, prog(t, tCandy - 0.3, 1.2)) + lerp(0, 30, prog(t, tInf - 0.3, 1.5)));
    const r = rng(7);
    for (let i = 0; i < n; i++) {
      const born = tCandy - 0.3 + (i < 14 ? i * 0.09 : 1.2 + (tInf - tCandy) + (i - 14) * 0.05), k = clamp((t - born) / 1.4);
      const a = -Math.PI / 2 + (r() - 0.5) * 2.2, sp = 380 + r() * 380, hue = r() * 360;
      if (k <= 0) continue;
      const x = W / 2 + Math.cos(a) * sp * k, y = 700 - 260 + Math.sin(a) * sp * k + 900 * k * k;
      candy(ctx, x, y, 0.9, k * 8 + i, hue);
    }
    night(ctx, { wash: 0.03 });
    band(ctx, 1060, 1300, 0.7);
    if (t > tKids - 0.4 && t < tMyth - 0.3) jserif(ctx, 'candy for the kids', W / 2, 1180, 72, { italic: true, alpha: fadeIn(t, tKids - 0.4), fill: BRASS, glowColor: 'rgba(255,200,110,0.9)' });
    if (t > tMyth - 0.3) jplate(ctx, 'THE MYTH', W / 2, 220, t, tMyth - 0.3, 44);
    if (t > tInf - 0.3) withT(ctx, W / 2, 1180, pop(t, tInf - 0.3, 0.45), -0.03, () => jserif(ctx, '∞ space inside', 0, 0, 84));
  },

  // 3 — Never great with a lance... until the winds became one in a siege.
  (ctx, t, dur) => {
    const tLance = when('lance', 0, 2.6), tSiege = when('siege', 0, 5.0), tWinds = when('winds', 0, 6.0), tBecame = when('became', 0, 7.8), tToday = when('today', 0, 9.6);
    const ks = prog(t, tSiege - 0.4, 0.6);
    const [sx, sy] = shakeAt(t, tBecame, 18, 4);
    ctx.save(); ctx.translate(sx, sy);
    cover(ctx, 'wide', t, dur, [0.38, 0.35, 1.5], [0.42, 0.42, 1.15], { filter: `saturate(${(0.6 + 0.4 * ks).toFixed(2)})` });
    if (ks > 0) { ctx.fillStyle = `rgba(0,10,10,${0.35 * ks * (1 - prog(t, tBecame, 0.8))})`; ctx.fillRect(0, 0, W, H); }
    const kw = prog(t, tWinds - 0.4, 1.0);
    wind(ctx, t, kw * (1 - 0.6 * prog(t, tBecame + 0.3, 0.8)), { cx: 470, cy: 760, n: 30 });
    // The winds converge into a glowing lance.
    const kl = ease.outCubic(prog(t, tBecame - 0.2, 0.6));
    if (kl > 0) {
      withT(ctx, 560, 760, 1, -0.6, () => {
        glow(ctx, 0, 0, 340 * kl, '120,255,220', 0.5);
        const L = 620 * kl;
        ctx.strokeStyle = 'rgba(210,255,245,0.95)'; ctx.lineWidth = 12; ctx.lineCap = 'round';
        ctx.shadowColor = 'rgba(80,255,210,1)'; ctx.shadowBlur = 30;
        ctx.beginPath(); ctx.moveTo(-L / 2, 0); ctx.lineTo(L / 2, 0); ctx.stroke();
        ctx.fillStyle = '#E6FFF8'; ctx.fill(polyPath([[L / 2, -24], [L / 2 + 90 * kl, 0], [L / 2, 24]]));
      });
      ring(ctx, t, tBecame - 0.1, 560, 760, { maxR: 800, life: 0.7, color: '140,255,220', width: 20 });
    }
    ctx.restore();
    leaves(ctx, t, 30, 17, 0.4 + 0.6 * kw);
    night(ctx, { wash: 0.03 });
    band(ctx, 1060, 1300, 0.7);
    if (t > tLance - 0.4 && t < tSiege - 0.4) jserif(ctx, 'never great with a lance', W / 2, 1180, 64, { italic: true, alpha: fadeIn(t, tLance - 0.4) });
    if (t > tSiege - 0.3) jplate(ctx, 'A DEVASTATING SIEGE', W / 2, 220, t, tSiege - 0.3, 42);
    if (t > tWinds - 0.3 && t < tBecame - 0.2) jserif(ctx, 'the winds converged...', W / 2, 1180, 70, { italic: true, alpha: fadeIn(t, tWinds - 0.3) });
    if (t > tBecame - 0.2) withT(ctx, W / 2, 1180, pop(t, tBecame - 0.2, 0.45), 0, () => jserif(ctx, 'INTO HIS LANCE', 0, 0, 90));
  },

  // 4 — A tight ship: dust on the sills; third row, fourth from the left, vambrace off-center.
  (ctx, t, dur) => {
    const tShip = when('ship', 0, 1.4), tDust = when('dust', 0, 2.3), tClean = when('clean', 0, 4.3), tThird = when('third', 0, 5.6), tVam = when('vambrace', 0, 8.2), tOff = when('offcenter', 0, 8.9);
    backdrop(ctx, 'close', t, dur, 0.5, 0.35, 0.45);
    leaves(ctx, t, 14, 21, 0.4);
    const p1 = 1 - prog(t, tThird - 0.5, 0.4);
    if (p1 > 0) {
      ctx.save(); ctx.globalAlpha = p1;
      framed(ctx, 'close', 160, 230 + (1 - fadeIn(t, 0, 0.6)) * 60, 760, 842);
      // Dust motes, then swept clean.
      const kd = fadeIn(t, tDust - 0.3, 0.4) * (1 - prog(t, tClean, 0.5));
      if (kd > 0) {
        const r = rng(3);
        for (let i = 0; i < 40; i++) { ctx.fillStyle = `rgba(190,170,140,${0.8 * kd})`; ctx.beginPath(); ctx.arc(200 + r() * 680, 300 + r() * 760 + Math.sin(t * 2 + i) * 6, 3 + r() * 5, 0, Math.PI * 2); ctx.fill(); }
      }
      if (t > tClean - 0.1 && t < tClean + 0.6) {
        const k = prog(t, tClean - 0.1, 0.5);
        ctx.strokeStyle = `rgba(200,255,240,${0.9 * (1 - k)})`; ctx.lineWidth = 30; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(lerp(100, 1000, k) - 200, 650); ctx.lineTo(lerp(100, 1000, k), 640); ctx.stroke();
      }
      ctx.restore();
    }
    // Inspection grid: rows of helmets; one highlighted.
    const kg = fadeIn(t, tThird - 0.4, 0.5);
    if (kg > 0) {
      ctx.save(); ctx.globalAlpha = kg;
      for (let row = 0; row < 4; row++) for (let col = 0; col < 6; col++) {
        const x = 230 + col * 125, y = 380 + row * 150, hit = row === 2 && col === 3;
        const on = hit && t > tThird + 0.8;
        withT(ctx, x, y, 1, on && t > tVam - 0.3 ? 0.18 : 0, () => {
          ctx.fillStyle = on ? '#E9C25C' : 'rgba(150,230,210,0.85)';
          ctx.beginPath(); ctx.arc(0, -16, 26, Math.PI, 0); ctx.fill(); ctx.fill(rectPath(-20, -14, 40, 56, 10));
        });
        if (on) { ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,215,130,0.95)'; ctx.stroke(rectPath(x - 52, y - 62, 104, 124, 16)); }
      }
      ctx.restore();
    }
    night(ctx, { wash: 0.03 });
    band(ctx, 1040, 1300, 0.72);
    if (t > tShip - 0.3 && t < tThird - 0.4) jplate(ctx, 'A VERY TIGHT SHIP', W / 2, 1110, t, tShip - 0.3, 42);
    if (t > tClean - 0.3 && t < tThird - 0.4) jserif(ctx, '"Clean it up."', W / 2, 1220, 66, { italic: true, alpha: fadeIn(t, tClean - 0.3) });
    if (t > tThird - 0.3) jplate(ctx, 'ROW 3 · 4TH FROM THE LEFT', W / 2, 1110, t, tThird - 0.3, 38);
    if (t > tOff - 0.4) withT(ctx, W / 2, 1220, pop(t, tOff - 0.4, 0.45), -0.03, () => jserif(ctx, 'off-center!', 0, 0, 80, { italic: true, fill: BRASS, glowColor: 'rgba(255,200,110,0.9)' }));
  },

  // 5 — Seeds in Knell Square for the fallen; five-star Aero.
  (ctx, t, dur) => {
    const tBat = when('battle', 0, 1.2), tSeeds = when('seeds', 0, 3.2), tKnell = when('knell', 0, 3.7), tFallen = when('fallen', 0, 5.9), tStar = when('fivestar', 0, 7.2), tAero = when('aero', 0, 8.1);
    const dusk = fadeIn(t, 0, 1.0);
    ctx.fillStyle = vgrad(ctx, 0, H, [[0, '#0E2B33'], [0.55, '#2F5F5A'], [1, '#C88E5A']]); ctx.fillRect(-40, -40, W + 80, H + 80);
    glow(ctx, W / 2, 1150, 600, '255,190,120', 0.45 * dusk);
    // Flowers rise in rows as he plants.
    const r = rng(19);
    for (let i = 0; i < 22; i++) {
      const x = 70 + (i % 11) * 94 + r() * 30, y = 1150 + Math.floor(i / 11) * 100, d = tSeeds - 0.3 + i * 0.09;
      const k = ease.outBack(prog(t, d, 0.6));
      if (k > 0) flower(ctx, x, y - 70 * k, k * (0.8 + r() * 0.4), t, [180, 200, 160, 45, 330][i % 5]);
    }
    const kp = ease.outBack(prog(t, tStar - 0.6, 0.6));
    if (kp > 0) roundInset(ctx, 'report', 705, 640, 240, W / 2, 420, 260 * kp);
    if (t > tStar - 0.3) fiveStars(ctx, t, tStar, 750);
    badge(ctx, t, tAero - 0.2, W / 2, 900, 'AERO', '120,250,215', 76);
    night(ctx, { wash: 0.02 });
    if (t > tBat - 0.3 && t < tStar - 0.6) jplate(ctx, 'AFTER EVERY BATTLE', W / 2, 230, t, tBat - 0.3, 42);
    if (t > tKnell - 0.3 && t < tStar - 0.6) jserif(ctx, 'Knell Square', W / 2, 420, 96, { italic: true, alpha: fadeIn(t, tKnell - 0.3) });
    if (t > tFallen - 0.3 && t < tStar - 0.6) jserif(ctx, 'for the fallen', W / 2, 540, 70, { italic: true, alpha: fadeIn(t, tFallen - 0.3), fill: BRASS, glowColor: 'rgba(255,200,110,0.9)' });
  },

  // 6 — Outro: would you survive Jiyan's inspection?
  (ctx, t, dur) => {
    const tSur = when('survive', 0, 0.7), tIns = when('inspection', 0, 1.6), tComments = when('comments', 0, 2.9);
    cover(ctx, 'vert', t, dur, [0.5, 0.33, 1.6], [0.5, 0.33, 1.75]);
    leaves(ctx, t, 26, 31);
    night(ctx, { wash: 0.05 });
    band(ctx, 900, 1290, 0.6 * fadeIn(t, 0, 0.6));
    if (t > tSur - 0.3) jserif(ctx, 'Would you survive', W / 2, 1000, 84, { italic: true, alpha: fadeIn(t, tSur - 0.3, 0.6) });
    if (t > tIns - 0.3) jserif(ctx, "Jiyan's inspection?", W / 2, 1105, 84, { italic: true, alpha: fadeIn(t, tIns - 0.3, 0.6) });
    if (t > tComments - 0.3) jplate(ctx, 'TELL ME IN THE COMMENTS', W / 2, 1215, t, tComments - 0.3, 38);
  },
];
