<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Who is Lily? motion scenes</title>
<script>
// Official Kuro Games Version 3.8 press-kit art (see presskit/SOURCE.txt), cropped only, never altered,
// and credited on every frame.
window.ART = Object.fromEntries(['key_vertical', 'key_vertical_title', 'key_4k', 'lily_full', 'lily_banner', 'main_quest', 'lily_sleeping']
  .map(n => [n, `presskit/${n}.jpg`]));
window.FONTS = ['bold 100px Caladea', 'italic 100px Caladea'];
</script>
<script src="../../../motion/lib.js"></script>
</head>
<body>
<script>
// Captions are burned in around y = 1300-1420, so keep that band calm.
const SERIF = 'Caladea, serif';
const LAV = ['#FFFFFF', '#F1E4FF', '#C9A7FF'];

// Full-frame image with a slow camera move: focus (fx, fy) in 0..1 image coords, zoom >= 1 over "cover".
function cover(ctx, name, t, dur, from, to, opts = {}) {
  const a = ARTS[name], img = a.img;
  const k = ease.inOutCubic(clamp(t / dur));
  const fx = lerp(from[0], to[0], k), fy = lerp(from[1], to[1], k), z = lerp(from[2], to[2], k);
  const s = Math.max(W / img.width, H / img.height) * z;
  let x = W / 2 - fx * img.width * s, y = H / 2 - fy * img.height * s;
  x = Math.min(0, Math.max(W - img.width * s, x));   // never show past the image edge
  y = Math.min(0, Math.max(H - img.height * s, y));
  ctx.save();
  if (opts.filter) ctx.filter = opts.filter;
  if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, x, y, img.width * s, img.height * s);
  ctx.restore();
}

// Elegant serif title with a soft lavender glow.
function serif(ctx, str, x, y, size, { alpha = 1, fill = LAV, italic = false, glowColor = 'rgba(190,150,255,0.9)' } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${italic ? 'italic' : 'bold'} ${size}px ${SERIF}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${size * 0.04}px`;
  ctx.shadowColor = glowColor; ctx.shadowBlur = size * 0.35;
  ctx.lineWidth = size * 0.06; ctx.strokeStyle = 'rgba(30,10,60,0.85)';
  ctx.strokeText(str, x, y);
  ctx.shadowBlur = 0;
  ctx.fillStyle = vgrad(ctx, y - size / 2, y + size / 2, fill.map((c, i) => [i / (fill.length - 1), c]));
  ctx.fillText(str, x, y);
  ctx.restore();
}

// Thin framed label (glass plate with serif text) that fades and rises in from t0.
function plate(ctx, str, x, y, t, t0, size = 46) {
  const k = ease.outCubic(prog(t, t0, 0.5));
  if (k <= 0) return;
  ctx.save();
  ctx.globalAlpha = k;
  ctx.font = `bold ${size}px ${SERIF}`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${size * 0.12}px`;
  const w = ctx.measureText(str).width + size * 1.6, h = size * 1.7, yy = y + (1 - k) * 30;
  ctx.fillStyle = 'rgba(20,8,45,0.62)';
  ctx.fill(rectPath(x - w / 2, yy - h / 2, w, h, h / 2));
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(220,190,255,0.85)';
  ctx.stroke(rectPath(x - w / 2, yy - h / 2, w, h, h / 2));
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#F4EAFF';
  ctx.fillText(str, x, yy + 2);
  ctx.restore();
}

// Drifting lily petals and glowing motes.
function petals(ctx, t, { n = 26, seed = 11, speed = 70 } = {}) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const x0 = r() * W, y0 = r() * H, sz = 10 + r() * 16, sp = 0.5 + r(), ph = r() * 6.28;
    const x = x0 + Math.sin(t * 0.7 + ph) * 60, y = ((y0 + t * speed * sp) % (H + 100)) - 50;
    withT(ctx, x, y, 1, t * (0.6 + r()) + ph, () => {
      ctx.fillStyle = `rgba(255,250,255,${0.45 + 0.35 * Math.sin(t * 2 + ph) ** 2})`;
      ctx.beginPath(); ctx.ellipse(0, 0, sz, sz * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    });
  }
}

// A small blue butterfly flapping along a gentle path.
function butterfly(ctx, t, x, y, s = 1, ph = 0) {
  const flap = Math.abs(Math.sin(t * 9 + ph));
  withT(ctx, x + Math.sin(t * 0.9 + ph) * 80, y + Math.sin(t * 1.4 + ph) * 50, s, Math.sin(t + ph) * 0.3, () => {
    glow(ctx, 0, 0, 60, '120,170,255', 0.5);
    for (const side of [-1, 1]) {
      ctx.save(); ctx.scale(side * (0.25 + 0.75 * flap), 1);
      const g = ctx.createLinearGradient(0, -30, 40, 20);
      g.addColorStop(0, '#BFE3FF'); g.addColorStop(1, '#2F5BFF');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(22, -12, 24, 16, -0.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(16, 12, 14, 10, 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#1A1030'; ctx.fillRect(-2, -16, 4, 30);
  });
}

// Darken edges, add a soft lavender wash, and credit the artwork on every frame.
function finish(ctx, { wash = 0.12 } = {}) {
  ctx.fillStyle = `rgba(60,20,110,${wash})`; ctx.fillRect(0, 0, W, H);
  vignette(ctx, 0.7);
  ctx.save();
  ctx.font = `22px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 6;
  ctx.fillText('Art © Kuro Games · official Wuthering Waves press kit', W / 2, H - 70);
  ctx.restore();
}

window.scenes = [
  // 0 — "She can smell your pain, and she turns it into dreams. This is Lily..."
  (ctx, t, dur) => {
    const tDreams = when('dreams', 0, 2.9), tLily = when('lily', 0, 4.5), tNew = when('newest', 0, 5.5);
    cover(ctx, 'key_vertical', t, dur, [0.55, 0.22, 1.5], [0.5, 0.3, 1.12]);
    petals(ctx, t, { n: 18 + Math.round(12 * prog(t, tDreams - 0.5, 1)) });
    butterfly(ctx, t, 170, 620, 1.1, 0); butterfly(ctx, t, 900, 980, 0.9, 2);
    finish(ctx);
    // Soft bloom when the name lands.
    const k = prog(t, tLily - 0.2, 0.6);
    if (k > 0) { ctx.fillStyle = `rgba(230,210,255,${0.35 * (1 - k)})`; ctx.fillRect(0, 0, W, H); }
    serif(ctx, 'LILY', W / 2, 980, 230, { alpha: ease.outCubic(prog(t, tLily - 0.1, 0.6)) });
    if (t > tNew - 0.2) plate(ctx, 'THE NEWEST RESONATOR', W / 2, 1140, t, tNew - 0.2, 40);
  },

  // 1 — "Version 3.8, Lilies in a Dying Dream, brought her into the game on November 12th."
  (ctx, t, dur) => {
    const tLilies = when('lilies', 0, 1.6), tNov = when('november', 0, 4.3);
    cover(ctx, 'key_vertical_title', t, dur, [0.5, 0.62, 1.18], [0.5, 0.7, 1.04]);
    petals(ctx, t, { seed: 5 });
    butterfly(ctx, t, 880, 420, 1, 1);
    finish(ctx, { wash: 0.05 });
    plate(ctx, 'VERSION 3.8', W / 2, 260, t, 0.1, 54);
    if (t > tNov - 0.2) plate(ctx, 'NOVEMBER 12, 2026', W / 2, 380, t, tNov - 0.2, 40);
    const k = prog(t, tLilies - 0.2, 0.8);
    if (k > 0 && k < 1) { ctx.fillStyle = `rgba(240,225,255,${0.25 * Math.sin(k * Math.PI)})`; ctx.fillRect(0, 0, W, H); }
  },

  // 2 — Perfumer, then the Resonator War: drafted as a combat medic.
  (ctx, t, dur) => {
    const tPerf = when('perfumer', 0, 1.6), tWar = when('war', 0, 3.7), tMedic = when('medic', 0, 6.5);
    cover(ctx, 'key_4k', t, dur, [0.5, 0.28, 2.6], [0.5, 0.33, 2.2]);  // framed above the printed title
    // War: the dream darkens into embers.
    const war = ease.inOutCubic(prog(t, tWar - 0.3, 0.8));
    if (war > 0) {
      ctx.fillStyle = `rgba(40,4,10,${0.45 * war})`; ctx.fillRect(0, 0, W, H);
      sparks(ctx, t, { n: Math.round(70 * war), color: '255,120,70', rise: 160, size: 5 });
    }
    petals(ctx, t, { n: Math.round(24 * (1 - war)), seed: 9 });
    finish(ctx);
    if (t > tPerf - 0.2) plate(ctx, 'A PERFUMER', W / 2, 360, t, tPerf - 0.2, 52);
    if (t > tWar - 0.1) serif(ctx, 'THE RESONATOR WAR', W / 2, 520, 82, { alpha: ease.outCubic(prog(t, tWar - 0.1, 0.5)), fill: ['#FFFFFF', '#FFD3C2', '#FF7A5C'], glowColor: 'rgba(255,90,60,0.9)' });
    if (t > tMedic - 0.2) plate(ctx, 'DRAFTED AS A COMBAT MEDIC', W / 2, 1150, t, tMedic - 0.2, 38);
  },

  // 3 — Eased the trauma of broken soldiers with perfumes that weave short, healing dreams.
  (ctx, t, dur) => {
    const tTrauma = when('trauma', 0, 1.8), tPerf = when('perfumes', 0, 3.9), tDreams = when('dreams', 0, 5.7);
    cover(ctx, 'lily_banner', t, dur, [0.5, 0.55, 1.15], [0.5, 0.42, 1.0], {});
    // Rising dream motes and a slow breathing glow.
    sparks(ctx, t, { n: 60, color: '225,205,255', rise: 80, size: 7 });
    const breathe = 0.5 + 0.5 * Math.sin(t * 2.2);
    glow(ctx, W / 2, 820, 620, '210,180,255', 0.18 + 0.12 * breathe * prog(t, tPerf - 0.3, 0.8));
    petals(ctx, t, { seed: 3 });
    finish(ctx);
    if (t > tTrauma - 0.2) plate(ctx, 'SHE EASED THEIR TRAUMA', W / 2, 300, t, tTrauma - 0.2, 42);
    if (t > tDreams - 0.3) serif(ctx, 'healing dreams', W / 2, 1120, 110, { italic: true, alpha: ease.outCubic(prog(t, tDreams - 0.3, 0.7)) });
  },

  // 4 — She didn't survive the war; now she rides the Train of Souls, helping lost spirits find rest.
  (ctx, t, dur) => {
    const tSurvive = when('survive', 0, 0.7), tTrain = when('train', 0, 3.3), tRest = when('rest', 0, 6.4);
    // Blurred, dark backdrop of the same scene, with the crisp image framed on top.
    cover(ctx, 'main_quest', t, dur, [0.5, 0.5, 1.3], [0.55, 0.5, 1.4], { filter: 'blur(28px) brightness(0.55)' });
    const k = ease.outCubic(prog(t, 0.1, 0.8));
    withT(ctx, W / 2, 800 + (1 - k) * 40, 1, 0, () => {
      ctx.globalAlpha = k;
      const w = 900, h = w * ARTS.main_quest.img.height / ARTS.main_quest.img.width, z = 1 + 0.06 * (t / dur);
      const frame = rectPath(-w / 2, -h / 2, w, h, 26);
      glow(ctx, 0, 0, 640, '170,150,255', 0.35);
      ctx.save(); ctx.clip(frame);
      ctx.drawImage(ARTS.main_quest.img, -w * z / 2, -h * z / 2, w * z, h * z);
      ctx.restore();
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(225,200,255,0.9)'; ctx.stroke(frame);
    });
    // Drifting soul lights.
    sparks(ctx, t, { n: 40, color: '200,220,255', rise: 50, size: 8, seed: 21 });
    // Grief: desaturate everything right after "didn't survive".
    const grief = Math.sin(clamp((t - tSurvive) / 1.6) * Math.PI);
    if (grief > 0) { ctx.fillStyle = `rgba(10,10,20,${0.35 * grief})`; ctx.fillRect(0, 0, W, H); }
    finish(ctx);
    if (t > tTrain - 0.2) serif(ctx, 'THE TRAIN OF SOULS', W / 2, 360, 86, { alpha: ease.outCubic(prog(t, tTrain - 0.2, 0.6)) });
    if (t > tRest - 0.4) plate(ctx, 'GUIDING LOST SPIRITS TO REST', W / 2, 1180, t, tRest - 0.4, 36);
  },

  // 5 — Five-star Spectro healer with pistols, who falls asleep to heal her team.
  (ctx, t, dur) => {
    const tFive = when('fivestar', 0, 1.3), tSpec = when('spectro', 0, 2.0), tHeal = when('healer', 0, 2.6);
    const tPist = when('pistols', 0, 3.6), tAsleep = when('asleep', 0, 5.7);
    cover(ctx, 'lily_full', t, dur, [0.5, 0.25, 1.25], [0.5, 0.6, 1.05]);
    petals(ctx, t, { n: 16, seed: 14 });
    finish(ctx, { wash: 0.08 });
    const chips = [['★★★★★', tFive, 230], ['SPECTRO', tSpec, 340], ['HEALER', tHeal, 450], ['PISTOLS', tPist, 560]];
    chips.forEach(([label, t0, y], i) => { if (t > t0 - 0.2) plate(ctx, label, i % 2 ? 820 : 260, y, t, t0 - 0.2, 40); });
    // Sleepy "Z"s float up after "asleep", with a soft healing pulse.
    if (t > tAsleep - 0.2) {
      for (let i = 0; i < 4; i++) {
        const k = prog(t, tAsleep - 0.2 + i * 0.35, 1.6);
        if (k <= 0 || k >= 1) continue;
        serif(ctx, 'z', 700 + i * 40 + Math.sin(k * 6) * 20, 760 - k * 360, 70 + i * 18, { italic: true, alpha: 1 - k });
      }
      ring(ctx, t, tAsleep, W / 2, 900, { maxR: 600, life: 1.2, color: '180,255,210', width: 12 });
      // The official art of Lily asleep among lilies fades in as a framed panel.
      const ks = ease.outCubic(prog(t, tAsleep - 0.1, 0.7));
      withT(ctx, W / 2, 900 + (1 - ks) * 40, 1, 0, () => {
        ctx.globalAlpha = ks;
        const w = 960, h = w * ARTS.lily_sleeping.img.height / ARTS.lily_sleeping.img.width;
        const frame = rectPath(-w / 2, -h / 2, w, h, 24);
        glow(ctx, 0, 0, 560, '180,255,210', 0.35);
        ctx.save(); ctx.clip(frame); ctx.drawImage(ARTS.lily_sleeping.img, -w / 2, -h / 2, w, h); ctx.restore();
        ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(225,255,235,0.9)'; ctx.stroke(frame);
      });
      if (t > tAsleep + 0.4) plate(ctx, 'SHE SLEEPS TO HEAL', W / 2, 1180, t, tAsleep + 0.4, 40);
    }
  },

  // 6 — "So, are you pulling for Lily? Tell me in the comments."
  (ctx, t, dur) => {
    const tLily = when('lily', 0, 1.3), tComments = when('comments', 0, 2.6);
    cover(ctx, 'key_4k', t, dur, [0.5, 0.36, 1.9], [0.5, 0.36, 2.15]);
    petals(ctx, t, { n: 30, seed: 2 });
    butterfly(ctx, t, 200, 1050, 1, 0); butterfly(ctx, t, 880, 560, 0.8, 3);
    finish(ctx);
    serif(ctx, 'Pulling for Lily?', W / 2, 330, 104, { italic: true, alpha: ease.outCubic(prog(t, tLily - 0.4, 0.6)) });
    if (t > tComments - 0.3) plate(ctx, 'TELL ME IN THE COMMENTS', W / 2, 1180, t, tComments - 0.3, 40);
  },
];
</script>
</body>
</html>
