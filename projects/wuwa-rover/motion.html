<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Who is the Rover? motion scenes</title>
<script>
// Official Kuro Games Version 3.8 press-kit key art (see presskit/SOURCE.txt), cropped only and credited.
window.ART = Object.fromEntries(['rover_f', 'rover_m', 'rover_f_tall', 'rover_m_tall', 'key_vertical', 'key_4k'].map(n => [n, `presskit/${n}.jpg`]));
</script>
<script src="../../motion/lib.js"></script>
<script src="../../motion/wuwa.js"></script>
</head>
<body>
<script>
// Captions are burned in around y = 1300-1420, so keep that band calm.

// Echoes being pulled in and purified: dark motes spiral into a point and turn to light.
function echoSwirl(ctx, t, t0, cx, cy, { n = 40, life = 2.2, seed = 3 } = {}) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const delay = r() * 1.2, k = (t - t0 - delay) / life;
    if (k <= 0 || k >= 1) continue;
    const a0 = r() * Math.PI * 2, rad = 520 * (1 - ease.inCubic(k)), a = a0 + k * 5;
    const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad * 0.8;
    const pure = k;  // dark purple -> white as it nears the Rover
    const col = `${Math.round(lerp(120, 255, pure))},${Math.round(lerp(40, 245, pure))},${Math.round(lerp(160, 255, pure))}`;
    ctx.fillStyle = `rgba(${col},${0.9 * Math.sin(k * Math.PI)})`;
    ctx.beginPath(); ctx.arc(x, y, 6 + 8 * (1 - k), 0, Math.PI * 2); ctx.fill();
  }
}

// Resonance badge: glowing circle with the element's colour and name.
function badge(ctx, t, t0, x, y, label, col) {
  const k = pop(t, t0, 0.5);
  if (k <= 0) return;
  withT(ctx, x, y, k, 0, () => {
    glow(ctx, 0, 0, 170, col, 0.55 + 0.15 * Math.sin(t * 4));
    ctx.fillStyle = 'rgba(15,8,35,0.7)';
    ctx.beginPath(); ctx.arc(0, 0, 95, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = `rgb(${col})`; ctx.stroke();
    serif(ctx, label, 0, 4, 40, { fill: ['#FFFFFF', `rgb(${col})`], glowColor: `rgba(${col},0.9)` });
  });
  ring(ctx, t, t0, x, y, { maxR: 260, life: 0.6, color: col, width: 10 });
}

window.scenes = [
  // 0 — No memories, a world scarred by the Lament; this is the Rover.
  (ctx, t, dur) => {
    const tMem = when('memories', 0, 1.1), tLament = when('lament', 0, 5.2), tRover = when('rover', 0, 7.2);
    cover(ctx, 'key_vertical', t, dur, [0.5, 0.82, 1.9], [0.5, 0.72, 1.25]);
    // The Lament: a dark pulse washes over the scene.
    const dark = Math.sin(clamp((t - tLament + 0.3) / 1.4) * Math.PI);
    if (dark > 0) { ctx.fillStyle = `rgba(15,5,30,${0.45 * dark})`; ctx.fillRect(0, 0, W, H); }
    petals(ctx, t, { n: 16 });
    butterfly(ctx, t, 880, 420, 1, 0);
    finish(ctx);
    if (t > tMem - 0.2) plate(ctx, 'NO MEMORIES', W / 2, 260, t, tMem - 0.2, 46);
    if (t > tLament - 0.3) serif(ctx, 'the Lament', W / 2, 400, 90, { italic: true, alpha: ease.outCubic(prog(t, tLament - 0.3, 0.6)), fill: ['#FFFFFF', '#D9C2FF', '#8A6BD9'] });
    const kr = prog(t, tRover - 0.2, 0.6);
    if (kr > 0) { ctx.fillStyle = `rgba(230,210,255,${0.3 * (1 - kr)})`; ctx.fillRect(0, 0, W, H); }
    serif(ctx, 'ROVER', W / 2, 980, 210, { alpha: ease.outCubic(kr) });
    if (t > tRover + 0.6) plate(ctx, 'THE HERO OF WUTHERING WAVES', W / 2, 1140, t, tRover + 0.6, 36);
  },

  // 1 — Choose a male or a female Rover; same story either way.
  (ctx, t, dur) => {
    const tMale = when('male', 0, 1.8), tFemale = when('female', 0, 2.5), tSame = when('same', 0, 4.6);
    const z = 1 + 0.06 * (t / dur);
    coverIn(ctx, 'rover_m_tall', 0, 0, W / 2, H, 0.3, 0.35, z);
    coverIn(ctx, 'rover_f_tall', W / 2, 0, W / 2, H, 0.6, 0.3, z);
    // Glowing divider.
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(220,200,255,0)'); g.addColorStop(0.5, 'rgba(240,225,255,0.95)'); g.addColorStop(1, 'rgba(220,200,255,0)');
    ctx.fillStyle = g; ctx.fillRect(W / 2 - 3, 0, 6, H);
    glow(ctx, W / 2, H / 2, 300, '220,200,255', 0.25);
    // Dim the side not being named.
    const focus = t < tMale - 0.1 ? 0 : t < tFemale - 0.1 ? -1 : t < tSame - 0.3 ? 1 : 0;
    if (focus) { ctx.fillStyle = 'rgba(10,5,25,0.45)'; ctx.fillRect(focus < 0 ? W / 2 : 0, 0, W / 2, H); }
    finish(ctx, { wash: 0.06 });
    if (t > tMale - 0.2) plate(ctx, 'MALE', W / 4, 300, t, tMale - 0.2, 46);
    if (t > tFemale - 0.2) plate(ctx, 'FEMALE', W * 3 / 4, 300, t, tFemale - 0.2, 46);
    if (t > tSame - 0.3) plate(ctx, 'SAME STORY', W / 2, 1180, t, tSame - 0.3, 42);
  },

  // 2 — Absorbs and purifies Echoes from Tacet Discords; no other Resonator can.
  (ctx, t, dur) => {
    const tUnique = when('unique', 0, 1.2), tAbsorb = when('absorb', 0, 2.4), tPurify = when('purify', 0, 5.6), tNo = when('no', 0, 7.3);
    cover(ctx, 'rover_f', t, dur, [0.45, 0.32, 1.25], [0.5, 0.4, 1.05]);
    ctx.fillStyle = 'rgba(15,5,35,0.35)'; ctx.fillRect(0, 0, W, H);
    echoSwirl(ctx, t, tAbsorb - 0.2, 520, 640);
    // Purify: a bright pulse.
    if (t > tPurify - 0.2) {
      glow(ctx, 520, 640, 520, '235,225,255', 0.4 * Math.sin(clamp((t - tPurify + 0.2) / 1.6) * Math.PI));
      ring(ctx, t, tPurify, 520, 640, { maxR: 700, life: 0.9, color: '240,230,255', width: 14 });
    }
    finish(ctx);
    if (t > tUnique - 0.2) plate(ctx, 'ONE OF A KIND', W / 2, 260, t, tUnique - 0.2, 44);
    if (t > tAbsorb - 0.1) serif(ctx, 'absorbs Echoes', W / 2, 400, 96, { italic: true, alpha: ease.outCubic(prog(t, tAbsorb - 0.1, 0.6)) });
    if (t > tNo - 0.3) plate(ctx, 'NO OTHER RESONATOR CAN', W / 2, 1180, t, tNo - 0.3, 38);
  },

  // 3 — More than one Resonance: Spectro and Havoc from the start, later Aero.
  (ctx, t, dur) => {
    const tSpec = when('spectro', 0, 2.7), tHavoc = when('havoc', 0, 3.5), tAero = when('aero', 0, 6.7);
    cover(ctx, 'rover_m_tall', t, dur, [0.3, 0.3, 1.25], [0.32, 0.4, 1.05]);
    // Each element tints the scene as it's named.
    const tint = t > tAero ? '90,230,170' : t > tHavoc ? '200,40,90' : t > tSpec ? '255,220,120' : null;
    if (tint) { ctx.fillStyle = `rgba(${tint},0.12)`; ctx.fillRect(0, 0, W, H); }
    finish(ctx);
    if (t > 0.3) plate(ctx, 'MORE THAN ONE RESONANCE', W / 2, 260, t, 0.3, 38);
    badge(ctx, t, tSpec - 0.15, 230, 1040, 'SPECTRO', '255,220,120');
    badge(ctx, t, tHavoc - 0.15, 540, 1040, 'HAVOC', '220,60,110');
    badge(ctx, t, tAero - 0.15, 850, 1040, 'AERO', '90,230,170');
  },

  // 4 — Spoiler: the amnesia was no accident; the past Rover chose to forget.
  (ctx, t, dur) => {
    const tAccident = when('accident', 0, 3.5), tChose = when('chose', 0, 5.6);
    cover(ctx, 'rover_m_tall', t, dur, [0.3, 0.32, 1.35], [0.3, 0.3, 1.6], { filter: `blur(${Math.round(10 * (1 - prog(t, tChose - 0.4, 1)))}px) brightness(0.7)` });
    // A slow glitch: offset ghost copies flicker before the reveal.
    if (t > tAccident - 0.3 && t < tChose) {
      ctx.save(); ctx.globalAlpha = 0.18 + 0.12 * Math.abs(Math.sin(t * 23));
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(Math.sin(t * 41) * 14, 0);
      cover(ctx, 'rover_m_tall', t, dur, [0.3, 0.32, 1.35], [0.3, 0.3, 1.6]);
      ctx.restore();
    }
    finish(ctx, { wash: 0.18 });
    plate(ctx, '⚠ SPOILER', W / 2, 260, t, 0.0, 46, { border: 'rgba(255,120,120,0.9)', bg: 'rgba(60,8,15,0.7)', color: '#FFD9D9' });
    if (t > tAccident - 0.2) serif(ctx, 'no accident', W / 2, 520, 100, { italic: true, alpha: ease.outCubic(prog(t, tAccident - 0.2, 0.5)) });
    const kc = ease.outCubic(prog(t, tChose - 0.1, 0.6));
    if (kc > 0) {
      ctx.fillStyle = `rgba(240,225,255,${0.35 * (1 - kc)})`; ctx.fillRect(0, 0, W, H);
      serif(ctx, 'THEY CHOSE', W / 2, 980, 116, { alpha: kc });
      serif(ctx, 'TO FORGET', W / 2, 1110, 116, { alpha: kc });
    }
  },

  // 5 — Version 3.8: a separate Echo set for each Resonance Attribute.
  (ctx, t, dur) => {
    const tVer = when('version', 0, 0.4), tEcho = when('echo', 0, 4.5), tAttr = when('attribute', 0, 6.5);
    cover(ctx, 'key_vertical', t, dur, [0.5, 0.76, 1.5], [0.5, 0.7, 1.3]);
    petals(ctx, t, { seed: 6 });
    finish(ctx);
    if (t > tVer - 0.2) plate(ctx, 'VERSION 3.8', W / 2, 260, t, tVer - 0.2, 52);
    if (t > tEcho - 0.3) serif(ctx, 'one Echo set', W / 2, 980, 100, { italic: true, alpha: ease.outCubic(prog(t, tEcho - 0.3, 0.6)) });
    if (t > tAttr - 0.4) {
      serif(ctx, 'per Attribute', W / 2, 1100, 100, { italic: true, alpha: ease.outCubic(prog(t, tAttr - 0.4, 0.6)) });
      [['255,220,120', 330], ['220,60,110', 540], ['90,230,170', 750]].forEach(([col, x], i) => {
        const k = pop(t, tAttr - 0.2 + i * 0.12, 0.4);
        if (k > 0) withT(ctx, x, 1210, k, 0, () => { glow(ctx, 0, 0, 60, col, 0.8); ctx.fillStyle = `rgb(${col})`; ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill(); });
      });
    }
  },

  // 6 — Outro: male or female Rover?
  (ctx, t, dur) => {
    const tMale = when('male', 0, 1.3), tFemale = when('female', 0, 1.9), tComments = when('comments', 0, 3.7);
    const z = 1.02 + 0.05 * (t / dur);
    coverIn(ctx, 'rover_m_tall', 0, 0, W / 2, H, 0.3, 0.35, z);
    coverIn(ctx, 'rover_f_tall', W / 2, 0, W / 2, H, 0.6, 0.3, z);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(220,200,255,0)'); g.addColorStop(0.5, 'rgba(240,225,255,0.95)'); g.addColorStop(1, 'rgba(220,200,255,0)');
    ctx.fillStyle = g; ctx.fillRect(W / 2 - 3, 0, 6, H);
    finish(ctx, { wash: 0.1 });
    serif(ctx, 'Which Rover', W / 2, 270, 100, { italic: true, alpha: ease.outCubic(prog(t, 0.1, 0.6)) });
    serif(ctx, 'are you?', W / 2, 390, 100, { italic: true, alpha: ease.outCubic(prog(t, 0.4, 0.6)) });
    if (t > tMale - 0.2) plate(ctx, 'MALE', W / 4, 1060, t, tMale - 0.2, 44);
    if (t > tFemale - 0.2) plate(ctx, 'FEMALE', W * 3 / 4, 1060, t, tFemale - 0.2, 44);
    if (t > tComments - 0.3) plate(ctx, 'TELL ME IN THE COMMENTS', W / 2, 1190, t, tComments - 0.3, 38);
  },
];
</script>
</body>
</html>
