<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Archer Queen evolution motion scenes</title>
<script>
// Official Supercell Fan Kit art (tools/fankit.py fetch projects/aq-evolution/fankit.json).
// Drawn scaled, moved and faded only, never altered, per the Fan Content Policy.
window.ART = Object.fromEntries([
  'queen_a', 'queen_b', 'skin_gladiator', 'skin_primal', 'skin_ghost', 'skin_pirate', 'skin_dragon', 'skin_champion',
  'skin_valkyrie', 'eq_puppet', 'eq_vial', 'eq_giant_arrow', 'eq_frozen_arrow', 'titan_queen', 'archer', 'king',
].map(n => [n, `fankit/${n}.png`]));
</script>
<script src="../../../motion/lib.js"></script>
</head>
<body>
<script>
// Captions are burned in around y = 1300-1420, so keep that band calm.
const ROYAL = { mid: '#6A2FC0', top: '#26104E', bottom: '#0A0418', rayColor: 'rgba(210,170,255,0.10)' };
const float = (t, k = 0, amp = 10, speed = 1.6) => Math.sin(t * speed + k) * amp;
const finish = ctx => vignette(ctx, 0.62);
function ambient(ctx, t, bg = {}, sp = {}) { background(ctx, t, bg); sparks(ctx, t, sp); }

function yearStamp(ctx, t, t0, label, year, y = 290) {
  const k = t < t0 ? 0 : lerp(2.4, 1, ease.outBack(prog(t, t0, 0.35), 2));
  if (k <= 0) return;
  withT(ctx, W / 2, y, k, -0.03, () => {
    if (label) pill(ctx, label, 0, -125, 44, [C.gold, C.goldLo], C.ink);
    title(ctx, year, 0, 0, 190, { fill: [C.white, C.goldHi, C.gold] });
  });
}

function levelBadge(ctx, x, y, s, lvl, rot = 0.06) {
  withT(ctx, x, y, s, rot, () => {
    chunky(ctx, rectPath(-175, -82, 350, 164, 40), C.purple, C.purpleLo, { lw: 12, y0: -82, y1: 82 });
    title(ctx, `LV ${lvl}`, 0, 4, 98, { fill: [C.white, C.goldHi, C.gold] });
  });
}

// A volley of arrows streaking diagonally across the frame from t0.
function arrowRain(ctx, t, t0, { n = 14, seed = 4, life = 0.9, dir = 1 } = {}) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const delay = r() * 1.4, k = (t - t0 - delay) / life;
    const x0 = r() * W * 1.2 - W * 0.1, y0 = -120 - r() * 300;
    if (k <= 0 || k >= 1) continue;
    const x = x0 + dir * k * 700, y = y0 + k * 1500, ang = Math.atan2(1500, dir * 700);
    withT(ctx, x, y, 1, ang - Math.PI / 2, () => {
      ctx.strokeStyle = `rgba(255,235,190,${0.25 * (1 - k)})`; ctx.lineWidth = 10; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -160); ctx.stroke();
      chunky(ctx, rectPath(-4, -70, 8, 70, 3), '#B98552', '#6B4320', { lw: 3, gloss: false, y0: -70, y1: 0 });
      chunky(ctx, polyPath([[-11, 0], [0, 24], [11, 0]]), '#EEF2FA', '#9DA8C0', { lw: 3, gloss: false, y0: 0, y1: 24 });
      chunky(ctx, polyPath([[-10, -70], [0, -56], [10, -70], [0, -84]]), C.purpleHi, C.purple, { lw: 3, gloss: false, y0: -84, y1: -56 });
    });
  }
}

window.scenes = [
  // 0 — Hook: raining arrows for almost fourteen years; level 30 to 115.
  (ctx, t, dur) => {
    const t14 = when('fourteen', 0, 2.2), tAQ = when('archer', 0, 4.3), t30 = when('30', 0, 5.6), t115 = when('115', 0, 6.5);
    const [sx, sy] = shakeAt(t, t115 + 0.3, 26, 4);
    ctx.translate(sx, sy);
    ambient(ctx, t, { ...ROYAL, cy: 760 }, { color: '210,170,255', rise: 90 });
    arrowRain(ctx, t, 0.2, { n: 18 });

    const kk = ease.outBack(prog(t, 0.0, 0.7), 1.2);
    glow(ctx, W / 2, 800, 560, '200,150,255', 0.5 * kk);
    if (kk > 0) art(ctx, 'queen_a', W / 2 + lerp(500, 0, kk), 820 + float(t), 780);

    withT(ctx, W / 2, 175, pop(t, t14 - 0.1, 0.4), 0, () => pill(ctx, '14 YEARS OF ARROWS', 0, 0, 46, [C.gold, C.goldLo], C.ink));
    withT(ctx, W / 2, 300, pop(t, tAQ - 0.2, 0.45), 0, () => title(ctx, 'ARCHER QUEEN', 0, 0, 112));
    if (t > t30 - 0.15) {
      const lvl = Math.round(lerp(30, 115, ease.outCubic(prog(t, t115 - 0.1, 0.4))));
      const s = pop(t, t30 - 0.15, 0.4) * (t > t115 + 0.3 ? lerp(1.4, 1, ease.outBack(prog(t, t115 + 0.3, 0.35))) : 1);
      levelBadge(ctx, 250, 580, s, lvl, -0.06);
    }
    ring(ctx, t, t115 + 0.3, 250, 580, { maxR: 700 });
    burst(ctx, t, t115 + 0.3, 250, 580, { n: 60, speed: 1100 });
    flash(ctx, t, t115 + 0.3, { peak: 0.55, color: '235,215,255' });
    finish(ctx);
  },

  // 1 — January 2013: same update as the Barbarian King, 30 levels.
  (ctx, t, dur) => {
    const tSame = when('same', 0, 3.3), tBK = when('barbarian', 0, 4.3), t30 = when('30', 0, 5.9);
    const [sx, sy] = shakeAt(t, 0.15, 18, 5);
    ctx.translate(sx, sy);
    ambient(ctx, t, { mid: '#3E6A2E', top: '#16300E', bottom: '#060E04', rayColor: 'rgba(220,255,160,0.08)', cy: 820 },
            { color: '220,255,170' });
    yearStamp(ctx, t, 0.0, 'JANUARY', '2013');
    flash(ctx, t, 0.15, { peak: 0.45 });

    // The Queen enters, then slides left to make room for the King.
    const kq = ease.outBack(prog(t, 0.8, 0.7), 1.2), side = ease.inOutCubic(prog(t, tBK - 0.3, 0.5));
    if (kq > 0) art(ctx, 'queen_b', lerp(W / 2, 330, side), lerp(1700, 830, kq) + float(t), lerp(680, 560, side));
    const kk = ease.outBack(prog(t, tBK - 0.1, 0.55), 1.3);
    if (kk > 0) art(ctx, 'king', lerp(1400, 760, kk), 840 + float(t, 2), 590);
    if (kk > 0) withT(ctx, W / 2, 560, pop(t, tBK, 0.4), 0, () => title(ctx, '&', 0, 0, 130, { fill: [C.white, C.goldHi] }));
    burst(ctx, t, tBK - 0.1, 760, 840, { n: 30, speed: 600 });
    withT(ctx, W / 2, 1215, pop(t, tSame - 0.1, 0.45), 0, () => pill(ctx, 'SAME UPDATE AS THE KING', 0, 0, 54, [C.red, '#A51515']));
    withT(ctx, 880, 520, pop(t, t30 - 0.1, 0.4), 0.1, () => {
      chunky(ctx, rectPath(-150, -70, 300, 140, 34), C.purple, C.purpleLo, { lw: 10, y0: -70, y1: 70 });
      title(ctx, 'MAX 30', 0, 4, 74, { fill: [C.white, C.goldHi] });
    });
    finish(ctx);
  },

  // 2 — A year later: the Royal Cloak (invisible + a pack of archers).
  (ctx, t, dur) => {
    const tRoyal = when('royal', 0, 2.8), tInv = when('invisible', 0, 4.7), tArch = when('archers', 0, 6.5);
    const [sx, sy] = shakeAt(t, tRoyal + 0.1, 22, 5);
    ctx.translate(sx, sy);
    ambient(ctx, t, { mid: '#1F6E6A', top: '#08302E', bottom: '#020E0D', rayColor: 'rgba(150,255,240,0.09)', cy: 800 },
            { color: '150,255,235', rise: 110 });
    withT(ctx, W / 2, 175, pop(t, 0, 0.4), 0, () => pill(ctx, 'A YEAR LATER: 2014', 0, 0, 44, [C.gold, C.goldLo], C.ink));
    const kt = t < tRoyal ? 0 : lerp(2.4, 1, ease.outBack(prog(t, tRoyal, 0.35), 2));
    if (kt > 0) withT(ctx, W / 2, 320, kt, 0, () => title(ctx, 'ROYAL CLOAK', 0, 0, 122, { fill: ['#E0FFFB', '#5EEAD4', '#0F9488'] }));
    flash(ctx, t, tRoyal + 0.1, { peak: 0.45, color: '190,255,245' });

    // She shimmers and fades nearly out on "invisible", then flickers back.
    const fade = prog(t, tInv - 0.1, 0.5), back = prog(t, tArch + 0.6, 0.5);
    const alpha = 1 - 0.85 * fade + 0.85 * back;
    if (fade > 0 && back < 1) for (let i = 0; i < 3; i++) ring(ctx, t, tInv + i * 0.15, W / 2, 800, { maxR: 420, life: 0.8, color: '150,255,235', width: 12 });
    art(ctx, 'queen_a', W / 2 + Math.sin(t * 25) * 6 * fade * (1 - back), 820 + float(t), 720, { alpha, shadow: alpha > 0.5 });
    // Archers pop in around her.
    for (let i = 0; i < 4; i++) {
      const k = ease.outBack(prog(t, tArch - 0.3 + i * 0.12, 0.45), 1.4);
      if (k <= 0) continue;
      const sideX = i % 2 ? 1 : -1, row = Math.floor(i / 2);
      art(ctx, 'archer', W / 2 + sideX * lerp(700, 340 - row * 60, k), 1010 + row * 70, 280, { flip: sideX > 0 });
    }
    finish(ctx);
  },

  // 3 — 2019: first skins (Gladiator Queen); dozens since, from Valkyrie Queen to Pirate Queen.
  (ctx, t, dur) => {
    const tGlad = when('gladiator', 0, 3.1), tDozens = when('dozens', 0, 6.1), tValk = when('valkyrie', 0, 7.1), tPirate = when('pirate', 0, 8.3);
    ambient(ctx, t, { ...ROYAL, cy: 760 }, {});
    yearStamp(ctx, t, 0.0, 'FIRST SKINS', '2019', 280);

    const move = ease.inOutCubic(prog(t, tDozens - 0.2, 0.6));
    const kg = ease.outBack(prog(t, tGlad - 0.3, 0.55), 1.3);
    if (kg > 0) {
      const x = lerp(W / 2, 540, move), y = lerp(800, 700, move), h = lerp(720, 400, move);
      glow(ctx, x, y, h * 0.75, '230,220,255', 0.5 * kg * (1 - move * 0.5));
      art(ctx, 'skin_gladiator', x, y + float(t), h * kg);
      if (move < 1) withT(ctx, W / 2, 1215, kg * (1 - move), 0, () => pill(ctx, 'GLADIATOR QUEEN', 0, 0, 58, [C.gold, C.goldLo], C.ink));
    }
    flash(ctx, t, tGlad - 0.3, { peak: 0.35 });
    const skins = [['skin_valkyrie', 195, 720, tValk], ['skin_pirate', 885, 720, tPirate], ['skin_ghost', 195, 1085, tDozens + 0.2],
                   ['skin_champion', 540, 1100, tDozens + 0.35], ['skin_primal', 885, 1085, tDozens + 0.5]];
    skins.forEach(([name, x, y, t0], i) => {
      const k = pop(t, t0, 0.45);
      if (k <= 0) return;
      const big = (name === 'skin_valkyrie' && t > tValk && t < tValk + 0.8) || (name === 'skin_pirate' && t > tPirate);
      art(ctx, name, x, y + float(t, i, 8, 2), 330 * k * (big ? 1.12 : 1));
      burst(ctx, t, t0, x, y, { n: 18, speed: 420, life: 0.5, seed: 30 + i, size: 7 });
    });
    if (t > tDozens) withT(ctx, W / 2, 470, pop(t, tDozens, 0.4), 0.03, () => pill(ctx, 'DOZENS OF SKINS', 0, 0, 48, [C.red, '#A51515']));
    finish(ctx);
  },

  // 4 — December 2023: the Royal Cloak split into Hero Equipment (Archer Puppet, Invisibility Vial).
  (ctx, t, dur) => {
    const tRoyal = when('royal', 0, 2.4), tSplit = when('split', 0, 3.2), tHero = when('hero', 0, 4.0);
    const tPuppet = when('puppet', 0, 5.8), tVial = when('invisibility', 0, 6.6);
    const [sx, sy] = shakeAt(t, tSplit, 22, 5);
    ctx.translate(sx, sy);
    ambient(ctx, t, { mid: '#1E4A8A', top: '#0E1A44', bottom: '#050818', rayColor: 'rgba(140,190,255,0.08)', cy: 800 },
            { color: '170,210,255' });
    yearStamp(ctx, t, 0.0, 'DECEMBER', '2023', 280);

    if (t > tRoyal - 0.2 && t < tHero + 0.4) {
      const k = pop(t, tRoyal - 0.2, 0.35), sp = ease.outCubic(prog(t, tSplit, 0.5)), fade = 1 - prog(t, tHero, 0.4);
      const teal = { fill: ['#E0FFFB', '#5EEAD4', '#0F9488'] };
      ctx.save(); ctx.globalAlpha = fade;
      if (sp <= 0) withT(ctx, W / 2, 720, k, 0, () => title(ctx, 'ROYAL CLOAK', 0, 0, 140, teal));
      else {
        withT(ctx, W / 2 - 215 - sp * 160, 720 + sp * 90, 1, -sp * 0.35, () => title(ctx, 'ROYAL', 0, 0, 140, teal));
        withT(ctx, W / 2 + 215 + sp * 160, 720 + sp * 90, 1, sp * 0.35, () => title(ctx, 'CLOAK', 0, 0, 140, teal));
      }
      ctx.restore();
    }
    burst(ctx, t, tSplit, W / 2, 720, { n: 50, speed: 900, color: '150,255,235' });
    withT(ctx, W / 2, 520, pop(t, tHero - 0.1, 0.45), 0, () => title(ctx, 'HERO EQUIPMENT', 0, 0, 104));

    const items = [['eq_puppet', 'ARCHER PUPPET', 300, 800, tPuppet, [C.green, '#2E9A38']],
                   ['eq_vial', 'INVISIBILITY VIAL', 780, 800, tVial, ['#5EEAD4', '#0F9488']],
                   ['eq_giant_arrow', 'GIANT ARROW', 300, 1110, tHero + 0.5, ['#C8CFDD', C.stoneLo]],
                   ['eq_frozen_arrow', 'FROZEN ARROW', 780, 1110, tHero + 0.7, ['#7BC6FF', '#2370B8']]];
    items.forEach(([name, label, x, y, t0, col], i) => {
      const k = pop(t, t0, 0.45);
      if (k <= 0) return;
      const hl = (i < 2 && t > t0 && t < t0 + 0.9) ? 1.08 : 1;
      withT(ctx, x, y + float(t, i, 6, 2.2), k * hl, (i % 2 ? 1 : -1) * 0.03, () => {
        chunky(ctx, rectPath(-200, -150, 400, 300, 34), col[0], col[1], { lw: 12, y0: -150, y1: 150 });
        art(ctx, name, 0, -22, 190, { shadow: false });
        title(ctx, label, 0, 112, 32, { fill: C.white, lw: 8 });
      });
    });
    finish(ctx);
  },

  // 5 — Level cap: 100 (TH17), 110 (TH18), 115 (TH19).
  (ctx, t, dur) => {
    const t100 = when('100', 0, 2.1), t110 = when('110', 0, 4.5), t115 = when('115', 0, 7.8);
    const [sx, sy] = shakeAt(t, t115 + 0.25, 26, 4);
    ctx.translate(sx, sy);
    ambient(ctx, t, { ...ROYAL, cy: 900 }, { color: '210,170,255', rise: 90 });
    withT(ctx, W / 2, 210, pop(t, 0, 0.45), 0, () => title(ctx, 'LEVEL CAP', 0, 0, 140));

    const bars = [['2013', 30, -1], ['TH17', 100, t100], ['TH18', 110, t110], ['TH19', 115, t115]];
    const base = 1180, maxH = 720, bw = 170;
    bars.forEach(([label, lvl, t0], i) => {
      const g = t0 < 0 ? ease.outCubic(prog(t, 0.2, 0.6)) : ease.outBack(prog(t, t0 - 0.1, 0.55), 1.2);
      if (g <= 0) return;
      const x = 195 + i * 230, h = maxH * (lvl / 115) * g;
      const top = i === 3 ? [C.goldHi, C.orange] : i === 0 ? ['#B9AFC9', '#6C6280'] : [C.purpleHi, C.purple];
      if (i === 3 && t > t115) glow(ctx, x, base - h, 260, '255,220,120', 0.7);
      chunky(ctx, rectPath(x - bw / 2, base - h, bw, h, 18), top[0], top[1], { lw: 10, y0: base - h, y1: base });
      title(ctx, `${Math.round(lvl * Math.min(1, g))}`, x, base - h - 55, 70, { fill: [C.white, C.goldHi] });
      title(ctx, label, x, base + 45, 40, { fill: C.white, lw: 8 });
    });
    const kk = ease.outBack(prog(t, t115 + 0.1, 0.5), 1.3);
    if (kk > 0) art(ctx, 'queen_b', 160, 700 + float(t), 310 * kk);
    ring(ctx, t, t115 + 0.25, 885, 470, { maxR: 650 });
    burst(ctx, t, t115 + 0.25, 885, 470, { n: 60, speed: 1100 });
    flash(ctx, t, t115 + 0.25, { peak: 0.5, color: '235,215,255' });
    finish(ctx);
  },

  // 6 — The armored Titan skin.
  (ctx, t, dur) => {
    const tTitan = when('titan', 0, 2.1);
    const [sx, sy] = shakeAt(t, tTitan, 24, 4);
    ctx.translate(sx, sy);
    ambient(ctx, t, { mid: '#6E7A12', top: '#2C3204', bottom: '#0C0E00', rayColor: 'rgba(240,240,170,0.15)', cy: 780 },
            { color: '240,235,150', rise: 120, n: 110 });
    withT(ctx, W / 2, 190, pop(t, 0, 0.4), 0, () => pill(ctx, 'THIS SEASON', 0, 0, 46, [C.white, '#D8D8D8'], C.ink));
    const kk = ease.outBack(prog(t, 0.3, 0.8), 1.2);
    glow(ctx, W / 2, 800, 600, '240,235,150', 0.6 * kk);
    if (kk > 0) art(ctx, 'titan_queen', W / 2, lerp(1700, 820, kk) + float(t), 820);
    const kt = t < tTitan ? 0 : lerp(2.4, 1, ease.outBack(prog(t, tTitan, 0.35), 2));
    if (kt > 0) withT(ctx, W / 2, 330, kt, 0, () => title(ctx, 'TITAN QUEEN', 0, 0, 150, { fill: [C.white, C.goldHi, C.gold] }));
    ring(ctx, t, tTitan, W / 2, 800, { maxR: 800 });
    burst(ctx, t, tTitan, W / 2, 800, { n: 80, speed: 1300 });
    flash(ctx, t, tTitan, { peak: 0.7, color: '250,250,200' });
    withT(ctx, W / 2, 1215, pop(t, tTitan + 0.3, 0.4), 0, () => pill(ctx, 'NEW SKIN', 0, 0, 58, [C.red, '#A51515']));
    finish(ctx);
  },

  // 7 — Outro: King or Queen?
  (ctx, t, dur) => {
    const tKing = when('king', 0, 2.2), tQueen = when('queen', 0, 3.1), tComments = when('comments', 0, 4.6);
    const [sx, sy] = shakeAt(t, tQueen + 0.1, 20, 5);
    ctx.translate(sx, sy);
    ambient(ctx, t, { mid: '#7A2340', top: '#2E0A18', bottom: '#0E0308', rayColor: 'rgba(255,190,140,0.10)' }, {});
    withT(ctx, W / 2, 230, pop(t, 0.0, 0.45), 0, () => title(ctx, "WHO'S STRONGER?", 0, 0, 108));
    const kk = ease.outBack(prog(t, tKing - 0.3, 0.5), 1.3), kq = ease.outBack(prog(t, tQueen - 0.3, 0.5), 1.3);
    if (kk > 0) { glow(ctx, 290, 780, 360, '255,180,90', 0.45 * kk); art(ctx, 'king', lerp(-300, 290, kk), 800 + float(t), 640); }
    if (kq > 0) { glow(ctx, 790, 780, 360, '200,150,255', 0.45 * kq); art(ctx, 'queen_a', lerp(1400, 790, kq), 800 + float(t, 2), 660, { flip: true }); }
    const kv = t < tQueen + 0.1 ? 0 : lerp(2.6, 1, ease.outBack(prog(t, tQueen + 0.1, 0.35), 2));
    if (kv > 0) withT(ctx, W / 2, 760, kv, -0.08, () => {
      glow(ctx, 0, 0, 200, '255,220,120', 0.7);
      title(ctx, 'VS', 0, 0, 170, { fill: [C.white, C.goldHi, C.red] });
    });
    burst(ctx, t, tQueen + 0.1, W / 2, 760, { n: 60, speed: 1000 });
    flash(ctx, t, tQueen + 0.1, { peak: 0.5 });
    withT(ctx, W / 2, 1215, pop(t, tComments - 0.2, 0.45), 0, () => pill(ctx, 'TELL ME IN THE COMMENTS', 0, 0, 50, [C.red, '#A51515']));
    finish(ctx);
  },
];
</script>
</body>
</html>
