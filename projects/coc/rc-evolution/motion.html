<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Royal Champion evolution motion scenes</title>
<script>
// Official Supercell Fan Kit art (tools/fankit.py fetch projects/rc-evolution/fankit.json).
// Drawn scaled, moved and faded only, never altered, per the Fan Content Policy.
window.ART = Object.fromEntries([
  'champion', 'champion_b', 'th13', 'skin_party', 'skin_primal', 'skin_ghost', 'skin_dragon', 'skin_magic', 'skin_dark_ages',
  'eq_shield', 'eq_gem', 'eq_haste', 'eq_hog_doll', 'titan_champion', 'king', 'queen', 'warden', 'cannon', 'air_defense',
].map(n => [n, `fankit/${n}.png`]));
</script>
<script src="../../../motion/lib.js"></script>
</head>
<body>
<script>
// Captions are burned in around y = 1300-1420, so keep that band calm.
const STEEL = { mid: '#2E5E9E', top: '#0E2448', bottom: '#040A18', rayColor: 'rgba(170,220,255,0.10)' };
const float = (t, k = 0, amp = 10, speed = 1.6) => Math.sin(t * speed + k) * amp;
const finish = ctx => vignette(ctx, 0.62);
function ambient(ctx, t, bg = {}, sp = {}) { background(ctx, t, bg); sparks(ctx, t, sp); }

function yearStamp(ctx, t, t0, label, year, y = 290) {
  const k = t < t0 ? 0 : lerp(2.4, 1, ease.outBack(prog(t, t0, 0.35), 2));
  if (k <= 0) return;
  withT(ctx, W / 2, y, k, -0.03, () => {
    if (label) pill(ctx, label, 0, -125, 44, [C.gold, C.goldLo], C.ink);
    title(ctx, year, 0, 0, 190, { fill: [C.white, C.goldHi, C.gold] });
  });
}

function levelBadge(ctx, x, y, s, lvl, rot = 0.06) {
  withT(ctx, x, y, s, rot, () => {
    chunky(ctx, rectPath(-175, -82, 350, 164, 40), C.purple, C.purpleLo, { lw: 12, y0: -82, y1: 82 });
    title(ctx, `LV ${lvl}`, 0, 4, 98, { fill: [C.white, C.goldHi, C.gold] });
  });
}

// Red targeting reticle that snaps onto (x, y) at t0.
function reticle(ctx, t, t0, x, y, r = 90) {
  const k = prog(t, t0, 0.3);
  if (k <= 0) return;
  const s = lerp(2.2, 1, ease.outCubic(k)), spin = t * 1.5;
  withT(ctx, x, y, s, spin, () => {
    ctx.strokeStyle = `rgba(255,70,70,${0.9 * k})`; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath(); ctx.moveTo(r - 30, 0); ctx.lineTo(r + 30, 0); ctx.stroke();
    }
  });
}

window.scenes = [
  // 0 — Hook: the hero who hunts defenses; almost seven years; level 20 to 60.
  (ctx, t, dur) => {
    const tHunt = when('hunts', 0, 1.0), t7 = when('seven', 0, 3.8), tRC = when('royal', 0, 6.0), t20 = when('20', 0, 7.5), t60 = when('60', 0, 8.7);
    const [sx, sy] = shakeAt(t, t60 + 0.3, 26, 4);
    ctx.translate(sx, sy);
    ambient(ctx, t, { ...STEEL, cy: 760 }, { color: '170,220,255', rise: 90 });
    // Defenses she is hunting, marked with reticles on "hunts".
    const defs = [['cannon', 140, 1080], ['air_defense', 940, 1080]];
    defs.forEach(([name, x, y], i) => {
      const k = pop(t, 0.2 + i * 0.1, 0.4);
      if (k > 0) art(ctx, name, x, y, 230 * k);
      reticle(ctx, t, tHunt + i * 0.15, x, y - 10, 120);
    });
    const kk = ease.outBack(prog(t, 0.0, 0.7), 1.2);
    glow(ctx, W / 2, 800, 540, '170,220,255', 0.5 * kk);
    if (kk > 0) art(ctx, 'champion_b', W / 2 + lerp(-500, 0, kk), 800 + float(t), 620);
    withT(ctx, W / 2, 175, pop(t, tHunt - 0.1, 0.4), 0, () => pill(ctx, 'DEFENSE HUNTER', 0, 0, 46, [C.red, '#A51515']));
    withT(ctx, W / 2, 1215, pop(t, t7 - 0.1, 0.4), 0, () => pill(ctx, '7 YEARS OF HUNTING', 0, 0, 52, [C.gold, C.goldLo], C.ink));
    withT(ctx, W / 2, 300, pop(t, tRC - 0.2, 0.45), 0, () => title(ctx, 'ROYAL CHAMPION', 0, 0, 104));
    if (t > t20 - 0.15) {
      const lvl = Math.round(lerp(20, 60, ease.outCubic(prog(t, t60 - 0.1, 0.4))));
      const s = pop(t, t20 - 0.15, 0.4) * (t > t60 + 0.3 ? lerp(1.4, 1, ease.outBack(prog(t, t60 + 0.3, 0.35))) : 1);
      levelBadge(ctx, 830, 520, s, lvl);
    }
    ring(ctx, t, t60 + 0.3, 830, 520, { maxR: 700 });
    burst(ctx, t, t60 + 0.3, 830, 520, { n: 60, speed: 1100 });
    flash(ctx, t, t60 + 0.3, { peak: 0.55, color: '220,240,255' });
    finish(ctx);
  },

  // 1 — December 2019: Town Hall 13 brings a fourth Home Village hero, with 20 levels.
  (ctx, t, dur) => {
    const tTH = when('town', 0, 1.8), tFourth = when('fourth', 0, 3.3), tRC = when('royal', 0, 5.5), t20 = when('20', 0, 6.7);
    const [sx, sy] = shakeAt(t, 0.15, 18, 5);
    ctx.translate(sx, sy);
    ambient(ctx, t, { mid: '#1F6E6A', top: '#08302E', bottom: '#020E0D', rayColor: 'rgba(150,255,240,0.08)', cy: 820 },
            { color: '150,255,235' });
    yearStamp(ctx, t, 0.0, 'DECEMBER', '2019');
    flash(ctx, t, 0.15, { peak: 0.45 });
    const kt = ease.outBack(prog(t, tTH - 0.2, 0.55), 1.2), side = ease.inOutCubic(prog(t, tRC - 0.3, 0.5));
    if (kt > 0) art(ctx, 'th13', lerp(W / 2, 300, side), lerp(1600, 850, kt), lerp(500, 380, side));
    if (kt > 0) withT(ctx, lerp(W / 2, 300, side), 1090, pop(t, tTH, 0.4), 0, () => pill(ctx, 'TOWN HALL 13', 0, 0, 40, ['#5EEAD4', '#0F9488'], C.ink));
    const kg = ease.outBack(prog(t, tRC - 0.1, 0.55), 1.3);
    if (kg > 0) { glow(ctx, 770, 800, 380, '170,220,255', 0.5 * kg); art(ctx, 'champion', lerp(1400, 770, kg), 820 + float(t), 620); }
    burst(ctx, t, tRC - 0.1, 770, 820, { n: 40, speed: 700, color: '170,220,255' });
    withT(ctx, W / 2, 1215, pop(t, tFourth - 0.1, 0.45), 0, () => pill(ctx, 'THE FOURTH HERO', 0, 0, 58, [C.red, '#A51515']));
    withT(ctx, 880, 520, pop(t, t20 - 0.1, 0.4), 0.1, () => {
      chunky(ctx, rectPath(-150, -70, 300, 140, 34), C.purple, C.purpleLo, { lw: 10, y0: -70, y1: 70 });
      title(ctx, 'MAX 20', 0, 4, 74, { fill: [C.white, C.goldHi] });
    });
    finish(ctx);
  },

  // 2 — Spear targets defenses; the Seeking Shield bounces between the four nearest.
  (ctx, t, dur) => {
    const tSpear = when('spear', 0, 0.2), tShield = when('seeking', 0, 2.6), tBounce = when('bounces', 0, 3.4), tFour = when('four', 0, 5.3);
    ambient(ctx, t, { ...STEEL, cy: 820 }, { color: '170,220,255', rise: 110 });
    withT(ctx, W / 2, 185, pop(t, tSpear, 0.4), 0, () => pill(ctx, 'SPEAR: DEFENSES FIRST', 0, 0, 44, [C.red, '#A51515']));
    const kt = t < tShield ? 0 : lerp(2.2, 1, ease.outBack(prog(t, tShield, 0.35), 2));
    if (kt > 0) withT(ctx, W / 2, 320, kt, 0, () => title(ctx, 'SEEKING SHIELD', 0, 0, 118, { fill: ['#E6F8FF', '#7BD3FF', '#2370B8'] }));

    // Four defenses around her; the shield ricochets 1 -> 2 -> 3 -> 4.
    const spots = [[200, 640, 'cannon'], [880, 640, 'air_defense'], [880, 1080, 'cannon'], [200, 1080, 'air_defense']];
    const start = tBounce - 0.3, hop = 0.42;
    spots.forEach(([x, y, name], i) => {
      const hitT = start + (i + 1) * hop;
      const [jx, jy] = t > hitT ? shakeAt(t, hitT, 14, 7) : [0, 0];
      art(ctx, name, x + jx, y + jy, 210 * pop(t, 0.1 + i * 0.08, 0.4));
      if (t > hitT) reticle(ctx, t, hitT, x, y - 10, 105);
      burst(ctx, t, hitT, x, y - 20, { n: 26, speed: 520, life: 0.6, color: '170,220,255', seed: 50 + i });
    });
    art(ctx, 'champion', W / 2, 860 + float(t), 520);
    // The shield's flight path.
    if (t > start && t < start + 4 * hop + 0.4) {
      const path = [[W / 2 + 80, 820], ...spots.map(([x, y]) => [x, y - 20]), [W / 2 + 80, 820]];
      const seg = Math.min(4.99, (t - start) / hop), i = Math.floor(seg), k = ease.inOutCubic(seg - i);
      const [x0, y0] = path[i], [x1, y1] = path[i + 1];
      const x = lerp(x0, x1, k), y = lerp(y0, y1, k) - Math.sin(k * Math.PI) * 60;
      for (let g = 1; g <= 4; g++) {  // motion trail
        ctx.save(); ctx.globalAlpha = 0.18 * (5 - g) / 4;
        art(ctx, 'eq_shield', lerp(x0, x1, Math.max(0, k - g * 0.06)), lerp(y0, y1, Math.max(0, k - g * 0.06)), 120, { shadow: false, rot: t * 12 });
        ctx.restore();
      }
      art(ctx, 'eq_shield', x, y, 130, { shadow: false, rot: t * 12 });
    }
    if (t > tFour) withT(ctx, W / 2, 1215, pop(t, tFour - 0.1, 0.4), 0, () => pill(ctx, 'HITS THE 4 NEAREST DEFENSES', 0, 0, 46, [C.gold, C.goldLo], C.ink));
    finish(ctx);
  },

  // 3 — Dozens of skins, from Party Champion to Dragon Champion.
  (ctx, t, dur) => {
    const tDozens = when('dozens', 0, 1.1), tParty = when('party', 0, 2.8), tDragon = when('dragon', 0, 3.7);
    ambient(ctx, t, { mid: '#6A2FC0', top: '#26104E', bottom: '#0A0418', cy: 760 }, {});
    withT(ctx, W / 2, 230, pop(t, 0, 0.45), 0, () => title(ctx, 'HER SKINS', 0, 0, 140));
    withT(ctx, W / 2, 380, pop(t, tDozens, 0.4), 0.03, () => pill(ctx, 'DOZENS OF THEM', 0, 0, 48, [C.red, '#A51515']));
    const skins = [['skin_party', 195, 680, tParty], ['skin_magic', 540, 660, tDozens + 0.15], ['skin_dragon', 885, 680, tDragon],
                   ['skin_ghost', 195, 1060, tDozens + 0.3], ['skin_primal', 540, 1080, tDozens + 0.45], ['skin_dark_ages', 885, 1060, tDozens + 0.6]];
    skins.forEach(([name, x, y, t0], i) => {
      const k = pop(t, t0, 0.45);
      if (k <= 0) return;
      const big = (name === 'skin_party' && t > tParty && t < tParty + 0.8) || (name === 'skin_dragon' && t > tDragon);
      if (big) glow(ctx, x, y, 240, '255,220,140', 0.6);
      art(ctx, name, x, y + float(t, i, 8, 2), 330 * k * (big ? 1.15 : 1));
      burst(ctx, t, t0, x, y, { n: 18, speed: 420, life: 0.5, seed: 30 + i, size: 7 });
    });
    finish(ctx);
  },

  // 4 — December 2023: the Seeking Shield became Hero Equipment, alongside the Royal Gem.
  (ctx, t, dur) => {
    const tShield = when('seeking', 0, 2.3), tHero = when('hero', 0, 3.6), tGem = when('gem', 0, 5.9);
    const [sx, sy] = shakeAt(t, tHero, 20, 5);
    ctx.translate(sx, sy);
    ambient(ctx, t, { mid: '#1E4A8A', top: '#0E1A44', bottom: '#050818', rayColor: 'rgba(140,190,255,0.08)', cy: 800 },
            { color: '170,210,255' });
    yearStamp(ctx, t, 0.0, 'DECEMBER', '2023', 280);
    withT(ctx, W / 2, 520, pop(t, tHero - 0.1, 0.45), 0, () => title(ctx, 'HERO EQUIPMENT', 0, 0, 104));
    const away = ease.inCubic(prog(t, tHero - 0.2, 0.5));
    if (away < 1) art(ctx, 'champion_b', W / 2, 900 + float(t), 560 * (1 - away), { alpha: 1 - away });
    burst(ctx, t, tHero - 0.1, W / 2, 900, { n: 50, speed: 900, color: '170,220,255' });
    const items = [['eq_shield', 'SEEKING SHIELD', 300, 800, tShield, ['#7BD3FF', '#2370B8']],
                   ['eq_gem', 'ROYAL GEM', 780, 800, tGem, [C.gold, C.goldLo]],
                   ['eq_haste', 'HASTE VIAL', 300, 1110, tHero + 0.5, ['#FF8FC8', '#C23C82']],
                   ['eq_hog_doll', 'HOG RIDER PUPPET', 780, 1110, tHero + 0.7, [C.orange, '#B85A0B']]];
    items.forEach(([name, label, x, y, t0, col], i) => {
      const k = pop(t, t0, 0.45);
      if (k <= 0) return;
      const hl = (i < 2 && t > t0 && t < t0 + 0.9) ? 1.08 : 1;
      withT(ctx, x, y + float(t, i, 6, 2.2), k * hl, (i % 2 ? 1 : -1) * 0.03, () => {
        chunky(ctx, rectPath(-200, -150, 400, 300, 34), col[0], col[1], { lw: 12, y0: -150, y1: 150 });
        art(ctx, name, 0, -22, 190, { shadow: false });
        title(ctx, label, 0, 112, 32, { fill: C.white, lw: 8 });
      });
    });
    finish(ctx);
  },

  // 5 — Level cap: 50 (TH17), 60 (TH19).
  (ctx, t, dur) => {
    const t50 = when('50', 0, 2.2), t60 = when('60', 0, 4.9);
    const [sx, sy] = shakeAt(t, t60 + 0.25, 26, 4);
    ctx.translate(sx, sy);
    ambient(ctx, t, { ...STEEL, cy: 900 }, { color: '170,220,255', rise: 90 });
    withT(ctx, W / 2, 210, pop(t, 0, 0.45), 0, () => title(ctx, 'LEVEL CAP', 0, 0, 140));
    const bars = [['2019', 20, -1], ['TH17', 50, t50], ['TH19', 60, t60]];
    const base = 1180, maxH = 720, bw = 200;
    bars.forEach(([label, lvl, t0], i) => {
      const g = t0 < 0 ? ease.outCubic(prog(t, 0.2, 0.6)) : ease.outBack(prog(t, t0 - 0.1, 0.55), 1.2);
      if (g <= 0) return;
      const x = 330 + i * 270, h = maxH * (lvl / 60) * g;
      const top = i === 2 ? [C.goldHi, C.orange] : i === 0 ? ['#B9AFC9', '#6C6280'] : ['#7BD3FF', '#2370B8'];
      if (i === 2 && t > t60) glow(ctx, x, base - h, 260, '255,220,120', 0.7);
      chunky(ctx, rectPath(x - bw / 2, base - h, bw, h, 20), top[0], top[1], { lw: 10, y0: base - h, y1: base });
      title(ctx, `${Math.round(lvl * Math.min(1, g))}`, x, base - h - 55, 74, { fill: [C.white, C.goldHi] });
      title(ctx, label, x, base + 45, 42, { fill: C.white, lw: 8 });
    });
    const kk = ease.outBack(prog(t, 0.3, 0.6), 1.3);
    if (kk > 0) art(ctx, 'champion', 160, 650 + float(t), 330 * kk);
    ring(ctx, t, t60 + 0.25, 870, 460, { maxR: 650 });
    burst(ctx, t, t60 + 0.25, 870, 460, { n: 60, speed: 1100 });
    flash(ctx, t, t60 + 0.25, { peak: 0.5, color: '220,240,255' });
    finish(ctx);
  },

  // 6 — The Titan skin.
  (ctx, t, dur) => {
    const tTitan = when('titan', 0, 1.8);
    const [sx, sy] = shakeAt(t, tTitan, 24, 4);
    ctx.translate(sx, sy);
    ambient(ctx, t, { mid: '#9A4A22', top: '#3E1A08', bottom: '#140702', rayColor: 'rgba(255,200,160,0.15)', cy: 780 },
            { color: '255,200,150', rise: 120, n: 110 });
    withT(ctx, W / 2, 190, pop(t, 0, 0.4), 0, () => pill(ctx, 'THIS SEASON', 0, 0, 46, [C.white, '#D8D8D8'], C.ink));
    const kk = ease.outBack(prog(t, 0.2, 0.7), 1.2);
    glow(ctx, W / 2, 800, 600, '255,200,150', 0.6 * kk);
    if (kk > 0) art(ctx, 'titan_champion', W / 2, lerp(1700, 820, kk) + float(t), 820);
    const kt = t < tTitan ? 0 : lerp(2.4, 1, ease.outBack(prog(t, tTitan, 0.35), 2));
    if (kt > 0) withT(ctx, W / 2, 330, kt, 0, () => title(ctx, 'TITAN CHAMPION', 0, 0, 108, { fill: [C.white, C.goldHi, C.gold] }));
    ring(ctx, t, tTitan, W / 2, 800, { maxR: 800 });
    burst(ctx, t, tTitan, W / 2, 800, { n: 80, speed: 1300 });
    flash(ctx, t, tTitan, { peak: 0.7, color: '255,235,210' });
    withT(ctx, W / 2, 1215, pop(t, tTitan + 0.3, 0.4), 0, () => pill(ctx, 'NEW SKIN', 0, 0, 58, [C.red, '#A51515']));
    finish(ctx);
  },

  // 7 — Outro: King, Queen, Warden or Champion?
  (ctx, t, dur) => {
    const tK = when('king', 0, 1.6), tQ = when('queen', 0, 2.2), tW = when('warden', 0, 2.9), tC = when('champion', 0, 3.6);
    const tComments = when('comments', 0, 5.2);
    ambient(ctx, t, { mid: '#7A2340', top: '#2E0A18', bottom: '#0E0308', rayColor: 'rgba(255,190,140,0.10)' }, {});
    withT(ctx, W / 2, 230, pop(t, 0.0, 0.45), 0, () => title(ctx, 'WHO IS THE BEST?', 0, 0, 104));
    const heroes = [['king', 175, 590, tK, '255,180,90', 'KING'], ['queen', 905, 590, tQ, '200,150,255', 'QUEEN'],
                    ['warden', 175, 920, tW, '255,230,150', 'WARDEN'], ['champion', 905, 920, tC, '170,220,255', 'CHAMPION']];
    heroes.forEach(([name, x, y, t0, col, label], i) => {
      const k = ease.outBack(prog(t, t0 - 0.3, 0.5), 1.3);
      if (k <= 0) return;
      const focus = t > t0 && t < t0 + 0.55 ? 1.1 : 1;
      glow(ctx, x, y, 230, col, 0.45 * k);
      art(ctx, name, lerp(x < W / 2 ? -300 : 1400, x, k), y + float(t, i), 290 * focus, { flip: name === 'queen' });
      withT(ctx, x, y + 175, pop(t, t0, 0.35), 0, () => pill(ctx, label, 0, 0, 36, [C.gold, C.goldLo], C.ink));
      burst(ctx, t, t0, x, y, { n: 20, speed: 450, seed: 40 + i });
    });
    const kv = pop(t, tC + 0.2, 0.4);
    if (kv > 0) withT(ctx, W / 2, 760, kv, -0.08, () => { glow(ctx, 0, 0, 170, '255,220,120', 0.6); title(ctx, '?', 0, 0, 220, { fill: [C.white, C.goldHi, C.gold] }); });
    withT(ctx, W / 2, 1215, pop(t, tComments - 0.2, 0.45), 0, () => pill(ctx, 'TELL ME IN THE COMMENTS', 0, 0, 50, [C.red, '#A51515']));
    finish(ctx);
  },
];
</script>
</body>
</html>
