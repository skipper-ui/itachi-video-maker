<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dragon Duke evolution motion scenes</title>
<script>
// Official Supercell Fan Kit art (tools/fankit.py fetch projects/dd-evolution/fankit.json).
// Drawn scaled, moved and faded only, never altered, per the Fan Content Policy.
window.ART = Object.fromEntries([
  'duke_a', 'duke_b', 'duke_c', 'duke_d', 'duke_e', 'th15', 'eq_fire_heart', 'eq_flame_blower', 'eq_stun_blast', 'eq_rocket',
  'skin_sound', 'skin_skeleton', 'skin_myth', 'skin_drakan', 'skin_wwe', 'skin_cosmic', 'titan_duke', 'air_defense', 'cannon',
  'king', 'queen', 'warden', 'champion', 'prince',
].map(n => [n, `fankit/${n}.png`]));
</script>
<script src="../../../motion/lib.js"></script>
</head>
<body>
<script>
// Captions are burned in around y = 1300-1420, so keep that band calm.
const EMBER = { mid: '#A0281E', top: '#3E0A08', bottom: '#120202', rayColor: 'rgba(255,170,120,0.11)' };
const float = (t, k = 0, amp = 10, speed = 1.6) => Math.sin(t * speed + k) * amp;
const finish = ctx => vignette(ctx, 0.62);
function ambient(ctx, t, bg = {}, sp = {}) { background(ctx, t, bg); sparks(ctx, t, sp); }
const FIRE = { color: '255,150,70', rise: 140, n: 100, size: 6 };

function yearStamp(ctx, t, t0, label, year, y = 290) {
  const k = t < t0 ? 0 : lerp(2.4, 1, ease.outBack(prog(t, t0, 0.35), 2));
  if (k <= 0) return;
  withT(ctx, W / 2, y, k, -0.03, () => {
    if (label) pill(ctx, label, 0, -125, 44, [C.gold, C.goldLo], C.ink);
    title(ctx, year, 0, 0, 190, { fill: [C.white, C.goldHi, C.gold] });
  });
}

// A claw swipe: three curved slashes across (x, y) at t0.
function swipe(ctx, t, t0, x, y, dir = 1) {
  const k = prog(t, t0, 0.35);
  if (k <= 0 || k >= 1) return;
  ctx.save();
  ctx.strokeStyle = `rgba(255,230,200,${1 - k})`; ctx.lineCap = 'round';
  for (let i = -1; i <= 1; i++) {
    ctx.lineWidth = 18 - Math.abs(i) * 5;
    ctx.beginPath();
    ctx.arc(x - dir * 60, y + i * 45, 160, -0.9 + k * 0.6, -0.9 + k * 0.6 + ease.outCubic(k) * 1.6);
    ctx.stroke();
  }
  ctx.restore();
}

window.scenes = [
  // 0 — Hook: a dragon in armor, not even a year old; the newest hero.
  (ctx, t, dur) => {
    const tYear = when('year', 0, 2.3), tNew = when('newest', 0, 4.0), tDD = when('dragon', 1, 5.7);
    const [sx, sy] = shakeAt(t, tDD, 22, 4);
    ctx.translate(sx, sy);
    ambient(ctx, t, { ...EMBER, cy: 760 }, FIRE);
    const k = ease.outCubic(prog(t, 0.0, 1.1));
    const x = lerp(1400, W / 2, k), y = lerp(560, 840, k) + float(t, 0, 16, 2.2);
    glow(ctx, x, y, 520, '255,140,70', 0.55 * k);
    art(ctx, 'duke_a', x, y, 650, { shadow: false });
    withT(ctx, W / 2, 175, pop(t, 0.6, 0.4), 0, () => pill(ctx, 'A DRAGON IN ARMOR', 0, 0, 46, [C.gold, C.goldLo], C.ink));
    // Above his head, clear of his face.
    withT(ctx, W / 2, 430, pop(t, tYear - 0.1, 0.4), -0.03, () => pill(ctx, 'NOT EVEN 1 YEAR OLD', 0, 0, 44, [C.red, '#A51515']));
    withT(ctx, W / 2, 1215, pop(t, tNew - 0.1, 0.4), 0, () => pill(ctx, 'THE NEWEST HERO', 0, 0, 56, [C.gold, C.goldLo], C.ink));
    const kt = t < tDD ? 0 : lerp(2.4, 1, ease.outBack(prog(t, tDD, 0.35), 2));
    if (kt > 0) withT(ctx, W / 2, 300, kt, 0, () => title(ctx, 'DRAGON DUKE', 0, 0, 126, { fill: ['#FFE3C8', '#FF8A3D', '#C2281E'] }));
    ring(ctx, t, tDD, W / 2, 840, { maxR: 700, color: '255,180,120' });
    burst(ctx, t, tDD, W / 2, 840, { n: 60, speed: 1100, color: '255,150,70' });
    flash(ctx, t, tDD, { peak: 0.5, color: '255,220,190' });
    finish(ctx);
  },

  // 1 — March 2026: the sixth hero, unlocking at Town Hall 15.
  (ctx, t, dur) => {
    const tDD = when('dragon', 0, 2.3), tSixth = when('sixth', 0, 3.8), tTH = when('town', 0, 5.5);
    const [sx, sy] = shakeAt(t, 0.15, 18, 5);
    ctx.translate(sx, sy);
    ambient(ctx, t, { mid: '#6A2FC0', top: '#26104E', bottom: '#0A0418', rayColor: 'rgba(255,190,150,0.09)', cy: 820 }, FIRE);
    yearStamp(ctx, t, 0.0, 'MARCH', '2026');
    flash(ctx, t, 0.15, { peak: 0.45 });
    const kd = ease.outBack(prog(t, tDD - 0.2, 0.55), 1.2), side = ease.inOutCubic(prog(t, tTH - 0.4, 0.5));
    if (kd > 0) art(ctx, 'duke_c', lerp(W / 2, 760, side), lerp(1600, 800, kd) + float(t, 0, 14, 2.2), lerp(640, 560, side), { shadow: false });
    withT(ctx, W / 2, 1215, pop(t, tSixth - 0.1, 0.45), 0, () => pill(ctx, 'THE SIXTH HERO', 0, 0, 58, [C.red, '#A51515']));
    const kt = ease.outBack(prog(t, tTH - 0.3, 0.55), 1.2);
    if (kt > 0) {
      art(ctx, 'th15', lerp(-300, 290, kt), 850, 400);
      withT(ctx, 290, 1090, pop(t, tTH, 0.4), 0, () => pill(ctx, 'UNLOCKS AT TH15', 0, 0, 40, [C.gold, C.goldLo], C.ink));
    }
    burst(ctx, t, tTH - 0.3, 290, 850, { n: 30, speed: 600 });
    finish(ctx);
  },

  // 2 — Flying melee tank that smashes every target within reach.
  (ctx, t, dur) => {
    const tFly = when('flying', 0, 0.4), tMelee = when('melee', 0, 0.9), tTank = when('tank', 0, 1.3), tSmash = when('smashes', 0, 1.7);
    const hit1 = tSmash + 0.1, hit2 = tSmash + 0.55;
    const [sx, sy] = t > hit2 ? shakeAt(t, hit2, 22, 6) : shakeAt(t, hit1, 22, 6);
    ctx.translate(sx, sy);
    ambient(ctx, t, { ...EMBER, cy: 800 }, FIRE);
    [['FLYING', tFly], ['MELEE', tMelee], ['TANK', tTank]].forEach(([label, t0], i) => {
      withT(ctx, 230 + i * 310, 230, pop(t, t0 - 0.1, 0.4), (i - 1) * 0.05, () => pill(ctx, label, 0, 0, 58, i === 2 ? [C.red, '#A51515'] : [C.gold, C.goldLo], i === 2 ? C.white : C.ink));
    });
    const defs = [[200, 1010, 'cannon', hit1, -1], [880, 1010, 'air_defense', hit2, 1]];
    defs.forEach(([x, y, name, th, dir], i) => {
      const [jx, jy] = t > th ? shakeAt(t, th, 16, 7) : [0, 0];
      art(ctx, name, x + jx, y + jy, 250);
      swipe(ctx, t, th - 0.05, x, y - 60, dir);
      burst(ctx, t, th, x, y - 40, { n: 40, speed: 700, color: '255,170,90', seed: 80 + i });
      ring(ctx, t, th, x, y - 40, { maxR: 260, life: 0.5, color: '255,200,150', width: 14 });
    });
    // The Duke lunges left, then right.
    const lean = t < hit1 - 0.15 ? 0 : t < hit2 - 0.15 ? -1 : 1;
    const lx = W / 2 + lean * 140 * Math.exp(-Math.max(0, t - (lean < 0 ? hit1 : hit2)) * 2);
    glow(ctx, lx, 720, 440, '255,140,70', 0.45);
    art(ctx, 'duke_d', lx, 720 + float(t, 0, 12, 2.4), 620, { shadow: false, flip: lean > 0 });
    withT(ctx, W / 2, 1215, pop(t, tSmash + 0.8, 0.4), 0, () => pill(ctx, 'SMASHES EVERYTHING IN REACH', 0, 0, 44, [C.red, '#A51515']));
    finish(ctx);
  },

  // 3 — Three launch equipment; the Rocket Backpack became his first Epic in April.
  (ctx, t, dur) => {
    const tHero = when('hero', 0, 1.2), tFire = when('fire', 0, 2.9), tFlame = when('flame', 0, 4.0), tStun = when('stun', 0, 5.4);
    const tApril = when('april', 0, 7.1), tRocket = when('rocket', 0, 8.0), tEpic = when('epic', 0, 9.8);
    const [sx, sy] = shakeAt(t, tRocket + 0.2, 22, 5);
    ctx.translate(sx, sy);
    ambient(ctx, t, { mid: '#1E4A8A', top: '#0E1A44', bottom: '#050818', rayColor: 'rgba(140,190,255,0.08)', cy: 800 },
            { color: '170,210,255' });
    withT(ctx, W / 2, 220, pop(t, tHero - 0.1, 0.45), 0, () => title(ctx, 'HERO EQUIPMENT', 0, 0, 104));
    const up = ease.inOutCubic(prog(t, tApril - 0.3, 0.5));
    const commons = [['eq_fire_heart', 'FIRE HEART', tFire, ['#FF8A8A', '#B81E1E']], ['eq_flame_blower', 'FLAME BLOWER', tFlame, [C.orange, '#B85A0B']],
                     ['eq_stun_blast', 'STUN BLAST', tStun, ['#7BD3FF', '#2370B8']]];
    commons.forEach(([name, label, t0, col], i) => {
      const k = pop(t, t0 - 0.1, 0.45);
      if (k <= 0) return;
      const x = 190 + i * 350, y = lerp(700, 430, up), s = k * lerp(1, 0.62, up);
      withT(ctx, x, y + float(t, i, 6, 2.2), s * (t > t0 && t < t0 + 0.8 ? 1.06 : 1), (i - 1) * 0.04, () => {
        chunky(ctx, rectPath(-160, -200, 320, 400, 32), col[0], col[1], { lw: 12, y0: -200, y1: 200 });
        art(ctx, name, 0, -30, 210, { shadow: false });
        title(ctx, label, 0, 150, 34, { fill: C.white, lw: 8 });
      });
    });
    if (t > tApril - 0.2) withT(ctx, W / 2, 700, pop(t, tApril - 0.2, 0.4), -0.04, () => pill(ctx, 'APRIL 2026', 0, 0, 48, [C.gold, C.goldLo], C.ink));
    // The Rocket Backpack blasts up from below.
    const kr = ease.outBack(prog(t, tRocket - 0.2, 0.6), 1.3);
    if (kr > 0) {
      const y = lerp(1800, 960, kr);
      for (let i = 0; i < 2; i++) burst(ctx, t, tRocket - 0.2 + i * 0.12, W / 2 + (i ? 40 : -40), y + 150, { n: 30, speed: 600, life: 0.7, color: '255,190,90', seed: 90 + i });
      withT(ctx, W / 2, y + float(t, 0, 8, 2.4), 1, 0, () => {
        glow(ctx, 0, 0, 300, '255,120,220', 0.55);
        chunky(ctx, rectPath(-230, -210, 460, 420, 40), C.purpleHi, C.purple, { lw: 14, y0: -210, y1: 210 });
        art(ctx, 'eq_rocket', 0, -30, 250, { shadow: false });
        title(ctx, 'ROCKET BACKPACK', 0, 160, 40, { fill: C.white, lw: 9 });
      });
    }
    if (t > tEpic - 0.2) withT(ctx, 860, 790, pop(t, tEpic - 0.2, 0.4), 0.15, () => pill(ctx, 'FIRST EPIC!', 0, 0, 46, [C.red, '#A51515']));
    burst(ctx, t, tEpic - 0.2, 860, 790, { n: 40, speed: 700, color: '255,120,220' });
    finish(ctx);
  },

  // 4 — A new skin nearly every month.
  (ctx, t, dur) => {
    const tMonth = when('month', 0, 2.2);
    ambient(ctx, t, { mid: '#6A2FC0', top: '#26104E', bottom: '#0A0418', cy: 760 }, FIRE);
    withT(ctx, W / 2, 230, pop(t, 0, 0.4), 0, () => title(ctx, 'HIS SKINS', 0, 0, 140));
    withT(ctx, W / 2, 380, pop(t, tMonth - 0.2, 0.4), 0.03, () => pill(ctx, 'NEARLY ONE A MONTH', 0, 0, 48, [C.red, '#A51515']));
    const skins = [['skin_sound', 195, 680], ['skin_myth', 540, 660], ['skin_drakan', 885, 680],
                   ['skin_cosmic', 195, 1060], ['skin_wwe', 540, 1080], ['skin_skeleton', 885, 1060]];
    skins.forEach(([name, x, y], i) => {
      const t0 = 0.15 + i * 0.22, k = pop(t, t0, 0.4);
      if (k <= 0) return;
      // Wide winged skins are sized by width so neighbours don't overlap.
      const hgt = Math.min(330, 330 * 320 / artWidth(name, 330));
      art(ctx, name, x, y + float(t, i, 8, 2), hgt * k, { shadow: false });
      burst(ctx, t, t0, x, y, { n: 18, speed: 420, life: 0.5, seed: 30 + i, size: 7 });
    });
    finish(ctx);
  },

  // 5 — Max 25 before Town Hall 19; now level 30.
  (ctx, t, dur) => {
    const t25 = when('25', 0, 2.4), t30 = when('30', 0, 4.8);
    const [sx, sy] = shakeAt(t, t30 + 0.25, 26, 4);
    ctx.translate(sx, sy);
    ambient(ctx, t, { ...EMBER, cy: 900 }, FIRE);
    withT(ctx, W / 2, 210, pop(t, 0, 0.45), 0, () => title(ctx, 'LEVEL CAP', 0, 0, 140));
    const bars = [['BEFORE TH19', 25, t25], ['TH19', 30, t30]];
    const base = 1180, maxH = 700, bw = 230;
    bars.forEach(([label, lvl, t0], i) => {
      const g = ease.outBack(prog(t, t0 - 0.2, 0.55), 1.2);
      if (g <= 0) return;
      const x = 480 + i * 330, h = maxH * (lvl / 30) * g;
      const top = i === 1 ? [C.goldHi, C.orange] : ['#FF8A8A', '#B81E1E'];
      if (i === 1 && t > t30) glow(ctx, x, base - h, 260, '255,220,120', 0.7);
      chunky(ctx, rectPath(x - bw / 2, base - h, bw, h, 22), top[0], top[1], { lw: 10, y0: base - h, y1: base });
      title(ctx, `${Math.round(lvl * Math.min(1, g))}`, x, base - h - 60, 84, { fill: [C.white, C.goldHi] });
      title(ctx, label, x, base + 45, 38, { fill: C.white, lw: 8 });
    });
    const kk = ease.outBack(prog(t, 0.3, 0.6), 1.3);
    if (kk > 0) art(ctx, 'duke_e', 170, 700 + float(t, 0, 12, 2.4), 340 * kk, { shadow: false });
    ring(ctx, t, t30 + 0.25, 810, 420, { maxR: 650 });
    burst(ctx, t, t30 + 0.25, 810, 420, { n: 60, speed: 1100 });
    flash(ctx, t, t30 + 0.25, { peak: 0.5, color: '255,230,200' });
    finish(ctx);
  },

  // 6 — The Titan skin.
  (ctx, t, dur) => {
    const tTitan = when('titan', 0, 1.6);
    const [sx, sy] = shakeAt(t, tTitan, 24, 4);
    ctx.translate(sx, sy);
    ambient(ctx, t, { mid: '#9A3A22', top: '#3E1208', bottom: '#140502', rayColor: 'rgba(255,190,150,0.15)', cy: 780 },
            { color: '255,190,140', rise: 120, n: 110 });
    withT(ctx, W / 2, 190, pop(t, 0, 0.4), 0, () => pill(ctx, 'THIS SEASON', 0, 0, 46, [C.white, '#D8D8D8'], C.ink));
    const kk = ease.outBack(prog(t, 0.2, 0.7), 1.2);
    glow(ctx, W / 2, 800, 600, '255,170,120', 0.6 * kk);
    if (kk > 0) art(ctx, 'titan_duke', W / 2, lerp(1700, 820, kk) + float(t), 820);
    const kt = t < tTitan ? 0 : lerp(2.4, 1, ease.outBack(prog(t, tTitan, 0.35), 2));
    if (kt > 0) withT(ctx, W / 2, 330, kt, 0, () => title(ctx, 'TITAN DUKE', 0, 0, 150, { fill: [C.white, C.goldHi, C.gold] }));
    ring(ctx, t, tTitan, W / 2, 800, { maxR: 800 });
    burst(ctx, t, tTitan, W / 2, 800, { n: 80, speed: 1300, color: '255,170,100' });
    flash(ctx, t, tTitan, { peak: 0.7, color: '255,235,210' });
    withT(ctx, W / 2, 1215, pop(t, tTitan + 0.3, 0.4), 0, () => pill(ctx, 'NEW SKIN', 0, 0, 58, [C.red, '#A51515']));
    finish(ctx);
  },

  // 7 — Finale: all six heroes; which one is your favorite?
  (ctx, t, dur) => {
    const tSix = when('six', 0, 0.5), tFav = when('favorite', 0, 3.0), tComments = when('comments', 0, 4.5);
    ambient(ctx, t, { mid: '#7A2340', top: '#2E0A18', bottom: '#0E0308', rayColor: 'rgba(255,190,140,0.10)' }, { color: '255,210,150' });
    withT(ctx, W / 2, 210, pop(t, tSix - 0.3, 0.45), 0, () => title(ctx, 'ALL 6 HEROES', 0, 0, 120));
    const heroes = [['king', 185, 580], ['queen', 540, 580], ['warden', 895, 580],
                    ['champion', 185, 930], ['prince', 540, 930], ['duke_b', 895, 930]];
    const names = ['KING', 'QUEEN', 'WARDEN', 'CHAMPION', 'PRINCE', 'DUKE'];
    heroes.forEach(([name, x, y], i) => {
      const t0 = tSix - 0.2 + i * 0.16, k = ease.outBack(prog(t, t0, 0.45), 1.4);
      if (k <= 0) return;
      const hl = t > tFav && Math.floor((t - tFav) * 5) % 6 === i;
      if (hl) glow(ctx, x, y, 230, '255,220,120', 0.7);
      art(ctx, name, x, y + float(t, i, 8, 2.2), 290 * k * (hl ? 1.1 : 1), { shadow: false, flip: name === 'queen' });
      withT(ctx, x, y + 170, k, 0, () => pill(ctx, names[i], 0, 0, 34, [C.gold, C.goldLo], C.ink));
      burst(ctx, t, t0, x, y, { n: 18, speed: 420, life: 0.5, seed: 40 + i, size: 7 });
    });
    withT(ctx, W / 2, 1215, pop(t, tComments - 0.2, 0.45), 0, () => pill(ctx, 'TELL ME IN THE COMMENTS', 0, 0, 50, [C.red, '#A51515']));
    finish(ctx);
  },
];
</script>
</body>
</html>
