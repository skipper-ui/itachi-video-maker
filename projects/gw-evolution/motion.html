<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Grand Warden evolution motion scenes</title>
<script>
// Official Supercell Fan Kit art (tools/fankit.py fetch projects/gw-evolution/fankit.json).
// Drawn scaled, moved and faded only, never altered, per the Fan Content Policy.
window.ART = Object.fromEntries([
  'warden', 'th11', 'skin_party', 'skin_gladiator', 'skin_primal', 'skin_ghost', 'skin_pirate', 'skin_dragon',
  'skin_clockwork', 'eq_tome', 'eq_life_gem', 'eq_healing_tome', 'eq_rage_gem', 'titan_warden', 'king', 'queen',
  'barbarian', 'archer',
].map(n => [n, `fankit/${n}.png`]));
</script>
<script src="../../motion/lib.js"></script>
</head>
<body>
<script>
// Captions are burned in around y = 1300-1420, so keep that band calm.
const ARCANE = { mid: '#7A3FB8', top: '#2C1050', bottom: '#0C0418', rayColor: 'rgba(255,220,150,0.10)' };
const float = (t, k = 0, amp = 10, speed = 1.6) => Math.sin(t * speed + k) * amp;
const finish = ctx => vignette(ctx, 0.62);
function ambient(ctx, t, bg = {}, sp = {}) { background(ctx, t, bg); sparks(ctx, t, sp); }

function yearStamp(ctx, t, t0, label, year, y = 290) {
  const k = t < t0 ? 0 : lerp(2.4, 1, ease.outBack(prog(t, t0, 0.35), 2));
  if (k <= 0) return;
  withT(ctx, W / 2, y, k, -0.03, () => {
    if (label) pill(ctx, label, 0, -125, 44, [C.gold, C.goldLo], C.ink);
    title(ctx, year, 0, 0, 190, { fill: [C.white, C.goldHi, C.gold] });
  });
}

function levelBadge(ctx, x, y, s, lvl, rot = 0.06) {
  withT(ctx, x, y, s, rot, () => {
    chunky(ctx, rectPath(-175, -82, 350, 164, 40), C.purple, C.purpleLo, { lw: 12, y0: -82, y1: 82 });
    title(ctx, `LV ${lvl}`, 0, 4, 98, { fill: [C.white, C.goldHi, C.gold] });
  });
}

// Art with a solid background, shown as a framed card.
function framedArt(ctx, name, x, y, size, s = 1, rot = 0) {
  withT(ctx, x, y, s, rot, () => {
    const frame = rectPath(-size / 2, -size / 2, size, size, size * 0.08);
    ctx.save(); ctx.clip(frame); ctx.fillStyle = '#fff'; ctx.fill(frame); art(ctx, name, 0, 0, size * 0.92, { shadow: false }); ctx.restore();
    ctx.lineWidth = 14; ctx.strokeStyle = C.ink; ctx.stroke(frame);
    ctx.lineWidth = 7; ctx.strokeStyle = C.gold; ctx.stroke(frame);
  });
}

// Elixir drop (pink) or Dark Elixir drop (black/purple), drawn centred on 0,0.
function drop(ctx, dark) {
  const p = new Path2D();
  p.moveTo(0, -150);
  p.bezierCurveTo(40, -80, 110, -20, 110, 50);
  p.bezierCurveTo(110, 120, 60, 160, 0, 160);
  p.bezierCurveTo(-60, 160, -110, 120, -110, 50);
  p.bezierCurveTo(-110, -20, -40, -80, 0, -150);
  chunky(ctx, p, dark ? '#5A4A78' : '#FF9AF0', dark ? '#12081E' : '#B0259C', { lw: 12, y0: -150, y1: 160 });
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(-45, 20, 18, 40, -0.3, 0, Math.PI * 2); ctx.fill();
}

window.scenes = [
  // 0 — Hook: ground and air; almost eleven years; level 20 to 90.
  (ctx, t, dur) => {
    const tAir = when('air', 0, 1.5), t11 = when('eleven', 0, 4.0), tGW = when('grand', 0, 5.9), t20 = when('20', 0, 7.3), t90 = when('90', 0, 8.4);
    const [sx, sy] = shakeAt(t, t90 + 0.3, 26, 4);
    ctx.translate(sx, sy);
    ambient(ctx, t, { ...ARCANE, cy: 760 }, { color: '255,220,150', rise: 90 });

    const kk = ease.outBack(prog(t, 0.0, 0.7), 1.2);
    const lift = ease.inOutCubic(prog(t, tAir - 0.3, 0.8));   // ground -> air
    glow(ctx, W / 2, 800 - lift * 120, 560, '255,220,150', (0.4 + 0.25 * lift) * kk);
    if (lift > 0) for (let i = 0; i < 2; i++) ring(ctx, t, tAir + i * 0.25, W / 2, 1100, { maxR: 380, life: 0.9, color: '255,230,170', width: 10 });
    if (kk > 0) art(ctx, 'warden', W / 2 + lerp(-500, 0, kk), 830 - lift * 130 + float(t, 0, 10 + lift * 12), 760, { shadow: lift < 0.3 });
    withT(ctx, W / 2, 175, pop(t, tAir - 0.2, 0.4), 0, () => pill(ctx, 'GROUND  +  AIR', 0, 0, 46, [C.gold, C.goldLo], C.ink));
    withT(ctx, W / 2, 1215, pop(t, t11 - 0.1, 0.4), 0, () => pill(ctx, '11 YEARS OF PROTECTING', 0, 0, 52, [C.red, '#A51515']));
    withT(ctx, W / 2, 300, pop(t, tGW - 0.2, 0.45), 0, () => title(ctx, 'GRAND WARDEN', 0, 0, 112));
    if (t > t20 - 0.15) {
      const lvl = Math.round(lerp(20, 90, ease.outCubic(prog(t, t90 - 0.1, 0.4))));
      const s = pop(t, t20 - 0.15, 0.4) * (t > t90 + 0.3 ? lerp(1.4, 1, ease.outBack(prog(t, t90 + 0.3, 0.35))) : 1);
      levelBadge(ctx, 830, 520, s, lvl);
    }
    ring(ctx, t, t90 + 0.3, 830, 520, { maxR: 700 });
    burst(ctx, t, t90 + 0.3, 830, 520, { n: 60, speed: 1100 });
    flash(ctx, t, t90 + 0.3, { peak: 0.55, color: '255,240,200' });
    finish(ctx);
  },

  // 1 — December 2015: Town Hall 11 brings a third hero, with 20 levels.
  (ctx, t, dur) => {
    const tTH = when('town', 0, 2.2), tThird = when('third', 0, 3.4), tGW = when('grand', 0, 4.4), t20 = when('20', 0, 5.5);
    const [sx, sy] = shakeAt(t, 0.15, 18, 5);
    ctx.translate(sx, sy);
    ambient(ctx, t, { mid: '#2E5A9E', top: '#0E2048', bottom: '#040A18', rayColor: 'rgba(170,210,255,0.08)', cy: 820 },
            { color: '190,220,255' });
    yearStamp(ctx, t, 0.0, 'DECEMBER', '2015');
    flash(ctx, t, 0.15, { peak: 0.45 });
    const kt = ease.outBack(prog(t, tTH - 0.2, 0.55), 1.2), side = ease.inOutCubic(prog(t, tGW - 0.3, 0.5));
    if (kt > 0) art(ctx, 'th11', lerp(W / 2, 300, side), lerp(1600, 850, kt), lerp(520, 400, side));
    if (kt > 0) withT(ctx, lerp(W / 2, 300, side), 1090, pop(t, tTH, 0.4) * (1 - side * 0.2), 0, () => pill(ctx, 'TOWN HALL 11', 0, 0, 40, ['#C8CFDD', C.stoneLo], C.ink));
    const kg = ease.outBack(prog(t, tGW - 0.1, 0.55), 1.3);
    if (kg > 0) { glow(ctx, 760, 800, 380, '255,220,150', 0.5 * kg); art(ctx, 'warden', lerp(1400, 760, kg), 820 + float(t), 620); }
    burst(ctx, t, tGW - 0.1, 760, 820, { n: 40, speed: 700 });
    withT(ctx, W / 2, 1215, pop(t, tThird - 0.1, 0.45), 0, () => pill(ctx, 'THE THIRD HERO', 0, 0, 58, [C.red, '#A51515']));
    withT(ctx, 880, 520, pop(t, t20 - 0.1, 0.4), 0.1, () => {
      chunky(ctx, rectPath(-150, -70, 300, 140, 34), C.purple, C.purpleLo, { lw: 10, y0: -70, y1: 70 });
      title(ctx, 'MAX 20', 0, 4, 74, { fill: [C.white, C.goldHi] });
    });
    finish(ctx);
  },

  // 2 — Life Aura (more health for nearby troops) and Eternal Tome (immune to damage).
  (ctx, t, dur) => {
    const tLife = when('life', 0, 0.3), tHealth = when('health', 0, 1.4), tTome = when('eternal', 0, 3.1), tImmune = when('immune', 0, 4.6);
    const [sx, sy] = shakeAt(t, tTome + 0.1, 20, 5);
    ctx.translate(sx, sy);
    ambient(ctx, t, { ...ARCANE, cy: 820 }, { color: '255,220,150', rise: 110 });
    withT(ctx, W / 2, 185, pop(t, 0, 0.4), 0, () => pill(ctx, 'HIS ABILITIES', 0, 0, 44, [C.gold, C.goldLo], C.ink));
    const toTome = t > tTome;
    const kt = t < (toTome ? tTome : tLife) ? 0 : lerp(2.2, 1, ease.outBack(prog(t, toTome ? tTome : tLife, 0.35), 2));
    if (kt > 0) withT(ctx, W / 2, 320, kt, 0, () => title(ctx, toTome ? 'ETERNAL TOME' : 'LIFE AURA', 0, 0, 130,
      { fill: toTome ? [C.white, C.goldHi, C.gold] : ['#FFF3C4', '#FFC83D', '#E08A00'] }));

    // Aura ring around the Warden and his troops.
    const aura = prog(t, tLife, 0.6);
    if (aura > 0) {
      ctx.save();
      ctx.strokeStyle = `rgba(255,215,120,${0.55 * aura})`; ctx.lineWidth = 14; ctx.setLineDash([30, 22]); ctx.lineDashOffset = -t * 60;
      ctx.beginPath(); ctx.ellipse(W / 2, 1020, 430 * aura, 150 * aura, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      glow(ctx, W / 2, 900, 520, '255,210,110', 0.3 * aura);
    }
    const troops = [['barbarian', 230, 1000, false], ['archer', 850, 1000, true], ['barbarian', 380, 1100, false], ['archer', 700, 1100, true]];
    troops.forEach(([name, x, y, flip], i) => {
      const k = pop(t, 0.2 + i * 0.1, 0.4);
      if (k > 0) art(ctx, name, x, y + float(t, i, 6, 3), 230 * k, { flip });
    });
    art(ctx, 'warden', W / 2, 820 + float(t), 600);
    // Health: green + marks rising off the troops.
    if (t > tHealth) {
      const r = rng(9);
      for (let i = 0; i < 10; i++) {
        const t0 = tHealth + i * 0.12, k = prog(t, t0, 1.1);
        if (k <= 0 || k >= 1) continue;
        const [, tx, ty] = troops[i % 4];
        withT(ctx, tx + (r() - 0.5) * 120, ty - 120 - k * 260, 0.8 + r() * 0.4, 0, () => title(ctx, '+', 0, 0, 80, { fill: ['#C8FFC8', C.green], alpha: 1 - k }));
      }
    }
    // Eternal Tome: golden shield dome over everyone.
    const dome = prog(t, tTome, 0.5);
    if (dome > 0) {
      const pulse = 0.85 + 0.15 * Math.sin(t * 6);
      ctx.save();
      ctx.beginPath(); ctx.ellipse(W / 2, 1060, 470 * ease.outBack(dome), 520 * ease.outBack(dome), 0, Math.PI, 0); ctx.closePath();
      ctx.fillStyle = `rgba(255,220,120,${0.16 * pulse})`; ctx.fill();
      ctx.strokeStyle = `rgba(255,240,180,${0.85 * pulse})`; ctx.lineWidth = 12; ctx.stroke();
      ctx.restore();
    }
    ring(ctx, t, tTome, W / 2, 900, { maxR: 650 });
    flash(ctx, t, tTome + 0.1, { peak: 0.45, color: '255,240,190' });
    if (t > tImmune) withT(ctx, W / 2, 520, pop(t, tImmune - 0.1, 0.4), -0.05, () => pill(ctx, 'IMMUNE TO DAMAGE', 0, 0, 52, [C.red, '#A51515']));
    finish(ctx);
  },

  // 3 — The only hero upgraded with regular Elixir, not Dark Elixir.
  (ctx, t, dur) => {
    const tOnly = when('only', 0, 0.9), tElixir = when('elixir', 0, 2.9), tDark = when('dark', 0, 3.8);
    ambient(ctx, t, { mid: '#B03A9E', top: '#440E3C', bottom: '#120310', rayColor: 'rgba(255,170,240,0.10)' }, { color: '255,170,240' });
    withT(ctx, W / 2, 230, pop(t, tOnly - 0.2, 0.45), 0, () => title(ctx, 'THE ONLY HERO', 0, -55, 104));
    withT(ctx, W / 2, 230, pop(t, tOnly, 0.45), 0, () => title(ctx, 'ON ELIXIR', 0, 65, 104, { fill: ['#FFE3FB', '#FF9AF0', '#B0259C'] }));
    art(ctx, 'warden', W / 2, 640 + float(t), 480);
    const ke = pop(t, tElixir - 0.2, 0.45);
    if (ke > 0) withT(ctx, 300, 1060, ke * (1 + Math.sin(t * 5) * 0.03), 0, () => {
      glow(ctx, 0, 0, 220, '255,150,240', 0.6);
      drop(ctx, false);
      withT(ctx, 95, 120, 1, 0, () => { const c = new Path2D(); c.arc(0, 0, 48, 0, Math.PI * 2); chunky(ctx, c, '#7BEA84', '#2E9A38', { lw: 8, y0: -48, y1: 48 }); title(ctx, '✓', 0, 4, 60, { fill: C.white, lw: 6, shadow: false }); });
    });
    const kd = pop(t, tDark - 0.2, 0.45);
    if (kd > 0) withT(ctx, 780, 1060, kd, 0, () => {
      ctx.globalAlpha = 0.85;
      drop(ctx, true);
      withT(ctx, 95, 120, 1, 0, () => { const c = new Path2D(); c.arc(0, 0, 48, 0, Math.PI * 2); chunky(ctx, c, C.red, '#9E1414', { lw: 8, y0: -48, y1: 48 }); title(ctx, '✕', 0, 4, 56, { fill: C.white, lw: 6, shadow: false }); });
    });
    burst(ctx, t, tElixir - 0.2, 300, 1060, { n: 30, speed: 600, color: '255,150,240' });
    finish(ctx);
  },

  // 4 — 2019: first skin, Party Warden; dozens since, from Gladiator Warden to Pirate Warden.
  (ctx, t, dur) => {
    const tParty = when('party', 0, 1.3), tDozens = when('dozens', 0, 6.1), tGlad = when('gladiator', 0, 7.0), tPirate = when('pirate', 0, 8.2);
    ambient(ctx, t, { ...ARCANE, cy: 760 }, {});
    yearStamp(ctx, t, when('2019', 0, 2.9) - 0.2, 'FIRST SKIN', '2019', 280);

    const move = ease.inOutCubic(prog(t, tDozens - 0.2, 0.6));
    const kp = ease.outBack(prog(t, tParty - 0.3, 0.55), 1.3);
    if (kp > 0) {
      framedArt(ctx, 'skin_party', lerp(W / 2, 540, move), lerp(800, 700, move) + float(t), lerp(560, 300, move), kp, Math.sin(t * 1.3) * 0.02);
      if (move < 1) withT(ctx, W / 2, 1215, kp * (1 - move), 0, () => pill(ctx, 'PARTY WARDEN', 0, 0, 58, [C.gold, C.goldLo], C.ink));
    }
    const skins = [['skin_gladiator', 195, 720, tGlad], ['skin_pirate', 885, 720, tPirate], ['skin_ghost', 195, 1085, tDozens + 0.2],
                   ['skin_dragon', 540, 1100, tDozens + 0.35], ['skin_primal', 885, 1085, tDozens + 0.5]];
    skins.forEach(([name, x, y, t0], i) => {
      const k = pop(t, t0, 0.45);
      if (k <= 0) return;
      const big = (name === 'skin_gladiator' && t > tGlad && t < tGlad + 0.8) || (name === 'skin_pirate' && t > tPirate);
      art(ctx, name, x, y + float(t, i, 8, 2), 330 * k * (big ? 1.12 : 1));
      burst(ctx, t, t0, x, y, { n: 18, speed: 420, life: 0.5, seed: 30 + i, size: 7 });
    });
    if (t > tDozens) withT(ctx, W / 2, 470, pop(t, tDozens, 0.4), 0.03, () => pill(ctx, 'DOZENS OF SKINS', 0, 0, 48, [C.red, '#A51515']));
    finish(ctx);
  },

  // 5 — December 2023: abilities became Hero Equipment (Eternal Tome, Life Gem).
  (ctx, t, dur) => {
    const tAb = when('abilities', 0, 2.1), tHero = when('hero', 0, 3.3), tTome = when('eternal', 0, 5.2), tGem = when('gem', 0, 6.7);
    const [sx, sy] = shakeAt(t, tHero, 20, 5);
    ctx.translate(sx, sy);
    ambient(ctx, t, { mid: '#1E4A8A', top: '#0E1A44', bottom: '#050818', rayColor: 'rgba(140,190,255,0.08)', cy: 800 },
            { color: '170,210,255' });
    yearStamp(ctx, t, 0.0, 'DECEMBER', '2023', 280);
    withT(ctx, W / 2, 520, pop(t, tHero - 0.1, 0.45), 0, () => title(ctx, 'HERO EQUIPMENT', 0, 0, 104));
    // The Warden shrinks away as his abilities turn into cards.
    const away = ease.inCubic(prog(t, tHero - 0.2, 0.5));
    if (away < 1) art(ctx, 'warden', W / 2, 900 + float(t), 560 * (1 - away), { alpha: 1 - away });
    burst(ctx, t, tHero - 0.1, W / 2, 900, { n: 50, speed: 900, color: '255,220,150' });
    const items = [['eq_tome', 'ETERNAL TOME', 300, 800, tTome, [C.gold, C.goldLo]],
                   ['eq_life_gem', 'LIFE GEM', 780, 800, tGem, [C.orange, '#B85A0B']],
                   ['eq_healing_tome', 'HEALING TOME', 300, 1110, tHero + 0.4, ['#FFE08A', C.orange]],
                   ['eq_rage_gem', 'RAGE GEM', 780, 1110, tHero + 0.6, ['#FF8FC8', '#C23C82']]];
    items.forEach(([name, label, x, y, t0, col], i) => {
      const k = pop(t, t0, 0.45);
      if (k <= 0) return;
      const hl = (i < 2 && t > t0 && t < t0 + 0.9) ? 1.08 : 1;
      withT(ctx, x, y + float(t, i, 6, 2.2), k * hl, (i % 2 ? 1 : -1) * 0.03, () => {
        chunky(ctx, rectPath(-200, -150, 400, 300, 34), col[0], col[1], { lw: 12, y0: -150, y1: 150 });
        art(ctx, name, 0, -22, 190, { shadow: false });
        title(ctx, label, 0, 112, 34, { fill: C.white, lw: 8 });
      });
    });
    finish(ctx);
  },

  // 6 — Level cap: 85 (TH18), 90 (TH19).
  (ctx, t, dur) => {
    const t85 = when('85', 0, 2.3), t90 = when('90', 0, 4.6);
    const [sx, sy] = shakeAt(t, t90 + 0.25, 26, 4);
    ctx.translate(sx, sy);
    ambient(ctx, t, { ...ARCANE, cy: 900 }, { color: '255,220,150', rise: 90 });
    withT(ctx, W / 2, 210, pop(t, 0, 0.45), 0, () => title(ctx, 'LEVEL CAP', 0, 0, 140));
    const bars = [['2015', 20, -1], ['TH18', 85, t85], ['TH19', 90, t90]];
    const base = 1180, maxH = 720, bw = 200;
    bars.forEach(([label, lvl, t0], i) => {
      const g = t0 < 0 ? ease.outCubic(prog(t, 0.2, 0.6)) : ease.outBack(prog(t, t0 - 0.1, 0.55), 1.2);
      if (g <= 0) return;
      const x = 330 + i * 270, h = maxH * (lvl / 90) * g;
      const top = i === 2 ? [C.goldHi, C.orange] : i === 0 ? ['#B9AFC9', '#6C6280'] : [C.purpleHi, C.purple];
      if (i === 2 && t > t90) glow(ctx, x, base - h, 260, '255,220,120', 0.7);
      chunky(ctx, rectPath(x - bw / 2, base - h, bw, h, 20), top[0], top[1], { lw: 10, y0: base - h, y1: base });
      title(ctx, `${Math.round(lvl * Math.min(1, g))}`, x, base - h - 55, 74, { fill: [C.white, C.goldHi] });
      title(ctx, label, x, base + 45, 42, { fill: C.white, lw: 8 });
    });
    const kk = ease.outBack(prog(t, 0.3, 0.6), 1.3);
    if (kk > 0) art(ctx, 'warden', 160, 640 + float(t), 330 * kk);
    ring(ctx, t, t90 + 0.25, 870, 460, { maxR: 650 });
    burst(ctx, t, t90 + 0.25, 870, 460, { n: 60, speed: 1100 });
    flash(ctx, t, t90 + 0.25, { peak: 0.5, color: '255,240,200' });
    finish(ctx);
  },

  // 7 — The Titan skin.
  (ctx, t, dur) => {
    const tTitan = when('titan', 0, 1.6);
    const [sx, sy] = shakeAt(t, tTitan, 24, 4);
    ctx.translate(sx, sy);
    ambient(ctx, t, { mid: '#8A6A2A', top: '#3A2A08', bottom: '#120C02', rayColor: 'rgba(255,230,170,0.15)', cy: 780 },
            { color: '255,225,150', rise: 120, n: 110 });
    withT(ctx, W / 2, 190, pop(t, 0, 0.4), 0, () => pill(ctx, 'THIS SEASON', 0, 0, 46, [C.white, '#D8D8D8'], C.ink));
    const kk = ease.outBack(prog(t, 0.2, 0.7), 1.2);
    glow(ctx, W / 2, 800, 600, '255,230,150', 0.6 * kk);
    if (kk > 0) art(ctx, 'titan_warden', W / 2, lerp(1700, 820, kk) + float(t), 820);
    const kt = t < tTitan ? 0 : lerp(2.4, 1, ease.outBack(prog(t, tTitan, 0.35), 2));
    if (kt > 0) withT(ctx, W / 2, 330, kt, 0, () => title(ctx, 'TITAN WARDEN', 0, 0, 124, { fill: [C.white, C.goldHi, C.gold] }));
    ring(ctx, t, tTitan, W / 2, 800, { maxR: 800 });
    burst(ctx, t, tTitan, W / 2, 800, { n: 80, speed: 1300 });
    flash(ctx, t, tTitan, { peak: 0.7, color: '255,245,210' });
    withT(ctx, W / 2, 1215, pop(t, tTitan + 0.3, 0.4), 0, () => pill(ctx, 'NEW SKIN', 0, 0, 58, [C.red, '#A51515']));
    finish(ctx);
  },

  // 8 — Outro: King, Queen or Warden?
  (ctx, t, dur) => {
    const tK = when('king', 0, 2.0), tQ = when('queen', 0, 2.6), tW = when('warden', 0, 3.4), tComments = when('comments', 0, 4.9);
    ambient(ctx, t, { mid: '#7A2340', top: '#2E0A18', bottom: '#0E0308', rayColor: 'rgba(255,190,140,0.10)' }, {});
    withT(ctx, W / 2, 230, pop(t, 0.0, 0.45), 0, () => title(ctx, 'WHO IS THE BEST?', 0, 0, 104));
    const heroes = [['king', 185, 820, tK, '255,180,90'], ['warden', 540, 760, tW, '255,230,150'], ['queen', 895, 820, tQ, '200,150,255']];
    heroes.forEach(([name, x, y, t0, col], i) => {
      const k = ease.outBack(prog(t, t0 - 0.3, 0.5), 1.3);
      if (k <= 0) return;
      const focus = t > t0 && t < t0 + 0.6 ? 1.1 : 1;
      glow(ctx, x, y, 300, col, 0.45 * k);
      art(ctx, name, x, lerp(1700, y, k) + float(t, i), (name === 'warden' ? 560 : 480) * focus, { flip: name === 'queen' });
      withT(ctx, x, 1100, pop(t, t0, 0.35), 0, () => pill(ctx, name.toUpperCase(), 0, 0, 40, [C.gold, C.goldLo], C.ink));
      burst(ctx, t, t0, x, y, { n: 24, speed: 500, seed: 40 + i });
    });
    withT(ctx, W / 2, 1215, pop(t, tComments - 0.2, 0.45), 0, () => pill(ctx, 'TELL ME IN THE COMMENTS', 0, 0, 50, [C.red, '#A51515']));
    finish(ctx);
  },
];
</script>
