<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Town Hall 19 motion scenes</title>
<script>
// Official Supercell Fan Kit art (tools/fankit.py fetch projects/th19/fankit.json). Drawn scaled and
// moved only, never altered, per the Fan Content Policy.
const SQUADS = ['barcher', 'wall_breaker', 'giant_wizard', 'balloon', 'healer', 'dragon', 'baby_dragon',
                'minion', 'hog_rider', 'miner', 'golem_witch', 'pekka_etitan'];
window.ART = Object.fromEntries([
  'th19', 'th19_barbarian', 'th19_archer', 'th19_wizard', 'squad_card', 'squad_barracks',
  'barbarian', 'archer', 'wizard', 'spiky_tower', 'firecracker_tower', 'guardian_shrine', 'king',
  'star_bonus', 'snack_pancakes', 'snack_cake', 'snack_skewer', 'snack_soup',
  ...SQUADS.map(s => 'sq_' + s),
].map(n => [n, `fankit/${n}.png`]));
</script>
<script src="../../motion/lib.js"></script>
</head>
<body>
<script>
// Each scene: (ctx, t, dur). Captions are burned in later around y = 1300-1420, so keep that band calm.
// when('word') returns the time that word is spoken, so reveals land on the narration.

function ambient(ctx, t, opts = {}) {
  background(ctx, t, opts.bg || {});
  sparks(ctx, t, opts.sparks || {});
}
const finish = ctx => vignette(ctx, 0.6);
const float = (t, k = 0, amp = 10, speed = 1.6) => Math.sin(t * speed + k) * amp;

window.scenes = [
  // 0 — "Town Hall 19 is finally here ... everything new in 60 seconds."
  (ctx, t, dur) => {
    const tHit = when('19', 0, 0.5);
    const [sx, sy] = shakeAt(t, tHit, 26, 4);
    ctx.translate(sx, sy);
    ambient(ctx, t, { bg: { cy: 860 } });

    const rise = ease.outBack(prog(t, 0.05, 0.8), 1.2);
    glow(ctx, W / 2, 860, 560, '255,190,90', 0.5 * rise);
    if (rise > 0) art(ctx, 'th19', W / 2, lerp(1600, 860, rise) + float(t), 760);

    const k = pop(t, 0.0, 0.5);
    withT(ctx, W / 2, 235, k, 0, () => title(ctx, 'TOWN HALL', 0, 0, 150));
    const s = t < tHit ? 0 : lerp(2.6, 1, ease.outBack(prog(t, tHit, 0.35), 2.2));
    if (s > 0) {
      withT(ctx, 840, 470, s, -0.12 + Math.sin(t * 2) * 0.03, () => {
        glow(ctx, 0, 0, 240, '255,220,120', 0.6);
        chunky(ctx, shieldPath(240, 280), C.goldHi, C.goldLo, { lw: 14, y0: -140, y1: 140 });
        chunky(ctx, shieldPath(185, 225), C.purple, C.purpleLo, { lw: 8, y0: -112, y1: 112 });
        title(ctx, '19', 0, -8, 135, { fill: [C.white, C.goldHi], lw: 18 });
      });
    }
    ring(ctx, t, tHit, 840, 470, { maxR: 700 });
    burst(ctx, t, tHit, 840, 470, { n: 60, speed: 1200 });
    flash(ctx, t, tHit, { peak: 0.7 });

    const pk = pop(t, when('everything', 0, 3.2), 0.45);
    if (pk > 0) withT(ctx, W / 2, 1215, pk, 0, () => pill(ctx, 'EVERYTHING NEW IN 60s', 0, 0, 58, [C.red, '#A51515']));
    finish(ctx);
  },

  // 1 — Squads: whole groups of troops with one tap, from the new Squad Barracks.
  (ctx, t, dur) => {
    const tSquads = when('squads', 0, 1.0), tGroups = when('groups', 0, 1.8);
    const tTap = when('tap', 0, 3.6), tBarracks = when('barracks', 0, dur - 2.6);
    const [sx, sy] = shakeAt(t, tTap, 14, 6);
    ctx.translate(sx, sy);
    ambient(ctx, t, { bg: { mid: '#5A2BB0' } });

    withT(ctx, W / 2, 190, pop(t, 0, 0.4), 0, () => pill(ctx, 'BIGGEST CHANGE', 0, 0, 44, [C.gold, C.goldLo], C.ink));
    const ks = t < tSquads ? 0 : lerp(2.2, 1, ease.outBack(prog(t, tSquads, 0.35), 2));
    if (ks > 0) withT(ctx, W / 2, 340, ks, 0, () => title(ctx, 'SQUADS', 0, 0, 180));
    flash(ctx, t, tSquads, { peak: 0.4 });

    // The Barch squad charges in, hops on the tap, then slides away for the barracks.
    const leave = ease.inCubic(prog(t, tBarracks - 0.4, 0.6));
    const arrive = ease.outBack(prog(t, tGroups, 0.6), 1.3);
    if (arrive > 0 && leave < 1) {
      const hop = t > tTap ? Math.max(0, Math.sin((t - tTap) * 9)) * 45 * Math.exp(-(t - tTap) * 1.5) : 0;
      glow(ctx, W / 2, 790, 480, '255,180,90', 0.45 * arrive * (1 - leave));
      // The squad art is a square card: show it in a rounded frame.
      withT(ctx, lerp(-700, W / 2, arrive) - leave * 1300, 790 - hop, 1, Math.sin(t * 1.3) * 0.02, () => {
        const frame = rectPath(-320, -320, 640, 640, 48);
        ctx.save(); ctx.clip(frame); art(ctx, 'squad_card', 0, 0, 640, { shadow: false }); ctx.restore();
        ctx.lineWidth = 16; ctx.strokeStyle = C.ink; ctx.stroke(frame);
        ctx.lineWidth = 8; ctx.strokeStyle = C.gold; ctx.stroke(frame);
      });
    }
    // The tap: finger presses, ripples spread.
    const kt = pop(t, tTap - 0.35, 0.3) * (1 - leave);
    if (kt > 0) {
      const press = t > tTap && t < tTap + 0.18 ? 0.85 : 1;
      for (let r = 0; r < 3; r++) ring(ctx, t, tTap + r * 0.12, 690, 960, { maxR: 240, life: 0.7, color: '255,255,255', width: 14 });
      withT(ctx, 730, 1030, 0.75 * kt * press, -0.3, () => icon.tap(ctx, t));
      if (t > tTap) withT(ctx, W / 2, 1215, pop(t, tTap, 0.4) * (1 - leave), 0, () => pill(ctx, '1 TAP = 1 SQUAD', 0, 0, 60, [C.green, '#2E9A38']));
    }
    // Squad Barracks pops in.
    const kb = pop(t, tBarracks, 0.5);
    if (kb > 0) {
      glow(ctx, W / 2, 790, 450, '255,170,90', 0.5 * kb);
      art(ctx, 'squad_barracks', W / 2, 790 + float(t, 0, 8, 2), 560 * kb);
      withT(ctx, W / 2, 1215, pop(t, tBarracks + 0.25, 0.4), 0, () => pill(ctx, 'NEW: SQUAD BARRACKS', 0, 0, 56, [C.red, '#A51515']));
    }
    burst(ctx, t, tBarracks, W / 2, 790, { n: 50, speed: 1000 });
    finish(ctx);
  },

  // 2 — One new squad per Town Hall, TH8 -> TH19; upgrades only at TH19.
  (ctx, t, dur) => {
    const tStart = when('8', 0, 1.2), tTwelve = when('twelve', 0, 5.2), tOnly = when('only', 0, dur - 3.2);
    const [sx, sy] = shakeAt(t, tOnly + 0.2, 22, 5);
    ctx.translate(sx, sy);
    ambient(ctx, t, { bg: { mid: '#3E2A9E', cy: 760 } });
    withT(ctx, W / 2, 215, pop(t, 0, 0.45), 0, () => title(ctx, 'A SQUAD PER TOWN HALL', 0, 0, 78));

    const nodes = [];
    for (let i = 0; i < 12; i++) {
      const row = Math.floor(i / 4), col = row % 2 ? 3 - (i % 4) : i % 4;
      nodes.push([195 + col * 230, 450 + row * 250]);
    }
    const lit = i => tStart + (i / 11) * (tTwelve - tStart + 0.3);
    ctx.lineCap = 'round';
    for (let i = 0; i < 11; i++) {
      const [x0, y0] = nodes[i], [x1, y1] = nodes[i + 1];
      ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 26;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      const k = prog(t, lit(i), lit(i + 1) - lit(i));
      if (k > 0) {
        ctx.strokeStyle = C.gold; ctx.lineWidth = 14;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(lerp(x0, x1, k), lerp(y0, y1, k)); ctx.stroke();
      }
    }
    const lockedOut = prog(t, tOnly, 0.4);
    let count = 0;
    nodes.forEach(([x, y], i) => {
      const on = t >= lit(i);
      if (on) count++;
      const s = on ? 0.82 + 0.18 * ease.outBack(prog(t, lit(i), 0.35), 2.5) : 0.82;
      if (i === 11 && t > tOnly) glow(ctx, x, y, 210, '255,220,120', 0.75 + 0.2 * Math.sin(t * 6));
      const dim = (on ? 1 : 0.35) * (i < 11 ? 1 - lockedOut * 0.6 : 1);
      art(ctx, 'sq_' + SQUADS[i], x, y - 8, 170 * s, { alpha: dim, shadow: false });
      withT(ctx, x, y + 88, 1, 0, () => pill(ctx, `TH${8 + i}`, 0, 0, 28, on ? [C.gold, C.goldLo] : ['#5B4C86', '#2C2148'], on ? C.ink : C.white));
      if (on) burst(ctx, t, lit(i), x, y, { n: 14, speed: 380, life: 0.5, seed: i + 11, size: 7 });
    });
    withT(ctx, W / 2, 1215, pop(t, tStart, 0.4), 0, () => pill(ctx, `SQUADS UNLOCKED: ${count}/12`, 0, 0, 56, [C.purpleHi, C.purple]));

    const ks = t < tOnly ? 0 : lerp(3, 1, ease.outCubic(prog(t, tOnly, 0.22)));
    if (ks > 0) {
      withT(ctx, W / 2, 740, ks, -0.18, () => {
        ctx.globalAlpha = clamp((t - tOnly) / 0.12);
        chunky(ctx, rectPath(-390, -95, 780, 190, 26), C.red, '#9E1414', { lw: 14, y0: -95, y1: 95 });
        title(ctx, 'LEVEL UP: TH19 ONLY', 0, 4, 66, { fill: C.white, lw: 12 });
      });
    }
    finish(ctx);
  },

  // 3 — Town Hall weapon: Barbarian, Archer or Wizard Hall, releasing troops when attacked.
  (ctx, t, dur) => {
    const tBarb = when('barbarian', 0, 2.6), tArch = when('archer', 0, 3.2), tWiz = when('wizard', 0, 3.9);
    const tUnleash = when('unleashes', 0, 5.4), tAttack = when('attacked', 0, tUnleash + 1.1);
    const [sx, sy] = shakeAt(t, tAttack, 30, 4);
    ctx.translate(sx, sy);
    ambient(ctx, t, { bg: { mid: '#8A2E6E', top: '#3A0F3E' } });

    withT(ctx, W / 2, 180, pop(t, 0, 0.4), 0, () => pill(ctx, 'YOUR CHOICE', 0, 0, 44, [C.gold, C.goldLo], C.ink));
    withT(ctx, W / 2, 300, pop(t, 0.15, 0.45), 0, () => title(ctx, 'TOWN HALL WEAPON', 0, 0, 92));

    const halls = [['th19_barbarian', 'BARBARIAN', tBarb, [C.orange, '#B85A0B']], ['th19_archer', 'ARCHER', tArch, ['#FF7EC0', '#C23C82']],
                   ['th19_wizard', 'WIZARD', tWiz, [C.blue, '#2370B8']]];
    const shrink = ease.inOutCubic(prog(t, tUnleash - 0.3, 0.5));
    const highlight = Math.floor(t * 1.5) % 3;
    halls.forEach(([name, label, tc, col], i) => {
      const k = pop(t, tc, 0.45);
      if (k <= 0) return;
      const x = 200 + i * 340, y = lerp(690, 520, shrink), s = k * lerp(1, 0.6, shrink);
      const lift = t > tWiz + 0.5 && t < tUnleash && i === highlight ? -18 : 0;
      withT(ctx, x, y + lift, s, (i - 1) * 0.04, () => {
        chunky(ctx, rectPath(-155, -215, 310, 430, 30), col[0], col[1], { lw: 12, y0: -215, y1: 215 });
        art(ctx, name, 0, -30, 270, { shadow: false });
        title(ctx, label, 0, 165, 44, { fill: C.white, lw: 9 });
      });
    });

    // The Town Hall shakes, then real troops burst out of it.
    const kt = pop(t, tUnleash - 0.1, 0.5);
    if (kt > 0) {
      const wob = t < tAttack ? Math.sin(t * 40) * 7 * prog(t, tUnleash, 0.6) : 0;
      glow(ctx, W / 2, 960, 420, '255,150,90', 0.5 * kt);
      art(ctx, 'th19', W / 2 + wob, 980, 520 * kt);
      const fly = prog(t, tAttack, 1.3);
      if (fly > 0) {
        const r = rng(5);
        ['barbarian', 'archer', 'wizard', 'barbarian', 'archer', 'wizard'].forEach((troop, i) => {
          const a = -Math.PI / 2 + (i - 2.5) * 0.42 + (r() - 0.5) * 0.2, d = 640 * ease.outCubic(fly);
          const x = W / 2 + Math.cos(a) * d, y = 930 + Math.sin(a) * d + 520 * fly * fly;
          art(ctx, troop, x, y, 260, { rot: (r() - 0.5) * fly * 1.2, flip: Math.cos(a) < 0, shadow: false });
        });
      }
    }
    ring(ctx, t, tAttack, W / 2, 930, { maxR: 800 });
    burst(ctx, t, tAttack, W / 2, 930, { n: 70, speed: 1300, color: '255,170,80' });
    flash(ctx, t, tAttack, { peak: 0.8 });
    finish(ctx);
  },

  // 4 — New defenses: Spiky Tower, Firecracker Tower, Guardian Shrine.
  (ctx, t, dur) => {
    const tSpiky = when('spiky', 0, 2.0), tFire = when('firecracker', 0, 3.4), tGuard = when('guardians', 0, dur - 3.5);
    ambient(ctx, t, { bg: { mid: '#1E3A8A', top: '#0E1A44', bottom: '#050818', rayColor: 'rgba(140,190,255,0.08)' },
                      sparks: { color: '170,210,255' } });
    withT(ctx, W / 2, 215, pop(t, 0, 0.45), 0, () => title(ctx, 'NEW DEFENSES', 0, 0, 120));

    const up = ease.inOutCubic(prog(t, tGuard - 0.2, 0.6));
    const ty = lerp(700, 520, up), th = lerp(560, 360, up);
    const k1 = pop(t, tSpiky, 0.5);
    if (k1 > 0) {
      art(ctx, 'spiky_tower', 280, ty + float(t, 0, 8), th * k1);
      withT(ctx, 280, ty + th * 0.55 + 20, k1, 0, () => pill(ctx, 'SPIKY TOWER', 0, 0, 40, ['#C8CFDD', C.stoneLo], C.ink));
    }
    const k2 = pop(t, tFire, 0.5);
    if (k2 > 0) {
      // Fireworks bursting above the Firecracker Tower.
      for (let n = 0; n < 6; n++) {
        const t0 = tFire + 0.3 + n * 0.75, tx = 800 + ((n * 137) % 300) - 150, tyy = ty - th * 0.6 - ((n * 91) % 140);
        const col = ['255,90,90', '255,210,90', '120,200,255'][n % 3];
        const f = prog(t, t0, 0.6);
        if (f > 0 && f < 1) {
          ctx.strokeStyle = `rgba(${col},0.8)`; ctx.lineWidth = 6;
          ctx.beginPath(); ctx.moveTo(800, ty - th * 0.2); ctx.lineTo(lerp(800, tx, f), lerp(ty - th * 0.2, tyy, ease.outCubic(f))); ctx.stroke();
        }
        burst(ctx, t, t0 + 0.6, tx, tyy, { n: 36, speed: 480, life: 0.9, color: col, seed: 20 + n, size: 8 });
        ring(ctx, t, t0 + 0.6, tx, tyy, { maxR: 150, life: 0.5, color: col, width: 10 });
      }
      art(ctx, 'firecracker_tower', 800, ty + float(t, 1, 8), th * 1.05 * k2);
      withT(ctx, 800, ty + th * 0.55 + 20, k2, 0, () => pill(ctx, 'FIRECRACKER TOWER', 0, 0, 36, [C.red, '#9E1414']));
    }
    const k3 = pop(t, tGuard + 0.2, 0.5);
    if (k3 > 0) {
      glow(ctx, W / 2, 1000, 330, '160,120,255', 0.5 * k3);
      art(ctx, 'guardian_shrine', W / 2, 1000 + float(t, 2, 6, 2), 320 * k3);
      withT(ctx, W / 2, 1215, pop(t, tGuard + 0.45, 0.4), 0, () => pill(ctx, 'GUARDIAN SHRINE', 0, 0, 52, [C.purpleHi, C.purple]));
    }
    burst(ctx, t, tGuard + 0.2, W / 2, 1000, { n: 40, speed: 800, color: '190,150,255' });
    finish(ctx);
  },

  // 5 — Barbarian King max level 115.
  (ctx, t, dur) => {
    const tKing = when('king', 0, 2.2), tMax = when('maxes', 0, 3.0), t115 = when('115', 0, 3.8);
    const [sx, sy] = shakeAt(t, t115 + 0.35, 20, 5);
    ctx.translate(sx, sy);
    ambient(ctx, t, { bg: { mid: '#B5541A', top: '#4A1A08', bottom: '#140502', rayColor: 'rgba(255,220,140,0.12)', cy: 620 },
                      sparks: { color: '255,190,90', rise: 90 } });
    withT(ctx, W / 2, 175, pop(t, 0, 0.4), 0, () => pill(ctx, 'HEROES CLIMB HIGHER', 0, 0, 44, [C.gold, C.goldLo], C.ink));

    const kc = ease.outBack(prog(t, 0.15, 0.7), 1.3);
    glow(ctx, W / 2, 620, 520, '255,210,110', 0.55 * kc);
    if (kc > 0) art(ctx, 'king', W / 2 + lerp(300, 0, kc), 640 + float(t, 0, 10, 1.8), 760);
    withT(ctx, W / 2, 1060, pop(t, tKing - 0.3, 0.45), 0, () => title(ctx, 'BARBARIAN KING', 0, 0, 92));

    const kr = prog(t, tMax, Math.max(0.3, t115 + 0.35 - tMax));
    if (t > tMax - 0.2) {
      const lvl = Math.round(lerp(95, 115, ease.outCubic(kr)));
      const s = t > t115 + 0.35 ? lerp(1.5, 1, ease.outBack(prog(t, t115 + 0.35, 0.35))) : 1;
      withT(ctx, 860, 400, s, 0.08, () => {
        chunky(ctx, rectPath(-170, -85, 340, 170, 40), C.purple, C.purpleLo, { lw: 12, y0: -85, y1: 85 });
        title(ctx, `LV ${lvl}`, 0, 4, 96, { fill: [C.white, C.goldHi, C.gold] });
      });
      const bw = 720, bx = W / 2 - bw / 2;
      chunky(ctx, rectPath(bx, 1140, bw, 50, 25), '#3A1A08', '#1E0C03', { lw: 10, gloss: false, y0: 1140, y1: 1190 });
      if (kr > 0) chunky(ctx, rectPath(bx + 8, 1147, (bw - 16) * ease.outCubic(kr), 36, 18), C.goldHi, C.orange, { lw: 0, y0: 1147, y1: 1183 });
      if (t > t115 + 0.35) withT(ctx, 860, 290, pop(t, t115 + 0.35, 0.4), 0.15, () => pill(ctx, 'NEW MAX', 0, 0, 40, [C.red, '#9E1414']));
    }
    burst(ctx, t, t115 + 0.35, 860, 400, { n: 60, speed: 1100 });
    flash(ctx, t, t115 + 0.35, { peak: 0.45, color: '255,230,170' });
    finish(ctx);
  },

  // 6 — Magic Snacks + Star Bonus scaling with Town Hall level.
  (ctx, t, dur) => {
    const tMagic = when('magic', 0, 0.4), tStar = when('star', 0, 2.2), tScale = when('scales', 0, 3.2);
    ambient(ctx, t, { bg: { mid: '#7B3FE4', top: '#331070' } });
    withT(ctx, W / 2, 215, pop(t, tMagic - 0.2, 0.45), 0, () => title(ctx, 'MAGIC SNACKS', 0, 0, 115, { fill: ['#FFE3F3', '#FF8FC8', '#E0478F'] }));
    ['snack_pancakes', 'snack_cake', 'snack_skewer', 'snack_soup'].forEach((name, i) => {
      const k = pop(t, tMagic + i * 0.12, 0.45);
      if (k <= 0) return;
      art(ctx, name, 165 + i * 250, 470 + float(t, i * 1.4, 16, 3), 210 * k, { rot: Math.sin(t * 2 + i) * 0.08, shadow: false });
    });
    burst(ctx, t, tMagic, 540, 470, { n: 40, speed: 700, color: '255,150,220' });

    const kst = pop(t, tStar - 0.1, 0.5);
    if (kst > 0) {
      art(ctx, 'star_bonus', 230, 900, 270 * kst, { rot: Math.sin(t * 1.5) * 0.06, shadow: false });
      withT(ctx, 230, 1090, kst, 0, () => title(ctx, 'STAR BONUS', 0, 0, 46, { fill: C.white, lw: 9 }));
      for (let i = 0; i < 5; i++) {
        const g = ease.outBack(prog(t, tScale + i * 0.12, 0.45));
        const h = (110 + i * 60) * g, x = 450 + i * 120, base = 1100;
        if (g <= 0) continue;
        chunky(ctx, rectPath(x - 44, base - h, 88, h, 14), C.goldHi, C.goldLo, { lw: 8, y0: base - h, y1: base });
        title(ctx, `TH${15 + i}`, x, base + 40, 32, { fill: C.white, lw: 7 });
      }
      if (t > tScale + 0.6) {
        ctx.save();
        ctx.globalAlpha = prog(t, tScale + 0.6, 0.3);
        ctx.strokeStyle = C.green; ctx.lineWidth = 16; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(440, 930); ctx.lineTo(960, 700); ctx.stroke();
        withT(ctx, 960, 700, 1, -0.42, () => { ctx.fillStyle = C.green; ctx.fill(polyPath([[10, 0], [-40, -32], [-40, 32]])); });
        ctx.restore();
      }
    }
    finish(ctx);
  },

  // 7 — Outro question: rush to TH19 or stay? Comment.
  (ctx, t, dur) => {
    const tRush = when('rushing', 0, 0.6), tStay = when('staying', 0, 1.8), tComments = when('comments', 0, dur - 1.6);
    ambient(ctx, t, {});
    const pulse = k => 1 + Math.sin(t * 6 + k) * 0.03;
    const kh = ease.outBack(prog(t, 0, 0.6), 1.2);
    glow(ctx, W / 2, 380, 420, '255,190,90', 0.45 * kh);
    if (kh > 0) art(ctx, 'th19', W / 2, 390 + float(t), 470 * kh);

    const k1 = pop(t, tRush - 0.2, 0.45);
    if (k1 > 0) withT(ctx, W / 2, 760, k1 * pulse(0), -0.03, () => {
      chunky(ctx, rectPath(-380, -95, 760, 190, 46), '#7BEA84', '#2E9A38', { lw: 14, y0: -95, y1: 95 });
      title(ctx, 'RUSH TO TH19', 0, 6, 84, { fill: C.white, lw: 14 });
    });
    const kv = pop(t, tStay - 0.4, 0.4);
    if (kv > 0) withT(ctx, W / 2, 900, kv, 0, () => title(ctx, 'OR', 0, 0, 76, { fill: [C.white, C.goldHi] }));
    const k2 = pop(t, tStay - 0.1, 0.45);
    if (k2 > 0) withT(ctx, W / 2, 1040, k2 * pulse(3), 0.03, () => {
      chunky(ctx, rectPath(-380, -95, 760, 190, 46), C.purpleHi, C.purple, { lw: 14, y0: -95, y1: 95 });
      title(ctx, 'STAY PUT', 0, 6, 84, { fill: C.white, lw: 14 });
    });
    const kc = pop(t, tComments - 0.2, 0.5);
