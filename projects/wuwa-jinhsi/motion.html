<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Who is Jinhsi? motion scenes</title>
<script>
// Official Kuro Games art (see presskit/SOURCE.txt), cropped only and credited.
window.ART = Object.fromEntries(['vert', 'close', 'story', 'horns', 'buns'].map(n => [n, `presskit/${n}.jpg`]));
</script>
<script src="../../motion/lib.js"></script>
<script src="../../motion/wuwa.js"></script>
</head>
<body>
<script>
// Captions are burned in around y = 1300-1420, so keep that band calm.
// Jinhsi's palette: Jinzhou jade-teal with Spectro gold.
const JADE = ['#FFFFFF', '#DFFBF5', '#7FE3D0'];
const JGLOW = 'rgba(80,230,210,0.85)';
const jplate = (ctx, str, x, y, t, t0, size = 44) =>
  plate(ctx, str, x, y, t, t0, size, { border: 'rgba(140,240,220,0.9)', bg: 'rgba(6,30,32,0.74)', color: '#EFFFFB' });
const jserif = (ctx, str, x, y, size, opts = {}) => serif(ctx, str, x, y, size, { fill: JADE, glowColor: JGLOW, ...opts });
const fadeIn = (t, t0, d = 0.5) => ease.outCubic(prog(t, t0, d));

function jade(ctx, { wash = 0.1 } = {}) {
  ctx.fillStyle = `rgba(0,40,45,${wash})`; ctx.fillRect(0, 0, W, H);
  vignette(ctx, 0.7);
  credit(ctx, 'Art © Kuro Games · official Wuthering Waves art');
}
function band(ctx, y0 = 920, y1 = 1290, a = 0.65) {
  ctx.fillStyle = vgrad(ctx, y0, y1, [[0, 'rgba(0,25,28,0)'], [0.3, `rgba(0,25,28,${a})`], [0.8, `rgba(0,25,28,${a})`], [1, 'rgba(0,25,28,0)']]);
  ctx.fillRect(0, y0, W, y1 - y0);
}

// Wish lights: warm orbs drifting upward.
function wishes(ctx, t, { n = 26, seed = 5, a = 1 } = {}) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const x = r() * W + Math.sin(t * 0.6 + i) * 30, sp = 40 + r() * 60, s = 6 + r() * 10;
    const y = ((r() * H - t * sp) % (H + 100) + H + 100) % (H + 100) - 50;
    glow(ctx, x, y, s * 5, '255,220,140', 0.35 * a);
    ctx.fillStyle = `rgba(255,240,200,${0.8 * a})`; ctx.beginPath(); ctx.arc(x, y, s * 0.6, 0, Math.PI * 2); ctx.fill();
  }
}

// A loong scale: a small rounded shield with a sheen.
function scale(ctx, x, y, s, k, t, ph = 0) {
  if (k <= 0) return;
  withT(ctx, x, y, s * k, Math.sin(t + ph) * 0.2, () => {
    const g = ctx.createLinearGradient(-20, -24, 20, 24);
    const sh = 0.5 + 0.5 * Math.sin(t * 3 + ph);
    g.addColorStop(0, `rgba(220,255,250,${0.9})`); g.addColorStop(sh * 0.8 + 0.1, 'rgba(120,230,215,0.95)'); g.addColorStop(1, 'rgba(30,120,120,0.95)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0, -26); ctx.quadraticCurveTo(24, -20, 22, 4); ctx.quadraticCurveTo(14, 22, 0, 28);
    ctx.quadraticCurveTo(-14, 22, -22, 4); ctx.quadraticCurveTo(-24, -20, 0, -26); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.stroke();
  });
}

function framed(ctx, name, x, y, w, h, { alpha = 1, r = 26, border = 'rgba(140,240,220,0.95)' } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 50;
  ctx.fillStyle = '#000'; ctx.fill(rectPath(x, y, w, h, r));
  ctx.shadowBlur = 0;
  ctx.save(); ctx.clip(rectPath(x, y, w, h, r));
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(ARTS[name].img, x, y, w, h);
  ctx.restore();
  ctx.lineWidth = 5; ctx.strokeStyle = border; ctx.stroke(rectPath(x, y, w, h, r));
  ctx.restore();
}

function backdrop(ctx, name, t, dur, fx = 0.5, fy = 0.5, dark = 0.4) {
  cover(ctx, name, t, dur, [fx, fy, 1.25], [fx, fy, 1.35], { filter: 'blur(18px) saturate(1.2)' });
  ctx.fillStyle = `rgba(0,20,24,${dark})`; ctx.fillRect(0, 0, W, H);
}

function badge(ctx, t, t0, x, y, label, col, r = 80) {
  const k = pop(t, t0, 0.5);
  if (k <= 0) return;
  withT(ctx, x, y, k, 0, () => {
    glow(ctx, 0, 0, r * 1.8, col, 0.5 + 0.15 * Math.sin(t * 4));
    ctx.fillStyle = 'rgba(6,30,32,0.82)';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = `rgb(${col})`; ctx.stroke();
    serif(ctx, label, 0, 4, r * 0.36, { fill: ['#FFFFFF', `rgb(${col})`], glowColor: `rgba(${col},0.9)` });
  });
  ring(ctx, t, t0, x, y, { maxR: r * 3, life: 0.6, color: col, width: 10 });
}

// Round inset lifted out of a card: source circle (sx, sy, sr) in image `name`, drawn at (x, y) radius R.
function roundInset(ctx, name, sx, sy, sr, x, y, R, col = '140,240,220') {
  glow(ctx, x, y, R * 1.6, col, 0.45);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.clip();
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(ARTS[name].img, sx - sr, sy - sr, 2 * sr, 2 * sr, x - R, y - R, 2 * R, 2 * R);
  ctx.restore();
  ctx.lineWidth = 7; ctx.strokeStyle = `rgba(${col},0.95)`; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke();
}

window.scenes = [
  // 0 — People make wishes to share her luck. This is Jinhsi, Magistrate of Jinzhou.
  (ctx, t, dur) => {
    const tWish = when('wishes', 0, 0.9), tLuck = when('luck', 0, 2.2), tJin = when('jinhsi', 0, 3.4), tMag = when('magistrate', 0, 4.3);
    cover(ctx, 'vert', t, dur, [0.5, 0.32, 2.2], [0.5, 0.42, 1.05]);
    wishes(ctx, t, { a: fadeIn(t, tWish - 0.4, 0.8) });
    jade(ctx, { wash: 0.05 });
    band(ctx, 900, 1290, 0.6 * fadeIn(t, 0, 0.6));
    const early = 1 - prog(t, tJin - 0.5, 0.4);
    if (early > 0) {
      ctx.save(); ctx.globalAlpha = early;
      if (t > tWish - 0.3) jserif(ctx, 'they make wishes...', W / 2, 1010, 80, { italic: true, alpha: fadeIn(t, tWish - 0.3) });
      if (t > tLuck - 0.3) jserif(ctx, 'to share her luck', W / 2, 1120, 70, { italic: true, alpha: fadeIn(t, tLuck - 0.3), fill: ['#FFFFFF', '#FFF1C8', '#F2C66B'] });
      ctx.restore();
    }
    const kc = prog(t, tJin - 0.2, 0.6);
    if (kc > 0) {
      ctx.fillStyle = `rgba(200,255,245,${0.3 * (1 - kc)})`; ctx.fillRect(0, 0, W, H);
      withT(ctx, W / 2, 1050, lerp(1.25, 1, ease.outCubic(kc)), 0, () => jserif(ctx, 'JINHSI', 0, 0, 160, { alpha: ease.outCubic(kc) }));
    }
    if (t > tMag - 0.3) jplate(ctx, 'MAGISTRATE OF JINZHOU', W / 2, 1195, t, tMag - 0.3, 40);
  },

  // 1 — The Loong Maiden: a street she visits gets a sudden stroke of luck.
  (ctx, t, dur) => {
    const tLoong = when('loong', 0, 1.0), tVisit = when('visits', 0, 3.0), tLuck = when('luck', 0, 6.6);
    backdrop(ctx, 'close', t, dur, 0.4, 0.4);
    wishes(ctx, t, { n: 18, seed: 9, a: 0.7 });
    const kc = fadeIn(t, 0, 0.6);
    framed(ctx, 'close', 100, 250 + (1 - kc) * 60, 880, 630, { alpha: kc });
    // Luck rains down as gold stars.
    if (t > tLuck - 0.3) {
      const r = rng(77);
      for (let i = 0; i < 26; i++) {
        const x = r() * W, d = r() * 0.6, k = prog(t, tLuck - 0.3 + d, 1.6);
        if (k <= 0 || k >= 1) continue;
        withT(ctx, x, lerp(-60, 1250, ease.inCubic(k) * 0.6 + k * 0.4), 0.5 + r() * 0.5, t * 2 + i, () => {
          glow(ctx, 0, 0, 40, '255,215,120', 0.5);
          ctx.fillStyle = '#FFE08A'; ctx.fill(starPath(22, 9));
        });
      }
      ring(ctx, t, tLuck - 0.2, W / 2, 1150, { maxR: 520, life: 0.6, color: '255,220,140', width: 10 });
    }
    jade(ctx, { wash: 0.04 });
    band(ctx, 930, 1290, 0.65);
    if (t > tLoong - 0.3) jplate(ctx, 'THE LOONG MAIDEN', W / 2, 1010, t, tLoong - 0.3, 46);
    if (t > tVisit - 0.3 && t < tLuck - 0.4) jserif(ctx, 'wherever she visits...', W / 2, 1150, 66, { italic: true, alpha: fadeIn(t, tVisit - 0.3) });
    if (t > tLuck - 0.3) withT(ctx, W / 2, 1150, pop(t, tLuck - 0.3, 0.45), -0.03, () => jserif(ctx, 'a stroke of luck', 0, 0, 80, { italic: true, fill: ['#FFFFFF', '#FFF1C8', '#F2C66B'], glowColor: 'rgba(255,200,90,0.9)' }));
  },

  // 2 — A Resonance Connection with the Sentinel Jué; Loong Horns when she uses her Forte.
  (ctx, t, dur) => {
    const tSent = when('sentinel', 0, 3.4), tJue = when('jué', 0, 4.4), tForte = when('forte', 0, 5.6), tHorns = when('horns', 0, 7.0);
    // The Sentinel looms behind (top of the official key art).
    cover(ctx, 'vert', t, dur, [0.62, 0.1, 1.9], [0.6, 0.12, 2.05]);
    ctx.fillStyle = 'rgba(0,20,24,0.35)'; ctx.fillRect(0, 0, W, H);
    const kj = fadeIn(t, tSent - 0.3, 0.8);
    if (kj > 0) glow(ctx, 640, 520, 520, '120,240,220', 0.35 * kj);
    // The official "Horns of Loong" card, then its portrait lifts out.
    const kc = fadeIn(t, 0.2, 0.6) * (1 - prog(t, tHorns - 0.5, 0.5));
    if (kc > 0) framed(ctx, 'horns', 60, 760, 960, 440, { alpha: kc, r: 20 });
    const kl = ease.outBack(prog(t, tHorns - 0.5, 0.7));
    if (kl > 0) {
      const x = lerp(60 + 192, W / 2, kl), y = lerp(760 + 220, 900, kl), R = lerp(145, 300, kl);
      roundInset(ctx, 'horns', 192, 220, 145, x, y, R, '160,250,230');
      ring(ctx, t, tHorns - 0.2, W / 2, 900, { maxR: 800, life: 0.7, color: '200,255,240', width: 18 });
    }
    jade(ctx, { wash: 0.04 });
    if (t > tSent - 0.3) jplate(ctx, 'RESONANCE CONNECTION', W / 2, 230, t, tSent - 0.3, 40);
    if (t > tJue - 0.3) jserif(ctx, 'with the Sentinel Jué', W / 2, 340, 66, { italic: true, alpha: fadeIn(t, tJue - 0.3) });
    if (t > tHorns - 0.2) withT(ctx, W / 2, 1255, pop(t, tHorns - 0.2, 0.45), 0, () => jplate(ctx, 'LOONG HORNS', 0, 0, t, tHorns - 0.2, 40));
  },

  // 3 — Loong Scales under strain... and when she's shy, like meeting the Rover.
  (ctx, t, dur) => {
    const tPush = when('push', 0, 0.0), tScales = when('scales', 0, 1.6), tShy = when('shy', 0, 5.0), tRover = when('rover', 0, 7.0);
    backdrop(ctx, 'story', t, dur, 0.5, 0.4, 0.45);
    const kc = fadeIn(t, 0, 0.6);
    framed(ctx, 'story', 40, 230 + (1 - kc) * 60, 1000, 704, { alpha: kc });
    // Scales shimmer in around the frame, then (shy) a soft blush of pink.
    const ks = prog(t, tScales - 0.3, 1.0);
    const r = rng(12);
    // Two small clusters creeping in from opposite corners of the card.
    for (let i = 0; i < 16; i++) {
      const corner = i % 2, row = Math.floor(i / 4) % 2, col = Math.floor(i / 2) % 2 + 2 * (i >= 8 ? 1 : 0);
      const x = corner ? 1000 - col * 40 - row * 20 : 80 + col * 40 + row * 20, y = corner ? 270 + row * 36 + col * 14 : 900 - row * 36 - col * 14;
      scale(ctx, x, y, 0.55, ease.outBack(prog(t, tScales - 0.3 + i * 0.05, 0.45)), t, i);
    }
    const kb = fadeIn(t, tShy - 0.3, 0.6);
    if (kb > 0) {
      glow(ctx, W / 2, 560, 600, '255,160,190', 0.25 * kb);
      for (let i = 0; i < 6; i++) scale(ctx, 380 + i * 64, 1000 + Math.sin(i * 1.7) * 18, 0.6, ease.outBack(prog(t, tShy - 0.2 + i * 0.08, 0.4)), t, i + 30);
    }
    jade(ctx, { wash: 0.04 });
    band(ctx, 1050, 1290, 0.65);
    if (t > tScales - 0.3 && t < tShy - 0.4) jplate(ctx, 'LOONG SCALES', W / 2, 1150, t, tScales - 0.3, 44);
    if (t > tShy - 0.3) jserif(ctx, '...when she\'s shy', W / 2, 1120, 74, { italic: true, alpha: fadeIn(t, tShy - 0.3), fill: ['#FFFFFF', '#FFE1EA', '#FF9FBF'], glowColor: 'rgba(255,140,180,0.9)' });
    if (t > tRover - 0.3) jplate(ctx, 'MEETING THE ROVER', W / 2, 1225, t, tRover - 0.3, 36);
  },

  // 4 — Jué's prophecy sends her visions in dreams; one showed the Rover.
  (ctx, t, dur) => {
    const tProph = when('prophecy', 0, 1.0), tVis = when('visions', 0, 2.4), tFig = when('figure', 0, 5.2), tRover = when('rover', 0, 7.2);
    cover(ctx, 'vert', t, dur, [0.6, 0.12, 2.0], [0.55, 0.3, 1.3], { filter: `blur(${(8 * prog(t, tVis - 0.3, 1.0)).toFixed(1)}px)` });
    const kd = prog(t, tVis - 0.3, 1.0);
    ctx.fillStyle = `rgba(4,10,30,${0.25 + 0.5 * kd})`; ctx.fillRect(0, 0, W, H);
    // Dream ripples.
    for (let i = 0; i < 3; i++) if (t > tVis - 0.2 + i * 0.5) ring(ctx, t, tVis - 0.2 + i * 0.5, W / 2, 760, { maxR: 900, life: 1.4, color: '170,220,255', width: 6 });
    // A glowing figure in the mist.
    const kf = fadeIn(t, tFig - 0.4, 1.0);
    if (kf > 0) {
      const x = W / 2, y = 780, bob = Math.sin(t * 1.5) * 8;
      glow(ctx, x, y, 380, '210,235,255', 0.4 * kf);
      ctx.save(); ctx.globalAlpha = kf * 0.75; ctx.filter = 'blur(7px)';
      ctx.fillStyle = vgrad(ctx, y - 280, y + 240, [[0, 'rgba(240,248,255,0.95)'], [0.6, 'rgba(210,230,255,0.6)'], [1, 'rgba(180,210,255,0)']]);
      ctx.shadowColor = 'rgba(200,230,255,1)'; ctx.shadowBlur = 60;
      ctx.beginPath(); ctx.arc(x, y - 210 + bob, 62, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - 70, y - 130 + bob); ctx.quadraticCurveTo(x, y - 160 + bob, x + 70, y - 130 + bob);
      ctx.quadraticCurveTo(x + 120, y + 40 + bob, x + 170 + Math.sin(t * 2) * 15, y + 230 + bob);
      ctx.quadraticCurveTo(x, y + 200 + bob, x - 170 + Math.sin(t * 2 + 1) * 15, y + 230 + bob);
      ctx.quadraticCurveTo(x - 120, y + 40 + bob, x - 70, y - 130 + bob); ctx.fill();
      ctx.restore();
    }
    if (t > tRover - 0.2) flash(ctx, t, tRover - 0.2, { color: '220,240,255', peak: 0.5, life: 0.5 });
    wishes(ctx, t, { n: 14, seed: 41, a: 0.5 });
    jade(ctx, { wash: 0.03 });
    band(ctx, 1040, 1290, 0.6);
    if (t > tProph - 0.3) jplate(ctx, "JUÉ'S PROPHECY", W / 2, 220, t, tProph - 0.3, 42);
    if (t > tVis - 0.3 && t < tRover - 0.4) jserif(ctx, 'visions in her dreams', W / 2, 1150, 70, { italic: true, alpha: fadeIn(t, tVis - 0.3) });
    if (t > tRover - 0.2) withT(ctx, W / 2, 1150, pop(t, tRover - 0.2, 0.45), 0, () => jserif(ctx, 'THE ROVER', 0, 0, 100));
  },

  // 5 — Five-star Spectro; her homemade Loong Buns and their fillings.
  (ctx, t, dur) => {
    const tStar = when('fivestar', 0, 0.4), tSpec = when('spectro', 0, 1.1), tBuns = when('buns', 0, 4.6), tCus = when('custard', 0, 5.6),
          tLotus = when('lotus', 0, 6.6), tBean = when('bean', 0, 7.6);
    backdrop(ctx, 'close', t, dur, 0.4, 0.35, 0.45);
    wishes(ctx, t, { n: 16, seed: 15, a: 0.6 });
    const p1 = 1 - prog(t, tBuns - 0.6, 0.4);
    if (p1 > 0) {
      ctx.save(); ctx.globalAlpha = p1;
      framed(ctx, 'close', 100, 250 + (1 - fadeIn(t, 0, 0.6)) * 60, 880, 630, { alpha: fadeIn(t, 0, 0.6) });
      for (let i = 0; i < 5; i++) {
        const k = pop(t, tStar - 0.2 + i * 0.07, 0.4);
        if (k > 0) withT(ctx, W / 2 + (i - 2) * 92, 1000, k, 0, () => {
          glow(ctx, 0, 0, 60, '255,210,120', 0.6);
          ctx.fillStyle = '#FFD27A'; ctx.fill(starPath(38, 16));
          ctx.lineWidth = 3; ctx.strokeStyle = '#7A4A10'; ctx.stroke(starPath(38, 16));
        });
      }
      badge(ctx, t, tSpec - 0.2, W / 2, 1165, 'SPECTRO', '255,225,130', 82);
      ctx.restore();
    }
    const kb = ease.outBack(prog(t, tBuns - 0.4, 0.6));
    if (kb > 0) {
      roundInset(ctx, 'buns', 170, 170, 165, W / 2, 700, 300 * kb, '255,200,160');
      [[tCus, 'CUSTARD', -280], [tLotus, 'LOTUS SEED', 0], [tBean, 'SWEET BEAN', 280]].forEach(([t0, s, dx]) => {
        if (t > t0 - 0.3) withT(ctx, W / 2 + dx, 1110, pop(t, t0 - 0.3, 0.45), 0, () => jplate(ctx, s, 0, 0, t, t0 - 0.3, 30));
      });
    }
    jade(ctx, { wash: 0.04 });
    if (t > tBuns - 0.3) jplate(ctx, 'HOMEMADE LOONG BUNS', W / 2, 230, t, tBuns - 0.3, 40);
  },

  // 6 — Outro: are you lucky enough to have Jinhsi?
  (ctx, t, dur) => {
    const tLucky = when('lucky', 0, 0.6), tHave = when('have', 0, 1.4), tComments = when('comments', 0, 3.2);
    cover(ctx, 'vert', t, dur, [0.5, 0.34, 1.5], [0.5, 0.36, 1.65]);
    wishes(ctx, t, { n: 30, seed: 51 });
    jade(ctx, { wash: 0.06 });
    band(ctx, 900, 1290, 0.6 * fadeIn(t, 0, 0.6));
    if (t > tLucky - 0.3) jserif(ctx, 'Are you lucky enough', W / 2, 1000, 84, { italic: true, alpha: fadeIn(t, tLucky - 0.3, 0.6) });
    if (t > tHave - 0.3) jserif(ctx, 'to have Jinhsi?', W / 2, 1105, 84, { italic: true, alpha: fadeIn(t, tHave - 0.3, 0.6) });
    if (t > tComments - 0.3) jplate(ctx, 'TELL ME IN THE COMMENTS', W / 2, 1215, t, tComments - 0.3, 38);
  },
];
</script>
</body>
</html>
