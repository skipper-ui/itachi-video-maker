<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Who is Carlotta? motion scenes</title>
<script>
// Official Kuro Games art (see presskit/SOURCE.txt), cropped only and credited.
window.ART = Object.fromEntries(['sofa_v', 'card_full', 'card_face', 'report', 'surface'].map(n => [n, `presskit/${n}.jpg`]));
</script>
<script src="../../motion/lib.js"></script>
<script src="../../motion/wuwa.js"></script>
</head>
<body>
<script>
// Captions are burned in around y = 1300-1420, so keep that band calm.
// Carlotta's palette: Montelli gold on deep wine, with a magenta glow.
const GOLD = ['#FFFFFF', '#FFEBC2', '#E0A84E'];
const GGLOW = 'rgba(255,80,150,0.85)';
const gplate = (ctx, str, x, y, t, t0, size = 44) =>
  plate(ctx, str, x, y, t, t0, size, { border: 'rgba(240,200,130,0.9)', bg: 'rgba(45,8,25,0.7)', color: '#FFF4E0' });
const gserif = (ctx, str, x, y, size, opts = {}) => serif(ctx, str, x, y, size, { fill: GOLD, glowColor: GGLOW, ...opts });
const fadeIn = (t, t0, d = 0.5) => ease.outCubic(prog(t, t0, d));

function wine(ctx, { wash = 0.12 } = {}) {
  ctx.fillStyle = `rgba(70,0,35,${wash})`; ctx.fillRect(0, 0, W, H);
  vignette(ctx, 0.72);
  credit(ctx, 'Art © Kuro Games · official Wuthering Waves art');
}

// Drifting gold motes.
function motes(ctx, t, { n = 30, seed = 4, alpha = 1 } = {}) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const x = (r() * W + Math.sin(t * 0.5 + i) * 40), y = ((r() * H - t * (20 + r() * 40)) % H + H) % H, s = 2 + r() * 4;
    ctx.fillStyle = `rgba(255,220,150,${alpha * (0.3 + 0.5 * Math.sin(t * 2 + i) ** 2)})`;
    ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
  }
}

// A cut opal: a faceted hexagon with an iridescent sheen.
function opal(ctx, x, y, s, rot = 0, t = 0) {
  withT(ctx, x, y, s, rot, () => {
    glow(ctx, 0, 0, 80, '255,120,190', 0.5);
    const pts = [...Array(6)].map((_, i) => [Math.cos(i * Math.PI / 3) * 40, Math.sin(i * Math.PI / 3) * 52]);
    const g = ctx.createLinearGradient(-40, -52, 40, 52);
    const h = (t * 60) % 360;
    g.addColorStop(0, `hsl(${h},90%,85%)`); g.addColorStop(0.5, `hsl(${(h + 120) % 360},85%,70%)`); g.addColorStop(1, `hsl(${(h + 240) % 360},80%,60%)`);
    ctx.fillStyle = g; ctx.fill(polyPath(pts));
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke(polyPath(pts));
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(40, 0); ctx.moveTo(-20, -52); ctx.lineTo(20, 52); ctx.moveTo(20, -52); ctx.lineTo(-20, 52); ctx.stroke();
  });
}

function framed(ctx, name, x, y, w, h, { alpha = 1, r = 30, border = 'rgba(240,200,130,0.95)' } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 50;
  ctx.fillStyle = '#000'; ctx.fill(rectPath(x, y, w, h, r));
  ctx.shadowBlur = 0;
  ctx.save(); ctx.clip(rectPath(x, y, w, h, r));
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(ARTS[name].img, x, y, w, h);
  ctx.restore();
  ctx.lineWidth = 5; ctx.strokeStyle = border; ctx.stroke(rectPath(x, y, w, h, r));
  ctx.restore();
}

function backdrop(ctx, name, t, dur, fx = 0.5, fy = 0.5, dark = 0.45) {
  cover(ctx, name, t, dur, [fx, fy, 1.25], [fx, fy, 1.35], { filter: 'blur(18px) saturate(1.2)' });
  ctx.fillStyle = `rgba(25,0,12,${dark})`; ctx.fillRect(0, 0, W, H);
}

function badge(ctx, t, t0, x, y, label, col, r = 80) {
  const k = pop(t, t0, 0.5);
  if (k <= 0) return;
  withT(ctx, x, y, k, 0, () => {
    glow(ctx, 0, 0, r * 1.8, col, 0.5 + 0.15 * Math.sin(t * 4));
    ctx.fillStyle = 'rgba(30,6,18,0.8)';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = `rgb(${col})`; ctx.stroke();
    serif(ctx, label, 0, 4, r * 0.36, { fill: ['#FFFFFF', `rgb(${col})`], glowColor: `rgba(${col},0.9)` });
  });
  ring(ctx, t, t0, x, y, { maxR: r * 3, life: 0.6, color: col, width: 10 });
}

// Highlight box that draws itself in.
function mark(ctx, k, x, y, w, h, col = 'rgba(200,20,70,') {
  if (k <= 0) return;
  ctx.lineWidth = 6; ctx.strokeStyle = `${col}${k})`; ctx.stroke(rectPath(x, y, w, h, 12));
}

window.scenes = [
  // 0 — By day, an art investor. By night, the family's problem solver. This is Carlotta.
  (ctx, t, dur) => {
    const tDay = when('day', 0, 0.3), tArt = when('art', 0, 1.6), tNight = when('night', 0, 2.5), tProb = when('problems', 0, 4.3),
          tGone = when('disappear', 0, 4.9), tCar = when('carlotta', 0, 6.7), tWW = when('wuthering', 0, 7.9);
    cover(ctx, 'sofa_v', t, dur, [0.72, 0.33, 2.0], [0.6, 0.36, 1.12]);
    // Night falls.
    const kn = ease.inOutCubic(prog(t, tNight - 0.3, 0.8)) * (1 - prog(t, tCar - 0.4, 0.6));
    if (kn > 0) { ctx.fillStyle = `rgba(10,0,25,${0.5 * kn})`; ctx.fillRect(0, 0, W, H); }
    motes(ctx, t, { n: 24 });
    wine(ctx, { wash: 0.06 });
    const early = 1 - prog(t, tCar - 0.5, 0.4);
    if (early > 0) {
      ctx.save(); ctx.globalAlpha = early;
      if (t > tDay - 0.2) gserif(ctx, 'By day,', W / 2, 960, 86, { italic: true, alpha: fadeIn(t, tDay - 0.2) * (1 - 0.6 * kn) });
      if (t > tArt - 0.2) gplate(ctx, 'ART INVESTOR', W / 2, 1070, t, tArt - 0.2, 40);
      if (t > tNight - 0.2) gserif(ctx, 'By night,', W / 2, 1170, 86, { italic: true, alpha: fadeIn(t, tNight - 0.2) });
      // "problems" written, then dissolving on "disappear".
      const kg = prog(t, tGone, 0.7);
      if (t > tProb - 0.2) gserif(ctx, 'problems', W / 2, 1240, 64, { italic: true, alpha: fadeIn(t, tProb - 0.2) * (1 - kg), fill: ['#FFFFFF', '#FFC2D8', '#FF5C9A'] });
      if (t > tGone - 0.1) burst(ctx, t, tGone, W / 2, 1240, { n: 36, color: '255,200,220', speed: 500, life: 0.9, size: 7 });
      ctx.restore();
    }
    const kc = prog(t, tCar - 0.2, 0.6);
    if (kc > 0) {
      ctx.fillStyle = `rgba(255,220,170,${0.3 * (1 - kc)})`; ctx.fillRect(0, 0, W, H);
      withT(ctx, W / 2, 1060, lerp(1.25, 1, ease.outCubic(kc)), 0, () => gserif(ctx, 'CARLOTTA', 0, 0, 150, { alpha: ease.outCubic(kc) }));
    }
    if (t > tWW - 0.3) gplate(ctx, 'WUTHERING WAVES', W / 2, 1200, t, tWW - 0.3, 38);
  },

  // 1 — Second daughter of the Montelli family; codename: Opal.
  (ctx, t, dur) => {
    const tSec = when('second', 0, 0.4), tMon = when('montelli', 0, 1.3), tSecret = when('secret', 0, 4.0), tCode = when('codename', 0, 6.0), tOpal = when('opal', 0, 7.2);
    cover(ctx, 'card_full', t, dur, [0.56, 0.2, 1.0], [0.56, 0.24, 1.08]);
    const ks = Math.sin(clamp((t - tSecret + 0.2) / 1.6) * Math.PI);
    if (ks > 0) { ctx.fillStyle = `rgba(15,0,20,${0.35 * ks})`; ctx.fillRect(0, 0, W, H); }
    motes(ctx, t, { n: 18, seed: 8 });
    wine(ctx);
    const early = 1 - prog(t, tCode - 0.5, 0.4);
    if (t > tSec - 0.2) gplate(ctx, 'THE SECOND DAUGHTER', W / 2, 960, t, tSec - 0.2, 40);
    if (t > tMon - 0.2 && early > 0) gserif(ctx, 'of the Montelli family', W / 2, 1075, 66, { italic: true, alpha: fadeIn(t, tMon - 0.2) * early });
    if (t > tCode - 0.3) gplate(ctx, 'CODENAME', W / 2, 1060, t, tCode - 0.3, 40);
    const ko = prog(t, tOpal - 0.15, 0.5);
    if (ko > 0) {
      withT(ctx, W / 2, 1185, lerp(1.4, 1, ease.outBack(ko)), 0, () => gserif(ctx, 'OPAL', 0, 0, 120));
      opal(ctx, W / 2 - 250, 1180, 0.8 * ease.outBack(ko), -0.3, t);
      opal(ctx, W / 2 + 250, 1180, 0.8 * ease.outBack(ko), 0.3, t + 2);
      ring(ctx, t, tOpal - 0.1, W / 2, 1180, { maxR: 500, life: 0.6, color: '255,180,220', width: 10 });
    }
  },

  // 2 — Not real jewels: crystals from her Forte, decoration or ammunition.
  (ctx, t, dur) => {
    const tOp = when('opals', 0, 0.5), tReal = when('real', 0, 1.6), tCry = when('crystals', 0, 3.3), tForte = when('forte', 0, 4.8),
          tDeco = when('decoration', 0, 6.3), tFired = when('fired', 0, 7.5), tAmmo = when('ammunition', 0, 8.1);
    backdrop(ctx, 'card_full', t, dur, 0.55, 0.25, 0.45);
    motes(ctx, t, { n: 20, seed: 12, alpha: 0.7 });
    // The report slides in on "crystals" and focuses on the Forte line.
    const kp = fadeIn(t, tCry - 0.3, 0.6);
    if (kp > 0) {
      const z = lerp(0.62, 1.12, ease.inOutCubic(prog(t, tCry, 1.0))), fx = lerp(490, 500, kp), fy = lerp(765, 525, ease.inOutCubic(prog(t, tCry, 1.0)));
      ctx.save(); ctx.globalAlpha = kp;
      ctx.translate(W / 2, 700 + (1 - kp) * 150); ctx.rotate(-0.015); ctx.scale(z, z); ctx.translate(-fx, -fy);
      ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 60; ctx.fillStyle = '#EEE'; ctx.fillRect(0, 0, 980, 1530); ctx.shadowBlur = 0;
      ctx.imageSmoothingQuality = 'high'; ctx.drawImage(ARTS.report.img, 0, 0);
      mark(ctx, prog(t, tCry + 0.6, 0.4), 40, 300, 330, 70);
      mark(ctx, prog(t, tForte - 0.1, 0.4), 40, 470, 930, 110);
      ctx.restore();
    }
    wine(ctx, { wash: 0.04 });
    // Opals float in, labelled "not real jewels", then fly off as rounds on "fired".
    const kOut = prog(t, tCry - 0.4, 0.4);
    const kf = prog(t, tFired - 0.1, 0.5);
    for (let i = 0; i < 5; i++) {
      const k = pop(t, tOp - 0.2 + i * 0.08, 0.45);
      if (k <= 0) continue;
      const a = (i / 5) * Math.PI * 2 + t * 0.6;
      const hx = W / 2 + Math.cos(a) * 230, hy = 640 + Math.sin(a) * 150;
      if (kOut < 1) opal(ctx, hx, hy, k * (1 - kOut), a, t + i);
    }
    if (t > tOp - 0.2 && kOut < 1) {
      ctx.save(); ctx.globalAlpha = 1 - kOut;
      if (t > tReal - 0.2) {
        withT(ctx, W / 2, 1080, pop(t, tReal - 0.2, 0.45), -0.05, () => gserif(ctx, 'NOT REAL JEWELS', 0, 0, 78));
      }
      ctx.restore();
    }
    const kband = fadeIn(t, tDeco - 0.4, 0.5);
    if (kband > 0) {
      ctx.fillStyle = vgrad(ctx, 980, 1320, [[0, 'rgba(25,0,12,0)'], [0.35, `rgba(25,0,12,${0.8 * kband})`], [0.75, `rgba(25,0,12,${0.8 * kband})`], [1, 'rgba(25,0,12,0)']]);
      ctx.fillRect(0, 980, W, 340);
    }
    if (t > tDeco - 0.3) gplate(ctx, 'DECORATION...', W / 2, 1100, t, tDeco - 0.3, 40);
    if (kf > 0) {
      for (let i = 0; i < 6; i++) {
        const y = 980 + i * 50 - 120, x = lerp(-150, W + 300, prog(t, tFired - 0.1 + i * 0.07, 0.45));
        ctx.strokeStyle = 'rgba(255,200,230,0.8)'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(x - 220, y); ctx.lineTo(x, y); ctx.stroke();
        opal(ctx, x, y, 0.45, Math.PI / 2, t + i);
      }
      flash(ctx, t, tFired, { color: '255,220,240', peak: 0.3 });
    }
    if (t > tAmmo - 0.2) withT(ctx, W / 2, 1225, pop(t, tAmmo - 0.2, 0.45), 0, () => gserif(ctx, '...or ammunition', 0, 0, 64, { italic: true }));
  },

  // 3 — Nothing is what it seems: the bag holds ammunition, the perfume bottle is a grenade.
  (ctx, t, dur) => {
    const tNo = when('nothing', 0, 0.1), tBag = when('bag', 0, 2.6), tPerf = when('perfume', 0, 4.7), tGren = when('grenade', 0, 6.2);
    const [sx, sy] = shakeAt(t, tGren, 18, 4);
    ctx.save(); ctx.translate(sx, sy);
    backdrop(ctx, 'card_full', t, dur, 0.5, 0.55, 0.5);
    motes(ctx, t, { n: 16, seed: 17, alpha: 0.6 });
    const kc = fadeIn(t, 0.1, 0.6);
    const cw = 962, ch = 454, cx = (W - cw) / 2, cy = 420 + (1 - kc) * 80;
    framed(ctx, 'surface', cx, cy, cw, ch, { alpha: kc, r: 18 });
    mark(ctx, prog(t, tBag - 0.2, 0.4) * (1 - prog(t, tPerf - 0.4, 0.3)), cx + 14, cy + 30, 640, 150);
    // The perfume bottle lifts out of the card, glowing.
    const kb = ease.outBack(prog(t, tPerf - 0.2, 0.6));
    if (kb > 0) {
      const img = ARTS.surface.img, bx = lerp(cx + 786, W / 2, kb), by = lerp(cy + 227, 990, kb), s = lerp(1, 1.75, kb);
      glow(ctx, bx, by, 260 * kb, '255,90,170', 0.6);
      ctx.save(); ctx.beginPath(); ctx.arc(bx, by, 110 * s, 0, Math.PI * 2); ctx.clip();
      ctx.drawImage(img, 700, 110, 172, 234, bx - 86 * s, by - 117 * s, 172 * s, 234 * s);
      ctx.restore();
      // Fuse spark on top before the blast.
      if (t > tGren - 0.6 && t < tGren) burst(ctx, t, tGren - 0.6, bx, by - 120 * s, { n: 10, color: '255,220,120', speed: 160, life: 0.4, size: 5 });
    }
    if (t > tGren - 0.05) {
      flash(ctx, t, tGren - 0.05, { color: '255,230,200', peak: 0.7, life: 0.45 });
      burst(ctx, t, tGren - 0.05, W / 2, 990, { n: 60, color: '255,150,190', speed: 1100, life: 0.9, size: 10 });
      ring(ctx, t, tGren - 0.05, W / 2, 990, { maxR: 900, life: 0.7, color: '255,200,150', width: 24 });
    }
    ctx.restore();
    wine(ctx, { wash: 0.04 });
    if (t > tNo - 0.2) gplate(ctx, 'NOTHING IS WHAT IT SEEMS', W / 2, 250, t, tNo - 0.2, 40);
    if (t > tGren - 0.1) withT(ctx, W / 2, 1240, pop(t, tGren - 0.1, 0.45), -0.04, () => gserif(ctx, 'HAND GRENADE', 0, 0, 72));
  },

  // 4 — Gloves off with her teeth, a curtsy, then a burst of light.
  (ctx, t, dur) => {
    const tGlove = when('gloves', 0, 1.8), tCurt = when('curtsy', 0, 4.5), tPist = when('pistol', 0, 5.9), tBurst = when('burst', 0, 7.1);
    const [sx, sy] = shakeAt(t, tBurst, 20, 5);
    ctx.save(); ctx.translate(sx, sy);
    cover(ctx, 'sofa_v', t, dur, [0.72, 0.33, 2.4], [0.68, 0.36, 1.7]);
    ctx.restore();
    motes(ctx, t, { n: 14, seed: 23, alpha: 0.6 });
    // Aim: a reticle tightens on "pistol".
    const ka = prog(t, tPist - 0.3, 0.8) * (1 - prog(t, tBurst + 0.1, 0.2));
    if (ka > 0) {
      const r = lerp(420, 150, ease.outCubic(ka));
      ctx.save(); ctx.globalAlpha = Math.min(1, ka * 2);
      ctx.strokeStyle = 'rgba(255,215,150,0.95)'; ctx.lineWidth = 5;
      const RX = 860, RY = 330;  // her target, off to the side
      ctx.beginPath(); ctx.arc(RX, RY, r * 0.6, 0, Math.PI * 2); ctx.stroke();
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { ctx.beginPath(); ctx.moveTo(RX + dx * (r * 0.6 - 30), RY + dy * (r * 0.6 - 30)); ctx.lineTo(RX + dx * (r * 0.6 + 30), RY + dy * (r * 0.6 + 30)); ctx.stroke(); }
      ctx.restore();
    }
    // A burst of light.
    if (t > tBurst - 0.1) {
      const kb = prog(t, tBurst - 0.1, 0.8);
      glow(ctx, 860, 330, 900 * kb, '255,240,220', 0.9 * (1 - kb));
      flash(ctx, t, tBurst - 0.1, { color: '255,250,235', peak: 0.95, life: 0.5 });
      ring(ctx, t, tBurst - 0.1, 860, 330, { maxR: 1100, life: 0.7, color: '255,220,160', width: 30 });
      burst(ctx, t, tBurst - 0.1, 860, 330, { n: 50, color: '200,235,255', speed: 1200, life: 0.9, size: 8 });
    }
    wine(ctx, { wash: 0.05 });
    const g = 1 - prog(t, tCurt - 0.5, 0.3), c = 1 - prog(t, tPist - 0.4, 0.3);
    if (t > tGlove - 0.3 && g > 0) { ctx.save(); ctx.globalAlpha = g; gplate(ctx, 'GLOVES OFF', W / 2, 1150, t, tGlove - 0.3, 44); ctx.restore(); }
    if (t > tCurt - 0.3 && c > 0) { ctx.save(); ctx.globalAlpha = c; gserif(ctx, 'a curtsy...', W / 2, 1150, 80, { italic: true, alpha: fadeIn(t, tCurt - 0.3) }); ctx.restore(); }
    if (t > tBurst - 0.1) withT(ctx, W / 2, 1150, pop(t, tBurst, 0.45), 0, () => gserif(ctx, 'BANG.', 0, 0, 110));
  },

  // 5 — Five-star Glacio with pistols; off duty, coffee with citrus.
  (ctx, t, dur) => {
    const tStar = when('fivestar', 0, 0.3), tGl = when('glacio', 0, 1.0), tPis = when('pistols', 0, 2.3), tOff = when('off', 0, 3.6),
          tCof = when('coffee', 0, 5.3), tThree = when('three', 0, 5.8), tCit = when('citrus', 0, 8.7);
    backdrop(ctx, 'card_full', t, dur, 0.5, 0.3, 0.4);
    motes(ctx, t, { n: 18, seed: 29, alpha: 0.7 });
    const kc = fadeIn(t, 0, 0.6);
    framed(ctx, 'card_face', 120, 220 + (1 - kc) * 60, 840, 720, { alpha: kc, r: 26 });
    wine(ctx, { wash: 0.04 });
    const part1 = 1 - prog(t, tOff - 0.4, 0.4);
    if (part1 > 0) {
      ctx.save(); ctx.globalAlpha = part1;
      for (let i = 0; i < 5; i++) {
        const k = pop(t, tStar - 0.2 + i * 0.07, 0.4);
        if (k > 0) withT(ctx, W / 2 + (i - 2) * 92, 1040, k, 0, () => {
          glow(ctx, 0, 0, 60, '255,210,120', 0.6);
          ctx.fillStyle = '#FFD27A'; ctx.fill(starPath(38, 16));
          ctx.lineWidth = 3; ctx.strokeStyle = '#7A4A10'; ctx.stroke(starPath(38, 16));
        });
      }
      badge(ctx, t, tGl - 0.2, W / 2 - 170, 1185, 'GLACIO', '150,215,255', 76);
      badge(ctx, t, tPis - 0.2, W / 2 + 170, 1185, 'PISTOLS', '255,200,140', 76);
      ctx.restore();
    }
    if (t > tOff - 0.3) gplate(ctx, 'OFF DUTY', W / 2, 1030, t, tOff - 0.3, 40);
    // Coffee cup with steam.
    const kq = pop(t, tCof - 0.3, 0.5);
    if (kq > 0) withT(ctx, 340, 1185, kq, 0, () => {
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = `rgba(255,255,255,${0.35 + 0.2 * Math.sin(t * 3 + i)})`; ctx.lineWidth = 6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-30 + i * 30, -70);
        ctx.bezierCurveTo(-50 + i * 30, -100 - 10 * Math.sin(t * 2 + i), -10 + i * 30, -120, -30 + i * 30, -150); ctx.stroke();
      }
      ctx.fillStyle = '#F4EDE4'; ctx.fill(rectPath(-70, -60, 140, 110, 22));
      ctx.lineWidth = 12; ctx.strokeStyle = '#F4EDE4'; ctx.beginPath(); ctx.arc(80, -5, 26, -1.3, 1.3); ctx.stroke();
      ctx.fillStyle = '#5A2E14'; ctx.fill(rectPath(-62, -58, 124, 18, 8));
      ctx.fillStyle = '#C9A15A'; ctx.fillRect(-70, -10, 140, 8);
    });
    if (t > tThree - 0.2) withT(ctx, 680, 1170, pop(t, tThree - 0.2, 0.45), 0, () => {
      gserif(ctx, '3 / 10', 0, -10, 100);
      serif(ctx, 'appearances', 0, 70, 34, { italic: true, fill: ['#FFFFFF', '#FFE3B0'] });
    });
    // Citrus slice pops onto the cup.
    const kl = pop(t, tCit - 0.25, 0.45);
    if (kl > 0) withT(ctx, 430, 1110, kl, t * 0.5, () => {
      ctx.fillStyle = '#FFD84A'; ctx.beginPath(); ctx.arc(0, 0, 42, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFF2A8'; ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#FFD84A'; ctx.lineWidth = 4;
      for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 34, Math.sin(a) * 34); ctx.stroke(); }
    });
  },

  // 6 — Outro: is Carlotta on your team?
  (ctx, t, dur) => {
    const tCar = when('carlotta', 0, 0.7), tTeam = when('team', 0, 1.4), tComments = when('comments', 0, 2.6);
    cover(ctx, 'card_full', t, dur, [0.56, 0.22, 1.05], [0.56, 0.26, 1.14]);
    motes(ctx, t, { n: 24, seed: 31 });
    wine(ctx, { wash: 0.08 });
    if (t > tCar - 0.3) gserif(ctx, 'Is Carlotta', W / 2, 980, 96, { italic: true, alpha: fadeIn(t, tCar - 0.3, 0.6) });
    if (t > tTeam - 0.3) gserif(ctx, 'on your team?', W / 2, 1095, 96, { italic: true, alpha: fadeIn(t, tTeam - 0.3, 0.6) });
    if (t > tComments - 0.3) gplate(ctx, 'TELL ME IN THE COMMENTS', W / 2, 1215, t, tComments - 0.3, 38);
  },
